.bl-row { width: 100%; display: grid; grid-template-columns: minmax(110px, 30%) 1fr auto auto; gap: 10px; align-items: center; border: 0; background: transparent; padding: 7px 6px; border-radius: var(--r-sm); text-align: left; font: inherit; color: inherit; cursor: pointer; }
.bl-row:hover:not(:disabled) { background: var(--surface-2); }
.bl-row:disabled { cursor: default; opacity: 1; }
.bl-label { min-width: 0; font-size: 0.86rem; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.bl-label small { display: block; color: var(--muted); font-size: 0.74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bl-track { position: relative; height: 14px; }
.bl-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--s1); min-width: 2px; }
.bl-fill.rag-warn { background: color-mix(in srgb, var(--s1) 70%, var(--surface)); }
.bl-fill.rag-bad { background: color-mix(in srgb, var(--s1) 45%, var(--surface)); }
.bl-track i { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.bl-num { font-size: 0.84rem; font-weight: 600; min-width: 5.5em; text-align: right; }
@media (max-width: 560px) {
  .bl-row { grid-template-columns: 1fr auto; }
  .bl-track { grid-column: 1 / -1; order: 5; }
}

/* diverging bars */
.divbars { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.db-row { width: 100%; display: grid; grid-template-columns: minmax(100px, 42%) 1fr auto; gap: 10px; align-items: center; border: 0; background: transparent; padding: 5px 4px; font: inherit; color: inherit; text-align: left; border-radius: 8px; }
.db-row:disabled { cursor: default; opacity: 1; }
.db-label { font-size: 0.82rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.db-track { position: relative; height: 12px; }
.db-zero { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink-2); }
.db-fill { position: absolute; top: 0; bottom: 0; min-width: 2px; }
.db-fill.pos { background: var(--s1); border-radius: 0 4px 4px 0; }
.db-fill.neg { background: var(--div-bad); border-radius: 4px 0 0 4px; }
.db-num { font-size: 0.82rem; font-weight: 600; min-width: 5.5em; text-align: right; }

/* operational */
.ops-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .ops-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .ops-tiles { grid-template-columns: 1fr; } }
.ops-tile { text-align: left; font: inherit; color: inherit; cursor: pointer; display: grid; gap: 8px; padding: 16px; border-radius: var(--r); border: 2px solid transparent; background: var(--surface); box-shadow: var(--shadow); }
.ops-tile.on { border-color: var(--ink-2); }
.ops-tile-head { display: flex; gap: 10px; align-items: center; }
.ops-tile-head b { display: block; font-family: var(--f-display); font-weight: 500; }
.ops-tile-head small { display: block; color: var(--muted); font-size: 0.75rem; }
.signal { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; flex: none; color: #fff; }
.signal.small { width: 22px; height: 22px; font-size: 0.75rem; }
.sig-good { background: var(--good); box-shadow: 0 0 0 4px var(--good-bg); }
.sig-warn { background: var(--warn); box-shadow: 0 0 0 4px var(--warn-bg); }
.sig-bad { background: var(--bad); box-shadow: 0 0 0 4px var(--bad-bg); }
.signal.small { box-shadow: none; }
.ops-big { font-family: var(--f-display); font-size: 1.7rem; font-weight: 500; line-height: 1.1; display: flex; align-items: baseline; gap: 8px; }
.ops-big small { font-family: var(--f-body); font-size: 0.78rem; color: var(--muted); font-weight: 400; }
.ops-tile.tone-good .ops-big { color: var(--good); }
.ops-tile.tone-warn .ops-big { color: var(--warn); }
.ops-tile.tone-bad .ops-big { color: var(--bad); }
.ops-tile.tone-good, .ops-tile.tone-warn, .ops-tile.tone-bad { background: var(--surface); }
.ops-tile.tone-good .meter { color: var(--good); }
.ops-tile.tone-warn .meter { color: var(--warn); }
.ops-tile.tone-bad .meter { color: var(--bad); }
.ops-kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 0; font-size: 0.78rem; }
.ops-kv dt { color: var(--muted); }
.ops-kv dd { margin: 0; font-weight: 600; }
.lifecycle h4 { margin: 4px 0 8px; }
.lifecycle ol { list-style: none; margin: 0 0 12px; padding: 0; position: relative; }
.lifecycle li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; position: relative; padding-bottom: 10px; }
.lifecycle li:not(:last-child)::before { content: ''; position: absolute; left: 7px; top: 16px; bottom: -2px; width: 2px; background: var(--line); }
.lc-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--good); margin-top: 3px; box-shadow: 0 0 0 3px var(--good-bg); }
.lifecycle li.late .lc-dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
.lc-name { font-weight: 600; font-size: 0.88rem; }
.lc-bar { position: relative; height: 10px; background: var(--surface-2); border-radius: 5px; margin: 5px 0 3px; }
.lc-p50 { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s1); border-radius: 5px; }
.lc-p90 { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--s2); border-radius: 2px; }
.lc-bar i { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); }
.table-wrap.tall { max-height: 460px; overflow: auto; }
.table-wrap.tall thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
tr.row-bad td { background: color-mix(in srgb, var(--bad-bg) 45%, transparent); }
table.data tr.sel td { background: var(--accent-soft); }
.empty-ok { color: var(--good); font-weight: 600; padding: 14px 4px; }

/* tactical */
.ch-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .ch-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .ch-cards { grid-template-columns: 1fr; } }
.ch-card { text-align: left; font: inherit; color: inherit; cursor: pointer; display: grid; gap: 10px; align-content: start; padding: 16px; border-radius: var(--r); border: 2px solid transparent; background: var(--surface); box-shadow: var(--shadow); transition: opacity 0.2s, border-color 0.2s; }
.ch-card.on { border-color: var(--accent); }
.ch-card.dim { opacity: 0.55; }
.ch-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.ch-head b { font-family: var(--f-display); font-weight: 500; }
.ch-main { font-family: var(--f-display); font-size: 1.5rem; line-height: 1.15; }
.ch-main small { display: block; font-family: var(--f-body); font-size: 0.76rem; color: var(--muted); }
.ch-kv { margin: 0; display: grid; gap: 6px; font-size: 0.8rem; border-top: 1px solid var(--line); padding-top: 8px; }
.ch-kv div { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.ch-kv dt { color: var(--muted); }
.ch-kv dd { margin: 0; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.ch-kv .pill { font-size: 0.7rem; padding: 1px 7px; }
button.sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
button.sort.on { color: var(--ink); }
table.board td.rank { font-weight: 700; color: var(--muted); }
table.data td { vertical-align: middle; }

/* analytical */
table.heat { border-collapse: separate; border-spacing: 3px; width: 100%; font-size: 0.84rem; }
table.heat th { font-weight: 600; color: var(--ink-2); font-size: 0.78rem; padding: 4px 6px; text-align: center; }
table.heat tbody th { text-align: left; white-space: nowrap; }
table.heat td { padding: 0; }
table.heat td.na { text-align: center; color: var(--muted); }
.heat-cell { width: 100%; min-width: 74px; border: 0; border-radius: 6px; padding: 9px 4px; cursor: pointer; display: grid; gap: 1px; font: inherit; text-align: center; }
.heat-cell b { font-size: 0.95rem; }
.heat-cell small { font-size: 0.7rem; opacity: 0.85; }
.heat-cell.on { outline: 3px solid var(--ink); outline-offset: 1px; }
.heat-total { text-align: center; font-weight: 700; padding: 0 8px !important; }
.heat-scale { display: flex; align-items: center; gap: 8px; font-size: 0.74rem; color: var(--muted); justify-content: flex-end; margin-top: 4px; }
.heat-scale i { width: 140px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--div-good), var(--div-mid), var(--div-bad)); }
.drill { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.drill-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.drill-head h4 { margin: 0; }
.mini-select { width: auto; padding: 6px 28px 6px 10px; font-size: 0.84rem; border-radius: 999px; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 0; font-size: 0.82rem; }
.stat-row dt { color: var(--muted); }
.stat-row dd { margin: 0; font-weight: 700; }
.pager { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 8px; }

/* alerts drawer */
.alerts { position: fixed; z-index: 40; top: 64px; right: 16px; width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 84px); overflow: auto; background: var(--surface); border-radius: var(--r); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.22); padding: 18px; }
.alerts-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
.alerts ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.alert { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); }
.alert.sev-bad { background: color-mix(in srgb, var(--bad-bg) 55%, var(--surface)); }
.alert-title { font-weight: 600; font-size: 0.9rem; }
.alert-action { font-size: 0.82rem; color: var(--ink-2); margin-top: 2px; }
.lens-chip { color: var(--lens); font-weight: 600; }

.print-only { display: none; }
@media print {
  .topbar, .filterbar, .alerts, .card-tools, .lens-tools, .pager, .bell { display: none !important; }
  .print-only { display: block; font-weight: 600; margin-bottom: 8px; }
  body { background: #fff; }
  .card, .kpi, .lens-head, .ops-tile, .ch-card { box-shadow: none !important; border: 1px solid #ccc !important; break-inside: avoid; }
  .table-wrap.tall { max-height: none; overflow: visible; }
  .bi-main { max-width: none; padding: 0; }
}
.filterbar .segmented { flex-wrap: nowrap; flex: none; }
</style>
