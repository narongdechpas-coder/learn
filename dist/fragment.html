:root[data-theme='dark'] {

* { box-sizing: border-box; }

/* ---------- top bar ---------- */
.topbar {

/* ---------- buttons & controls ---------- */
.btn {

.link { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; font-size: 0.85rem; }

input, select, textarea {
  width: 100%;

  border-radius: var(--r-sm);

}

.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.92rem; }
.segmented { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 2px; flex-wrap: wrap; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }

.pill { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 0.76rem; font-weight: 600; white-space: nowrap; }
.tone-info { background: var(--info-bg); color: var(--info); }

/* ---------- panels ---------- */
.panel, .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; }

.brand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 20px 0; }
.brand-btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 14px 10px; cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 1rem; }

.pkg-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
