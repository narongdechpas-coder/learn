:root[data-theme='dark'] {

* { box-sizing: border-box; }

/* ---------- top bar ---------- */
.topbar {

/* ---------- buttons & controls ---------- */
.btn {

.link { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; font-size: 0.85rem; }

input, select, textarea {
  width: 100%;

  border-radius: var(--r-sm);

}

.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.92rem; }
.segmented { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 2px; flex-wrap: wrap; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }

.pill { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 0.76rem; font-weight: 600; white-space: nowrap; }
.tone-info { background: var(--info-bg); color: var(--info); }

/* ---------- panels ---------- */
.panel, .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; }

.brand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 20px 0; }
.brand-btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 14px 10px; cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 1rem; }

.pkg-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }

.doc-tile { border: 1px dashed var(--line); border-radius: var(--r-sm); padding: 10px; display: grid; gap: 6px; align-content: start; justify-items: start; }
.doc-tile.has { border-style: solid; }
.doc-thumb { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 4px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: 1.4rem; border: 0; padding: 0; }
button.doc-thumb:not(:disabled) { cursor: zoom-in; }
.doc-tile.has .doc-thumb { color: var(--good); }
.doc-thumb img { width: 100%; height: 100%; object-fit: cover; }
.doc-label { font-size: 0.84rem; font-weight: 600; }
.timeline { list-style: none; padding: 0; margin: 10px 0 16px; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; color: var(--muted); position: relative; }
.timeline li .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.timeline li.done { color: var(--ink); }
.timeline li.done .dot { background: var(--accent); border-color: var(--accent); }
.timeline li.cancelled .dot { background: var(--bad); border-color: var(--bad); }
.track-detail h3 { margin-top: 16px; }

/* ---------- back office ---------- */
.bo-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.bo-sub { color: var(--ink-2); margin-top: 4px; font-size: 0.9rem; }
.count-badge { background: var(--ink); color: var(--surface); border-radius: 999px; padding: 1px 8px; font-weight: 700; font-size: 0.8rem; }
.bo-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.inline-field { display: inline-flex; gap: 8px; align-items: center; font-size: 0.84rem; color: var(--muted); }
.inline-field select { width: auto; }
.bell-wrap { position: relative; }
.bell { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.bell.ring { color: var(--accent); border-color: var(--accent); }
.bell.ring svg { animation: ring 1.6s ease-in-out 2; transform-origin: 50% 10%; }
@keyframes ring { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(14deg); } 20%, 40% { transform: rotate(-14deg); } }
.bell-count { position: absolute; top: -4px; right: -6px; background: var(--bad); color: var(--surface); font-size: 0.68rem; font-weight: 700; border-radius: 999px; padding: 1px 6px; border: 2px solid var(--surface); }
.bell-menu { position: absolute; right: 0; top: 46px; width: min(360px, calc(100vw - 32px)); max-height: 420px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); z-index: 30; }
.bell-menu-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.bell-menu ul { list-style: none; margin: 0; padding: 0; }
.notif { width: 100%; text-align: left; display: grid; gap: 2px; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 0.88rem; }
.notif:hover { background: var(--surface-2); }
.notif.unread { background: var(--accent-soft); font-weight: 600; }
.notif.kind-sla span:first-child { color: var(--bad); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.filters select { width: auto; max-width: 100%; }
.filters .search { flex: 1 1 220px; }
.bo-body { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; align-items: start; }
.backoffice.compact .bo-body { grid-template-columns: 1fr; }
@media (max-width: 900px) { .bo-body { grid-template-columns: 1fr; } }
.case-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.case-list ul { list-style: none; margin: 0; padding: 0; max-height: 72vh; overflow: auto; }
.backoffice.compact .case-list ul { max-height: 44vh; }
.case-row { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 11px 14px; cursor: pointer; display: grid; gap: 4px; }
.case-row:hover { background: var(--surface-2); }
.case-row.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.case-row.is-new .ref { color: var(--info); font-weight: 700; }
.cr-top, .cr-mid, .cr-bot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cr-top { justify-content: space-between; }
.cr-mid { font-size: 0.92rem; }
.cr-bot { font-size: 0.8rem; }
.cr-owner { margin-left: auto; }
.src { font-size: 0.76rem; color: var(--ink-2); }
.src-quote { color: var(--info); font-weight: 600; }
.list-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; font-size: 0.84rem; }
.case-detail-wrap { min-width: 0; }
.case-detail { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; }
.cd-head { display: flex; justify-content: space-between; gap: 12px; }
.cd-head h3 { font-size: 1.3rem; margin-top: 2px; }
.cd-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.cd-sla { display: flex; gap: 6px; flex-wrap: wrap; }
.cd-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; padding: 14px; background: var(--surface-2); border-radius: var(--r-sm); }
.quote-box { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.quote-box .field { width: 220px; }
.inline-confirm { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px; display: grid; gap: 10px; }
.inline-confirm .actions { margin: 0; }
.cd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .cd-grid { grid-template-columns: 1fr; } }
.cd-grid section { min-width: 0; }
.cd-grid h4, .case-detail section > h4 { margin-top: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 12px; font-size: 0.88rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.history { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 0; font-size: 0.86rem; max-height: 260px; overflow: auto; }
.history li { display: grid; grid-template-columns: 120px 1fr auto; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
@media (max-width: 560px) { .history li { grid-template-columns: 1fr; gap: 0; } }
.note-row { display: flex; gap: 8px; }
.lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78); display: grid; place-items: center; z-index: 50; padding: 24px; cursor: zoom-out; }
.lightbox img { max-height: 90vh; border-radius: 6px; }

.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.split-pane { min-width: 0; border: 1px dashed var(--line); border-radius: var(--r); padding: 12px; background: var(--bg); }
.pane-label { font-family: var(--f-display); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; }
@media (max-width: 1000px) { .split { grid-template-columns: 1fr; } }

/* ---------- toasts ---------- */
.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 60; width: min(380px, calc(100vw - 32px)); }
.toast { display: flex; align-items: stretch; border-radius: var(--r-sm); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); overflow: hidden; animation: slide 0.25s ease-out; border: 1px solid var(--line); }
@keyframes slide { from { transform: translateY(8px); opacity: 0.4; } to { transform: none; opacity: 1; } }
.toast.tone-info { background: var(--surface); color: var(--ink); box-shadow: inset 4px 0 0 var(--info), 0 8px 24px rgba(0, 0, 0, 0.2); }
.toast.tone-bad { background: var(--surface); color: var(--bad); box-shadow: inset 4px 0 0 var(--bad), 0 8px 24px rgba(0, 0, 0, 0.2); }
.toast-body { flex: 1; border: 0; background: transparent; text-align: left; padding: 12px 14px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
.toast-x { border: 0; background: transparent; padding: 0 12px; cursor: pointer; font-size: 1.1rem; color: var(--muted); }

/* ---------- dashboard ---------- */
.dashboard, .mail { display: grid; gap: 16px; }
.dash-head { margin-bottom: 0; }
.dash-filters { margin-bottom: 0; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 440px) { .kpis { grid-template-columns: 1fr; } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 4px; align-content: start; }
.kpi-value { font-family: var(--f-display); font-size: 1.75rem; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.kpi-foot { font-size: 0.82rem; }
.delta { font-weight: 700; }
.delta.up { color: var(--good); }
.delta.down { color: var(--bad); }
.delta.flat { color: var(--muted); }
.chart { position: relative; width: 100%; }
.chart svg { display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .axis { stroke: var(--ink-2); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .bar { fill: var(--series); transition: opacity 0.12s; }
.chart .bar.dim { opacity: 0.45; }
.tooltip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; min-width: 140px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2); }
.tt-label { opacity: 0.8; }
.tt-value { font-weight: 700; font-size: 0.95rem; }
.breakdowns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 4px; }
@media (max-width: 900px) { .breakdowns { grid-template-columns: 1fr; } }
.hbars { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.hbars li { display: grid; grid-template-columns: minmax(70px, 40%) 1fr auto; gap: 8px; align-items: center; font-size: 0.84rem; }
.hb-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.hb-track { height: 12px; background: transparent; position: relative; }
.hb-fill { display: block; height: 100%; background: var(--series); border-radius: 0 4px 4px 0; min-width: 2px; }
.hb-value { font-weight: 600; min-width: 4.5em; text-align: right; }
.dash-2col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .dash-2col { grid-template-columns: 1fr; } }
.funnel { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 12px; }
.fn-label { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 0.88rem; margin-bottom: 4px; }
.fn-track { height: 22px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.fn-fill { display: block; height: 100%; background: var(--series); border-radius: 0 4px 4px 0; }
.fn-step { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
.fn-step.low { color: var(--bad); font-weight: 600; }
.sla-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .sla-tiles { grid-template-columns: 1fr; } }
.sla-tile { border-radius: var(--r-sm); padding: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); display: grid; gap: 6px; }
.sla-big { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sla-tile.tone-good .sla-big { color: var(--good); }
.sla-tile.tone-warn .sla-big { color: var(--warn); }
.sla-tile.tone-bad .sla-big { color: var(--bad); }
.sla-mark { font-size: 0.9rem; width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; border: 2px solid currentColor; }
.sla-mark:empty { display: none; }
.meter { position: relative; height: 6px; background: var(--line); border-radius: 3px; }
.meter span { display: block; height: 100%; border-radius: 3px; background: currentColor; }
.sla-tile.tone-good .meter { color: var(--good); }
.sla-tile.tone-warn .meter { color: var(--warn); }
.sla-tile.tone-bad .meter { color: var(--bad); }
.meter i { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--ink-2); }
.sla-kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 4px 0 0; font-size: 0.78rem; }
.sla-kv dt { color: var(--muted); }
.sla-kv dd { margin: 0; font-weight: 600; }
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
table.data th, table.data td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.data th { font-size: 0.76rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
table.data .r { text-align: right; }
table.data tr.total td { font-weight: 700; border-bottom: 0; }
.bad-text { color: var(--bad); font-weight: 600; }
.overdue { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.overdue-row { width: 100%; display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 7px 10px; cursor: pointer; font-size: 0.84rem; }
.overdue-row:hover { border-color: var(--bad); }
@media (max-width: 560px) { .overdue-row { grid-template-columns: 1fr auto; } }

/* ---------- mail ---------- */
.mail-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.mail-list li { border-bottom: 1px solid var(--line); }
.mail-row { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; border: 0; background: transparent; padding: 12px 16px; cursor: pointer; }
.mail-row:hover { background: var(--surface-2); }
.mail-subject { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.aud { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.aud-customer { background: var(--accent-soft); color: var(--accent); }
.aud-staff { background: var(--info-bg); color: var(--info); }
.mail-body { padding: 0 16px 16px; display: grid; gap: 8px; justify-items: start; }
.mail-body pre { white-space: pre-wrap; font-family: var(--f-body); margin: 0; padding: 12px 14px; background: var(--surface-2); border-radius: var(--r-sm); width: 100%; }
@media (max-width: 560px) { .mail-row { grid-template-columns: 1fr; gap: 4px; } }

/* ---------- vehicle code, brand icons ---------- */
.car-section { margin-top: 22px; display: grid; gap: 8px; transition: opacity 0.25s; }
.car-section.locked { opacity: 0.55; }
.section-label { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 600; font-size: 1rem; }
.section-n { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--surface); display: inline-grid; place-items: center; font-size: 0.75rem; flex: none; }
.usage-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 4px; }
@media (max-width: 760px) { .usage-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.usage-card { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 12px; cursor: pointer; display: grid; justify-items: start; gap: 2px; text-align: left; color: var(--ink-2); transition: border-color 0.2s, background 0.2s, transform 0.15s; }
.usage-card:hover { border-color: var(--ink-2); }
.usage-card:active { transform: scale(0.98); }
.usage-card.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
.usage-card.other { border-style: dashed; }
.usage-icon { margin-bottom: 4px; }
.usage-card.on .usage-icon { animation: drive 0.5s ease-out; }
@keyframes drive { from { transform: translateX(-8px); opacity: 0.4; } to { transform: none; opacity: 1; } }
.usage-code { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; color: var(--ink); line-height: 1.1; }
.usage-card.on .usage-code { color: var(--accent); }
.usage-name { font-weight: 600; font-size: 0.86rem; color: var(--ink); }
.usage-hint { font-size: 0.76rem; color: var(--muted); }
.brand-grid { margin: 4px 0 0; }
.brand-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.brand-icon { flex: none; display: inline-block; vertical-align: middle; }
.chip .brand-icon { margin-right: 4px; }
.self-badge { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; padding: 2px 9px; border-radius: 999px; background: var(--good-bg); color: var(--good); font-size: 0.76rem; font-weight: 700; justify-self: start; align-self: flex-start; }
.summary-main .self-badge { margin: 0 0 0 4px; }
.list-head { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }

/* ---------- checkout ---------- */
.checkout-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .checkout-grid { grid-template-columns: 1fr; } }
.checkout-main { display: grid; gap: 22px; min-width: 0; }
.co-step { display: grid; gap: 10px; }
.uploads.bare { border-top: 0; padding-top: 0; margin: 0; }
.option-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.option-card { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 12px 14px; cursor: pointer; }
.option-card small { display: block; color: var(--muted); font-size: 0.8rem; }
.option-card.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.radio-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); flex: none; margin-top: 3px; transition: border 0.2s; }
.option-card.on .radio-dot { border: 5px solid var(--accent); }
.qr-box { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); }
.fake-qr { border-radius: 6px; max-width: 100%; }
.qr-amount { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; }
.card-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .card-grid { grid-template-columns: 1fr 1fr; } .card-grid > :first-child { grid-column: span 2; } }
.order-summary { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; background: var(--surface-2); display: grid; gap: 8px; }
.os-car { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; }
.os-sub { font-size: 0.82rem; margin-top: -6px; }
.order-summary dl { margin: 4px 0; display: grid; gap: 6px; }
.order-summary dl div { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.order-summary dd { margin: 0; font-weight: 600; }
.os-total { border-top: 1px solid var(--line); padding-top: 8px; }
.os-total dd { font-family: var(--f-display); font-size: 1.4rem; color: var(--accent); }
.pay-btn { padding: 12px; font-size: 1rem; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; display: inline-block; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.self-done .done-mark.pop-in { animation: popin 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
@keyframes popin { from { transform: scale(0.3); opacity: 0; } to { transform: none; opacity: 1; } }
.policy-doc { width: 100%; max-width: 640px; margin: 8px auto 0; text-align: left; border: 1px solid var(--line); border-top: 6px solid var(--accent); border-radius: var(--r-sm); padding: 18px 20px; background: var(--surface); }
.pd-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; border-bottom: 1px dashed var(--line); padding-bottom: 10px; margin-bottom: 10px; }
.pd-head b { font-family: var(--f-display); }
.pd-no { font-family: var(--f-mono); font-weight: 600; color: var(--accent); }
.policy-doc dl { margin: 0; display: grid; gap: 0; font-size: 0.88rem; }
.policy-doc dl div { display: grid; grid-template-columns: 160px 1fr; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
@media (max-width: 480px) { .policy-doc dl div { grid-template-columns: 1fr; gap: 0; } }
.policy-doc dt { color: var(--muted); }
.policy-doc dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.pd-foot { margin-top: 10px; font-size: 0.75rem; letter-spacing: 0.04em; }
.src-self { color: var(--good); font-weight: 600; }

/* ---------- sum insured adjust ---------- */
.si-main { flex: 1 1 320px; min-width: 0; }
.si-diff { margin-left: 10px; font-size: 0.85rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; vertical-align: middle; font-family: var(--f-body); }
.si-diff.up { background: var(--info-bg); color: var(--info); }
.si-diff.down { background: var(--warn-bg); color: var(--warn); }
.si-adjust { margin-top: 12px; max-width: 460px; display: grid; gap: 6px; }
.si-adjust-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 0.86rem; font-weight: 600; color: var(--ink-2); }
.si-adjust-row { display: flex; align-items: center; gap: 10px; }
.si-adjust-row input[type='range'] { flex: 1; padding: 0; border: 0; background: transparent; accent-color: var(--accent); min-width: 0; }
.step-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 1.1rem; font-weight: 700; cursor: pointer; display: grid; place-items: center; flex: none; color: var(--ink); }
.step-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.step-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.si-scale { display: flex; justify-content: space-between; font-size: 0.76rem; color: var(--muted); padding: 0 42px; }
.si-scale span { white-space: nowrap; }
@media (max-width: 560px) { .si-scale { padding: 0; font-size: 0.72rem; gap: 8px; } }
