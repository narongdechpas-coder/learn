.agent-table tr.inactive, .agent-manage tr.inactive { opacity: 0.55; }
.ag-target-col { min-width: 150px; }
.mini-meter { height: 6px; border-radius: 3px; background: var(--line); margin-bottom: 4px; }
.mini-meter span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.mini-meter span.good { background: var(--good); }
.target-input { width: 120px; }
.agent-manage td .btn { margin-right: 8px; }

/* Customer-facing quotation */
.offer-wrap { display: grid; gap: 12px; max-width: 860px; margin: 0 auto; }
.offer-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.offer { display: grid; gap: 18px; margin: 0; }
.offer-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 2px solid var(--accent); }
.offer-brand { display: flex; gap: 10px; align-items: center; }
.offer-brand b { font: 600 1.15rem var(--f-display); }
.offer-ref { text-align: right; }
.offer-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.offer-parties > div { padding: 14px; border-radius: var(--r-sm); background: var(--surface-2); display: grid; gap: 4px; align-content: start; }
.offer-contact { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.offer-h { margin: 0; }
.offer-options { display: grid; gap: 10px; }
.offer-opt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: var(--r); cursor: pointer; background: var(--surface); }
.offer-opt.on { border-color: var(--accent); background: var(--accent-soft); }
.offer-opt.dim { opacity: 0.5; }
.offer-opt-main { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; min-width: 0; }
.offer-opt-price { display: grid; justify-items: end; gap: 2px; text-align: right; }
.offer-opt-price b { font: 600 1.3rem var(--f-display); color: var(--accent); }
.offer-opt .radio-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }
.offer-opt.on .radio-dot { border: 5px solid var(--accent); }
.offer-accept, .offer-after { display: grid; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.offer-cta { display: flex; gap: 10px; flex-wrap: wrap; }
.otp-box { display: grid; gap: 10px; max-width: 420px; }
.otp-box p { margin: 0; }
.otp-row { display: flex; gap: 10px; align-items: center; }
.otp-row input { width: 140px; font: 600 1.2rem var(--f-mono); letter-spacing: 0.3em; }
.pay-box { display: grid; gap: 10px; padding: 14px; border-radius: var(--r); background: var(--surface-2); justify-items: start; }
.pay-box h4 { margin: 0; }
.print-only { display: none; }

@media (max-width: 1000px) {
  .ag-car-grid { grid-template-columns: 1fr 1fr; }
  .ag-car-grid .ag-si { grid-column: 1 / -1; }
  .ag-sum-grid, .ag-cases { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .ag-car-grid, .ag-cust, .offer-parties { grid-template-columns: 1fr; }
  .offer-opt { grid-template-columns: auto 1fr; }
  .offer-opt-price { grid-column: 2; justify-items: start; text-align: left; }
  .offer-ref { text-align: left; }
  .ag-renew li { grid-template-columns: 1fr auto; }
  .ag-renew li > :last-child { grid-column: 1 / -1; justify-self: start; }
}
@media print {
  .topbar, .foot, .toasts, .no-print, .chat-btn, .chat { display: none !important; }
  body { background: #fff; }
  .main { padding: 0 !important; }
  .offer { box-shadow: none; border: 0; }
  .print-only { display: block; }
}
.ag-perf { display: grid; gap: 16px; }
.ag-perf > * { margin: 0; min-width: 0; }
.ag-kv { display: grid; gap: 0; margin: 14px 0; }
.ag-kv > div { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ag-kv dt { color: var(--muted); font-size: 0.88rem; }
.ag-kv dd { margin: 0; }
.src.src-agent { background: var(--warm-soft); color: var(--warm-ink); }
.agent-box { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px 20px; align-items: start; padding: 14px 16px; margin: 12px 0; border-radius: var(--r-sm); background: var(--warm-soft); }
.agent-box > div { display: grid; gap: 2px; }
.agent-box-kv { margin: 0; display: grid; gap: 4px; }
.agent-box-kv > div { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px; font-size: 0.9rem; }
.agent-box-kv dt { color: var(--warm-ink); opacity: 0.8; }
.agent-box-kv dd { margin: 0; }
.agent-box .btn { grid-column: 1 / -1; justify-self: start; }
@media (max-width: 640px) { .agent-box { grid-template-columns: 1fr; } }
.kind-split { display: flex; gap: 8px; flex-wrap: wrap; }
.pay-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.pay-tile { padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface-2); border-left: 4px solid var(--line); display: grid; gap: 2px; min-width: 0; }
.pay-tile.tone-good { border-color: var(--good); }
.pay-tile.tone-wait { border-color: var(--warn); }
.pay-tile.tone-bad { border-color: var(--bad); }
.pay-big { font: 600 1.5rem var(--f-display); }
.pay-big .muted { font-size: 0.9rem; }
.ren-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.82rem; color: var(--ink-2); }
.ren-legend span { display: inline-flex; align-items: center; gap: 5px; }
.ren-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.ren-bar-col { min-width: 160px; width: 28%; }
.ren-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--line); }
.ren-bar span { display: block; height: 100%; }
.ren-renewed { background: var(--good); }
.ren-quoted { background: var(--series); }
.ren-open { background: var(--warn); opacity: 0.55; }
.ren-lost { background: var(--bad); opacity: 0.75; }
@media (max-width: 640px) { .pay-tiles { grid-template-columns: 1fr; } }
.aud-agent { background: var(--warm-soft); color: var(--warm-ink); }
.remit .list-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; } .remit .list-head select { width: auto; flex: none; }
.ag-sell > *, .ag-sum-grid > * { min-width: 0; }
.agent-app .subtabs, .mkt-app .subtabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.agent-app .subtabs button, .mkt-app .subtabs button { white-space: nowrap; flex: none; }
@media (max-width: 640px) {
  .ag-tools { width: 100%; }
  .ag-tools .inline-field { flex: 1; min-width: 0; }
  .ag-tools select { max-width: none; width: 100%; }
  .ag-pkg-table td:nth-child(3), .ag-pkg-table th:nth-child(3) { display: none; }
}

/* Agent renewal report */
.rr { display: grid; gap: 16px; }
.rr > * { margin: 0; min-width: 0; }
.rr-summary { display: grid; grid-template-columns: 1.25fr repeat(3, minmax(0, 1fr)); gap: 12px; }
.rr-tile { text-align: left; display: grid; gap: 6px; align-content: start; padding: 16px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; min-width: 0; transition: border-color 0.15s, box-shadow 0.15s; }
.rr-tile:hover { border-color: var(--accent); }
.rr-tile.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.rr-all { background: var(--accent-soft); }
.rr-big { font: 600 1.7rem var(--f-display); line-height: 1.1; }
.rr-big .muted { font: 400 0.9rem var(--f-body); }
.rr-split { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.86rem; }
.rr-done { color: var(--good); font-weight: 600; }
.rr-todo { color: var(--warn); font-weight: 600; }
.rr-meter { height: 8px; border-radius: 4px; background: var(--warn-bg); overflow: hidden; }
.rr-meter span { display: block; height: 100%; background: var(--good); border-radius: 4px; }
.rr-money { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.rr-money-tile { padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); display: grid; gap: 2px; min-width: 0; }
.rr-money-tile.tone-good { border-left-color: var(--good); }
.rr-money-tile.tone-wait { border-left-color: var(--warn); }
.rr-money-v { font: 600 1.45rem var(--f-display); }
.rr-table td { vertical-align: top; }
.rr-table tr.rr-late td { background: var(--bad-bg); }
.rr-rank { display: inline-grid; place-items: center; min-width: 28px; height: 28px; border-radius: 8px; font: 600 0.9rem var(--f-display); background: var(--surface-2); }
.rr-rank.tone-bad { background: var(--bad-bg); color: var(--bad); }
.rr-rank.tone-warn { background: var(--warn-bg); color: var(--warn); }
.rr-pol { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
@media (max-width: 1000px) { .rr-summary { grid-template-columns: 1fr 1fr; } }
@media (max-width: 640px) { .rr-money { grid-template-columns: 1fr; } }
/* Phone: each renewal row becomes a small card so expiry, premium and the action stay on screen. */
@media (max-width: 640px) {
  .rr-table thead { display: none; }
  .rr-table, .rr-table tbody { display: block; }
  .rr-table tr { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .rr-table td { display: block; padding: 0 !important; border: 0 !important; }
  .rr-table td:first-child { grid-row: span 2; }
  .rr-table td:nth-child(3), .rr-table td:nth-child(4) { grid-column: 2 / -1; }
  .rr-table td:nth-child(5) { display: none; }
  .rr-table td:nth-child(6) { grid-column: 2; text-align: left; }
  .rr-table td:nth-child(7) { grid-column: 3; grid-row: 1; }
  .rr-table td:nth-child(8) { grid-column: 2 / -1; text-align: left; }
  .rr-table tr.rr-late td { background: none; }
  .rr-table tr.rr-late { background: var(--bad-bg); border-radius: var(--r-sm); padding: 12px 8px; }
}
</style>
