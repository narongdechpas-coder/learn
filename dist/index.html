.agent-table tr.inactive, .agent-manage tr.inactive { opacity: 0.55; }
.ag-target-col { min-width: 150px; }
.mini-meter { height: 6px; border-radius: 3px; background: var(--line); margin-bottom: 4px; }
.mini-meter span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.mini-meter span.good { background: var(--good); }
.target-input { width: 120px; }
.agent-manage td .btn { margin-right: 8px; }

/* Customer-facing quotation */
.offer-wrap { display: grid; gap: 12px; max-width: 860px; margin: 0 auto; }
.offer-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.offer { display: grid; gap: 18px; margin: 0; }
.offer-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 2px solid var(--accent); }
.offer-brand { display: flex; gap: 10px; align-items: center; }
.offer-brand b { font: 600 1.15rem var(--f-display); }
.offer-ref { text-align: right; }
.offer-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.offer-parties > div { padding: 14px; border-radius: var(--r-sm); background: var(--surface-2); display: grid; gap: 4px; align-content: start; }
.offer-contact { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.offer-h { margin: 0; }
.offer-options { display: grid; gap: 10px; }
.offer-opt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: var(--r); cursor: pointer; background: var(--surface); }
.offer-opt.on { border-color: var(--accent); background: var(--accent-soft); }
.offer-opt.dim { opacity: 0.5; }
.offer-opt-main { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; min-width: 0; }
.offer-opt-price { display: grid; justify-items: end; gap: 2px; text-align: right; }
.offer-opt-price b { font: 600 1.3rem var(--f-display); color: var(--accent); }
.offer-opt .radio-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }
.offer-opt.on .radio-dot { border: 5px solid var(--accent); }
.offer-accept, .offer-after { display: grid; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.offer-cta { display: flex; gap: 10px; flex-wrap: wrap; }
.otp-box { display: grid; gap: 10px; max-width: 420px; }
.otp-box p { margin: 0; }
.otp-row { display: flex; gap: 10px; align-items: center; }
.otp-row input { width: 140px; font: 600 1.2rem var(--f-mono); letter-spacing: 0.3em; }
.pay-box { display: grid; gap: 10px; padding: 14px; border-radius: var(--r); background: var(--surface-2); justify-items: start; }
.pay-box h4 { margin: 0; }
.print-only { display: none; }

@media (max-width: 1000px) {
  .ag-car-grid { grid-template-columns: 1fr 1fr; }
  .ag-car-grid .ag-si { grid-column: 1 / -1; }
  .ag-sum-grid, .ag-cases { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .ag-car-grid, .ag-cust, .offer-parties { grid-template-columns: 1fr; }
  .offer-opt { grid-template-columns: auto 1fr; }
  .offer-opt-price { grid-column: 2; justify-items: start; text-align: left; }
  .offer-ref { text-align: left; }
  .ag-renew li { grid-template-columns: 1fr auto; }
  .ag-renew li > :last-child { grid-column: 1 / -1; justify-self: start; }
}
@media print {
  .topbar, .foot, .toasts, .no-print, .chat-btn, .chat { display: none !important; }
  body { background: #fff; }
  .main { padding: 0 !important; }
  .offer { box-shadow: none; border: 0; }
  .print-only { display: block; }
}
.ag-perf { display: grid; gap: 16px; }
.ag-perf > * { margin: 0; min-width: 0; }
.ag-kv { display: grid; gap: 0; margin: 14px 0; }
.ag-kv > div { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ag-kv dt { color: var(--muted); font-size: 0.88rem; }
.ag-kv dd { margin: 0; }
.src.src-agent { background: var(--warm-soft); color: var(--warm-ink); }
.agent-box { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px 20px; align-items: start; padding: 14px 16px; margin: 12px 0; border-radius: var(--r-sm); background: var(--warm-soft); }
.agent-box > div { display: grid; gap: 2px; }
.agent-box-kv { margin: 0; display: grid; gap: 4px; }
.agent-box-kv > div { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px; font-size: 0.9rem; }
.agent-box-kv dt { color: var(--warm-ink); opacity: 0.8; }
.agent-box-kv dd { margin: 0; }
.agent-box .btn { grid-column: 1 / -1; justify-self: start; }
@media (max-width: 640px) { .agent-box { grid-template-columns: 1fr; } }
.kind-split { display: flex; gap: 8px; flex-wrap: wrap; }
.pay-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.pay-tile { padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface-2); border-left: 4px solid var(--line); display: grid; gap: 2px; min-width: 0; }
.pay-tile.tone-good { border-color: var(--good); }
.pay-tile.tone-wait { border-color: var(--warn); }
.pay-tile.tone-bad { border-color: var(--bad); }
.pay-big { font: 600 1.5rem var(--f-display); }
.pay-big .muted { font-size: 0.9rem; }
.ren-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.82rem; color: var(--ink-2); }
.ren-legend span { display: inline-flex; align-items: center; gap: 5px; }
.ren-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.ren-bar-col { min-width: 160px; width: 28%; }
.ren-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--line); }
.ren-bar span { display: block; height: 100%; }
.ren-renewed { background: var(--good); }
.ren-quoted { background: var(--series); }
.ren-open { background: var(--warn); opacity: 0.55; }
.ren-lost { background: var(--bad); opacity: 0.75; }
@media (max-width: 640px) { .pay-tiles { grid-template-columns: 1fr; } }
.aud-agent { background: var(--warm-soft); color: var(--warm-ink); }
.remit .list-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; } .remit .list-head select { width: auto; flex: none; }
.ag-sell > *, .ag-sum-grid > * { min-width: 0; }
.agent-app .subtabs, .mkt-app .subtabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.agent-app .subtabs button, .mkt-app .subtabs button { white-space: nowrap; flex: none; }
@media (max-width: 640px) {
  .ag-tools { width: 100%; }
  .ag-tools .inline-field { flex: 1; min-width: 0; }
  .ag-tools select { max-width: none; width: 100%; }
  .ag-pkg-table td:nth-child(3), .ag-pkg-table th:nth-child(3) { display: none; }
}

/* Agent renewal report */
.rr { display: grid; gap: 16px; }
.rr > * { margin: 0; min-width: 0; }
.rr-summary { display: grid; grid-template-columns: 1.25fr repeat(3, minmax(0, 1fr)); gap: 12px; }
.rr-tile { text-align: left; display: grid; gap: 6px; align-content: start; padding: 16px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; min-width: 0; transition: border-color 0.15s, box-shadow 0.15s; }
.rr-tile:hover { border-color: var(--accent); }
.rr-tile.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.rr-all { background: var(--accent-soft); }
.rr-big { font: 600 1.7rem var(--f-display); line-height: 1.1; }
.rr-big .muted { font: 400 0.9rem var(--f-body); }
.rr-split { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.86rem; }
.rr-done { color: var(--good); font-weight: 600; }
.rr-todo { color: var(--warn); font-weight: 600; }
.rr-meter { height: 8px; border-radius: 4px; background: var(--warn-bg); overflow: hidden; }
.rr-meter span { display: block; height: 100%; background: var(--good); border-radius: 4px; }
.rr-money { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.rr-money-tile { padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); display: grid; gap: 2px; min-width: 0; }
.rr-money-tile.tone-good { border-left-color: var(--good); }
.rr-money-tile.tone-wait { border-left-color: var(--warn); }
.rr-money-v { font: 600 1.45rem var(--f-display); }
.rr-table td { vertical-align: top; }
.rr-table tr.rr-late td { background: var(--bad-bg); }
.rr-rank { display: inline-grid; place-items: center; min-width: 28px; height: 28px; border-radius: 8px; font: 600 0.9rem var(--f-display); background: var(--surface-2); }
.rr-rank.tone-bad { background: var(--bad-bg); color: var(--bad); }
.rr-rank.tone-warn { background: var(--warn-bg); color: var(--warn); }
.rr-pol { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
@media (max-width: 1000px) { .rr-summary { grid-template-columns: 1fr 1fr; } }
@media (max-width: 640px) { .rr-money { grid-template-columns: 1fr; } }
/* Phone: each renewal row becomes a small card so expiry, premium and the action stay on screen. */
@media (max-width: 640px) {
  .rr-table thead { display: none; }
  .rr-table, .rr-table tbody { display: block; }
  .rr-table tr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .rr-table td { display: block; padding: 0 !important; border: 0 !important; grid-column: 2 / -1; text-align: left !important; white-space: normal; }
  .rr-table td.rr-c-rank { grid-column: 1; grid-row: 1 / span 3; }
  .rr-table td.rr-c-cust { grid-column: 2; }
  .rr-table td.rr-c-st { grid-column: 3; grid-row: 1; }
  .rr-table td.rr-c-old { display: none; }
  .rr-table tr.rr-late td { background: none; }
  .rr-table tr.rr-late { background: var(--bad-bg); border-radius: var(--r-sm); padding: 12px 8px; }
}
.rr-rate-col { min-width: 130px; }
.rr-rate-col .rr-meter { margin-bottom: 4px; }
.rr-agents tr.inactive { opacity: 0.55; }
.cust-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.cust-top .subtabs { margin-bottom: 0; }
.partner-btn { gap: 6px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); }
.pl-modal { width: min(440px, 100%); display: grid; gap: 14px; }
.pl-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pl-steps li { padding: 6px 10px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: 0.85rem; font-weight: 600; text-align: center; }
.pl-steps li.on { background: var(--accent-soft); color: var(--accent); }
.pl-steps li.done { color: var(--good); }
.pl-form { display: grid; gap: 8px; }
.pl-form p { margin: 0; }
.pl-form label { font-weight: 600; font-size: 0.9rem; }
#pl-code { font: 600 1.15rem var(--f-mono); letter-spacing: 0.06em; }
.pl-samples { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pl-samples .chip { cursor: pointer; font-family: var(--f-mono); }
.pl-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.link:disabled { color: var(--muted); cursor: default; text-decoration: none; }
.rr-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.rr-bar select { min-width: 140px; }
.rr-money { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.rr-money-tile.rr-count { border-left-color: var(--accent); background: var(--accent-soft); gap: 6px; }
.rr-money-v .muted { font: 400 0.9rem var(--f-body); }
@media (max-width: 1000px) { .rr-money { grid-template-columns: 1fr 1fr; } }
@media (max-width: 640px) { .rr-money { grid-template-columns: 1fr; } }
.pl-demo { display: grid; gap: 6px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--warn-bg); color: var(--warn); font-size: 0.86rem; }
.pl-demo b { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
.pl-demo .chip { background: var(--surface); }

/* VP view. Marketing colours: validated categorical slots 1-3, stepped for each theme. */
:root { --mk-1: #2a78d6; --mk-2: #eb6834; --mk-3: #1baf7a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --mk-1: #3987e5; --mk-2: #d95926; --mk-3: #199e70; } }
:root[data-theme='dark'] { --mk-1: #3987e5; --mk-2: #d95926; --mk-3: #199e70; }
.vp-app .dash-head { align-items: flex-end; }
.vp-meter { color: var(--accent); margin: 4px 0; }
.vp-org { display: grid; gap: 0; }
.vp-org-top { display: flex; justify-content: center; padding-bottom: 18px; position: relative; }
.vp-org-top::after { content: ''; position: absolute; bottom: 0; left: 50%; width: 2px; height: 18px; background: var(--line); }
.vp-node { padding: 10px 22px; border-radius: var(--r-sm); background: var(--ink); color: var(--bg); font: 600 1rem var(--f-display); }
.vp-org-mkts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding-top: 18px; border-top: 2px solid var(--line); }
.vp-mkt { border: 1px solid var(--line); border-top: 5px solid var(--mk); border-radius: var(--r-sm); padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0; background: var(--surface); }
.vp-mkt .vp-meter { color: var(--mk); }
.vp-mkt-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.vp-rank { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--mk); color: #fff; font: 600 0.95rem var(--f-display); }
.vp-mkt-pct { font: 600 1.5rem var(--f-display); }
.vp-mkt-agents { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px; border-top: 1px dashed var(--line); padding-top: 8px; }
.vp-mkt-agents li { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; padding-left: 12px; border-left: 2px solid var(--mk); }
.vp-agent-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.86rem; color: var(--ink-2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.tooltip .tt-row { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; font-size: 0.85rem; }
.tooltip .tt-row i { width: 10px; height: 10px; border-radius: 3px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: middle; }
.vp-ach-col { min-width: 130px; }
.vp-ach { display: grid; gap: 3px; }
.vp-table tr.inactive { opacity: 0.55; }
@media (max-width: 900px) { .vp-org-mkts { grid-template-columns: 1fr; } }
select.auto-w { width: auto; flex: none; }
.vp-org-mkts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.vp-agent-name { flex: 1; }
@media (max-width: 900px) { .vp-org-mkts { grid-template-columns: minmax(0, 1fr); } }
.vp-org, .vp-mkt, .vp-mkt-agents { grid-template-columns: minmax(0, 1fr); }
.vp-mkt-agents li > .num { flex: none; }
/* Compare: everything fits in one view — compact rows, price and the choose button in the header. */
.compare-modal { width: min(880px, 100%); max-height: calc(100dvh - 32px); padding: 16px 20px 18px; }
.compare-modal .modal-head { margin-bottom: 8px; }
.compare-modal .modal-head h3 { margin: 0; }
.compare-modal .table-wrap { overflow: visible; }
.compare-table { font-size: 0.86rem; table-layout: fixed; }
.compare-table th, .compare-table td { padding: 6px 8px; line-height: 1.3; }
.compare-table tbody th { min-width: 0; width: 30%; }
.compare-table thead th { padding: 10px 8px; vertical-align: top; }
.compare-table thead th:first-child { background: transparent; }
.cmp-head { display: grid; gap: 4px; justify-items: center; }
.cmp-tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
.cmp-tags .mini-badge { margin: 0; }
.cmp-price { font: 600 1.15rem var(--f-display); color: var(--accent); }
.cmp-price small { font: 400 0.75rem var(--f-body); color: var(--muted); margin-left: 2px; }
.cmp-inst { font-size: 0.74rem; font-weight: 400; color: var(--ink-2); }
.cmp-head .btn { margin-top: 2px; }
@media (max-width: 640px) {
  .compare-table { font-size: 0.78rem; }
  .compare-table tbody th { width: 34%; }
  .cmp-inst { display: none; }
}
.cmp-short { display: none; }
@media (max-width: 640px) {
  .compare-modal { padding: 14px 12px 14px; }
  .compare-table thead th { padding: 8px 3px; }
  .cmp-price { font-size: 0.95rem; }
  .cmp-price small { display: none; }
  .cmp-long { display: none; }
  .cmp-short { display: inline; }
  .cmp-head .btn { padding: 6px 12px; white-space: nowrap; }
  .compare-table th, .compare-table td { padding: 5px 4px; }
}
.cluster-chart g.dim path { opacity: 0.35; }
.cluster-chart .ref-line line { stroke: var(--ink-2); stroke-dasharray: 5 4; }
.cluster-legend i { width: 14px; height: 10px; border-radius: 3px; }
.cluster-legend i.hatched { background: repeating-linear-gradient(45deg, currentColor 0 2px, transparent 2px 4px); box-shadow: inset 0 0 0 1px currentColor; }
.cluster-chart .ref-line text { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.mkt-ach-col { min-width: 150px; }
.ach-pace { position: relative; overflow: visible; }
.ach-pace i { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--ink-2); }
.vp-assign { display: flex; align-items: center; gap: 4px; }
.vp-assign select { width: auto; min-width: 140px; padding-top: 6px; padding-bottom: 6px; }
/* Radios get the same treatment as checkboxes (the generic input rule made them full width). */
input[type='radio']:not(.sr-only) { width: auto; padding: 0; accent-color: var(--accent); flex: none; margin: 0; }
.ag-collect { gap: 8px; }
.ag-collect .check { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); text-align: left; }
.ag-collect .check:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.ag-collect .check input { width: 18px; height: 18px; }
