.ag-renew li > div { min-width: 0; }

.agent-table td, .agent-manage td { vertical-align: middle; }
.agent-table tr.inactive, .agent-manage tr.inactive { opacity: 0.55; }
.ag-target-col { min-width: 150px; }
.mini-meter { height: 6px; border-radius: 3px; background: var(--line); margin-bottom: 4px; }
.mini-meter span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.mini-meter span.good { background: var(--good); }
.target-input { width: 120px; }
.agent-manage td .btn { margin-right: 8px; }

/* Customer-facing quotation */
.offer-wrap { display: grid; gap: 12px; max-width: 860px; margin: 0 auto; }
.offer-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.offer { display: grid; gap: 18px; margin: 0; }
.offer-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 2px solid var(--accent); }
.offer-brand { display: flex; gap: 10px; align-items: center; }
.offer-brand b { font: 600 1.15rem var(--f-display); }
.offer-ref { text-align: right; }
.offer-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.offer-parties > div { padding: 14px; border-radius: var(--r-sm); background: var(--surface-2); display: grid; gap: 4px; align-content: start; }
.offer-contact { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.offer-h { margin: 0; }
.offer-options { display: grid; gap: 10px; }
.offer-opt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: var(--r); cursor: pointer; background: var(--surface); }
.offer-opt.on { border-color: var(--accent); background: var(--accent-soft); }
.offer-opt.dim { opacity: 0.5; }
.offer-opt-main { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; min-width: 0; }
.offer-opt-price { display: grid; justify-items: end; gap: 2px; text-align: right; }
.offer-opt-price b { font: 600 1.3rem var(--f-display); color: var(--accent); }
.offer-opt .radio-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }
.offer-opt.on .radio-dot { border: 5px solid var(--accent); }
.offer-accept, .offer-after { display: grid; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.offer-cta { display: flex; gap: 10px; flex-wrap: wrap; }
.otp-box { display: grid; gap: 10px; max-width: 420px; }
.otp-box p { margin: 0; }
.otp-row { display: flex; gap: 10px; align-items: center; }
.otp-row input { width: 140px; font: 600 1.2rem var(--f-mono); letter-spacing: 0.3em; }
.pay-box { display: grid; gap: 10px; padding: 14px; border-radius: var(--r); background: var(--surface-2); justify-items: start; }
.pay-box h4 { margin: 0; }
.print-only { display: none; }

@media (max-width: 1000px) {
  .ag-car-grid { grid-template-columns: 1fr 1fr; }
  .ag-car-grid .ag-si { grid-column: 1 / -1; }
  .ag-sum-grid, .ag-cases { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .ag-car-grid, .ag-cust, .offer-parties { grid-template-columns: 1fr; }
  .offer-opt { grid-template-columns: auto 1fr; }
  .offer-opt-price { grid-column: 2; justify-items: start; text-align: left; }
  .offer-ref { text-align: left; }
  .ag-renew li { grid-template-columns: 1fr auto; }
  .ag-renew li > :last-child { grid-column: 1 / -1; justify-self: start; }
}
@media print {
  .topbar, .foot, .toasts, .no-print, .chat-btn, .chat { display: none !important; }
  body { background: #fff; }
  .main { padding: 0 !important; }
  .offer { box-shadow: none; border: 0; }
  .print-only { display: block; }
}
.ag-perf { display: grid; gap: 16px; }
.ag-perf > * { margin: 0; min-width: 0; }
.ag-kv { display: grid; gap: 0; margin: 14px 0; }
.ag-kv > div { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ag-kv dt { color: var(--muted); font-size: 0.88rem; }
.ag-kv dd { margin: 0; }
.src.src-agent { background: var(--warm-soft); color: var(--warm-ink); }
.agent-box { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px 20px; align-items: start; padding: 14px 16px; margin: 12px 0; border-radius: var(--r-sm); background: var(--warm-soft); }
.agent-box > div { display: grid; gap: 2px; }

@media (max-width: 1000px) { .catalog-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .catalog-grid { grid-template-columns: 1fr; } }
.ct-card { border: 1px solid var(--line); border-radius: var(--r); padding: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ct-card header { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ct-card header .mini-badge { margin: 0; }
.ct-card h3 { margin: 0; font-size: 1.1rem; }
.ct-tag { margin: 0; color: var(--ink-2); font-size: 0.9rem; }
.ct-hl { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 0.86rem; }
.ct-hl li::before { content: '✓'; color: var(--good); font-weight: 700; margin-right: 6px; }
.ct-extras, .pkg-extras { display: flex; gap: 4px; flex-wrap: wrap; }
.ct-foot { margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.ct-price b { font-size: 1.2rem; }
.ct-price small { color: var(--muted); }
.ct-actions { display: flex; gap: 6px; }
.ct-com { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; margin-left: auto; }
.ct-modal { width: min(860px, 100%); max-height: 90vh; overflow: auto; display: grid; gap: 10px; }
.ct-modal h3 { display: flex; gap: 8px; align-items: center; margin: 0; }
.ct-modal p.chip { margin: 0; justify-self: start; }
.ct-modal h4 { margin: 10px 0 6px; }
.ct-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 680px) { .ct-detail-grid { grid-template-columns: 1fr; } }
.ct-plain { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 0.86rem; }
.ct-excl { color: var(--ink-2); }
.ct-modal-foot { display: flex; justify-content: flex-end; }
.pkg-name { margin: 2px 0 0; font-size: 1rem; }
.cmp-name { font-weight: 600; font-size: 0.8rem; }
.dash-products .dp-grid { margin-top: 12px; align-items: start; }

/* ---------- navigation: customer site / ABC system / demo tools ---------- */
.tools-wrap { position: relative; }
.nav-tools.on { background: var(--accent-soft); color: var(--accent); }
.tools-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 200px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14); padding: 6px; display: grid; gap: 2px; }
.tools-menu button { text-align: left; border: 0; background: none; padding: 9px 12px; border-radius: 8px; cursor: pointer; font: inherit; color: var(--ink); white-space: nowrap; }
.tools-menu button:hover { background: var(--surface-2); }
.abc-shell { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 24px; align-items: start; }
.abc-side { position: sticky; top: 84px; display: grid; gap: 14px; }
.abc-group { display: grid; gap: 2px; }
.abc-group-label { font-size: inherit; font-weight: 700; color: var(--ink); padding: 4px 12px; }
.abc-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 0; background: none; padding: 7px 12px 7px 26px; border-radius: 10px; cursor: pointer; font: inherit; font-weight: 500; color: var(--ink-2); text-align: left; }
.abc-item:hover { background: var(--surface-2); color: var(--ink); }
.abc-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.abc-main { min-width: 0; }
@media (max-width: 900px) {
  .abc-shell { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .abc-side { position: static; display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .abc-group { display: flex; gap: 2px; align-items: center; }
  .abc-group + .abc-group { border-left: 1px solid var(--line); padding-left: 4px; }
  .abc-group-label { display: none; }
  .abc-item { white-space: nowrap; padding-left: 12px; }
}
@media (max-width: 520px) { .tools-label { display: none; } }
.abc-shell.side-hidden { grid-template-columns: minmax(0, 1fr); }
.abc-side[hidden] { display: none; }
.side-toggle { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 0.82rem; cursor: pointer; justify-self: start; display: inline-flex; gap: 6px; align-items: center; }
.side-toggle:hover { color: var(--ink); background: var(--surface-2); }
.side-hide { margin-left: 12px; }
.side-show { margin-bottom: -8px; }
@media (max-width: 900px) {
  .side-toggle { display: none; }
  .abc-side[hidden] { display: flex; }
  .abc-shell.side-hidden { gap: 12px; }
}
/* Side panel in navy (#305073). Contrast on it: titles #fff 8.3:1, items #e6edf5 7.1:1,
   hover #fff on #415e7e 6.7:1, current item #fff on #516c89 5.5:1 (all WCAG AA). */
.abc-side { --side-bg: #305073; --side-ink: #e6edf5; --side-hover: #415e7e; --side-on: #516c89; background: var(--side-bg); border-radius: var(--r); padding: 14px 10px; box-shadow: 0 6px 18px rgba(20, 35, 55, 0.18); }
.abc-side .abc-group-label { color: #fff; }
.abc-side .abc-item { color: var(--side-ink); }
.abc-side .abc-item:hover { background: var(--side-hover); color: #fff; }
.abc-side .abc-item.on { background: var(--side-on); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 #fff; }
.abc-side .side-hide { background: transparent; color: var(--side-ink); border-color: rgba(255, 255, 255, 0.35); }
.abc-side .side-hide:hover { background: var(--side-hover); color: #fff; }
.abc-side .abc-item:focus-visible, .abc-side .side-hide:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
.side-show { background: #305073; color: #fff; border-color: #305073; }
.side-show:hover { background: #415e7e; color: #fff; }
@media (max-width: 900px) {
  .abc-side { padding: 6px; }
  .abc-group + .abc-group { border-left-color: rgba(255, 255, 255, 0.25); }
}
