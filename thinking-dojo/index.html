let shownXP=S.xp;
function tweenXP(){const el=document.getElementById('xpv');if(!el)return;const target=S.xp,start=shownXP,t0=performance.now();
  if(start===target){el.textContent=target;return}
  const step=t=>{const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=Math.round(start+(target-start)*e);if(p<1)raf=requestAnimationFrame(step);else shownXP=target};raf=requestAnimationFrame(step)}

/* ===================== ANIMATIONS ===================== */
function heroCanvas(){const c=document.getElementById('hc');if(!c)return;const ctx=c.getContext('2d');let w,h,nodes=[];
  const resize=()=>{w=c.width=c.offsetWidth*devicePixelRatio;h=c.height=c.offsetHeight*devicePixelRatio};resize();
  const cols=MODES.map(m=>m.c);
  for(let i=0;i<22;i++)nodes.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.25*devicePixelRatio,vy:(Math.random()-.5)*.25*devicePixelRatio,r:(2+Math.random()*2.5)*devicePixelRatio,c:cols[i%cols.length]});
  const draw=()=>{ctx.clearRect(0,0,w,h);
    for(const n of nodes){n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>w)n.vx*=-1;if(n.y<0||n.y>h)n.vy*=-1}
    ctx.lineWidth=devicePixelRatio;
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y),lim=120*devicePixelRatio;if(d<lim){ctx.strokeStyle=`rgba(255,255,255,${(1-d/lim)*.25})`;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
    for(const n of nodes){ctx.fillStyle=n.c;ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fill();ctx.globalAlpha=1}
    raf=requestAnimationFrame(draw)};
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)draw();
}
function confetti(canvas,color){if(!canvas||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const ctx=canvas.getContext('2d');const w=canvas.width=canvas.offsetWidth,h=canvas.height=canvas.offsetHeight;
  const ps=[];const cols=[color,'#C9A227','#2E8B57','#2F6FB5','#E07A2F'];
  for(let i=0;i<90;i++)ps.push({x:w/2,y:h*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*10-3,g:.35,r:3+Math.random()*4,c:cols[i%cols.length],a:1,rot:Math.random()*6,vr:(Math.random()-.5)*.3});
  let t=0;const step=()=>{ctx.clearRect(0,0,w,h);t++;let alive=false;for(const p of ps){p.x+=p.vx;p.vy+=p.g;p.y+=p.vy;p.vx*=.98;p.rot+=p.vr;p.a-=.012;if(p.a>0)alive=true;ctx.save();ctx.globalAlpha=Math.max(0,p.a);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()}if(alive&&t<160)raf=requestAnimationFrame(step)};step()}

/* ===================== DRILL ENGINE ===================== */
let CUR={};
function drill(id,lv,isDaily){const m=M(id);if(!unlocked(id,lv)){toast('ยังไม่ปลดล็อก');return}const d=m.levels[lv];CUR={id,lv,isDaily,bonus:0};
  ({brainstorm:dBrain,quiz:dQuiz,sequence:dSeq,match:dMatch,chain:dChain,reflect:dChain})[d.type](m,d,lv);
}
function finish(m,stars,note){
  const lv=CUR.lv;const st=starsOf(m.id).slice();const prev=st[lv];let gain=Math.max(0,stars-prev)*40*(lv+1)+10+(CUR.bonus||0);
  st[lv]=Math.max(prev,stars);S.stars[m.id]=st;S.last[m.id]=Date.now();S.xp+=gain;
  let dailyMsg='';
  if(CUR.isDaily&&S.dailyDone!==today()){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=(S.lastDaily===y||S.lastDaily===today())?S.streak+1:1;S.lastDaily=today();S.dailyDone=today();S.xp+=50;gain+=50;dailyMsg=`<div class="pill">🔥 ภารกิจประจำวันสำเร็จ สตรีค ${S.streak} วัน</div>`}
  save();
  const nextUnlocked=lv<2&&stars>=2;
  render(`${topbar("lesson('"+m.id+"')")}<div class="card result" style="--c:${m.c}"><canvas id="cf"></canvas><h2>${m.en} — ระดับ${LV[lv]}</h2><div class="big">${starHTML(stars)}</div>${sensei(pickOne(SAY.res[stars]))}<p>${note}</p><p style="font-size:22px;font-weight:800;color:var(--ok);margin:4px 0">+<span id="gx">0</span> XP</p>${CUR.bonus?`<p class="muted" style="margin-top:0">รวมโบนัสคอมโบ/ความเร็ว +${CUR.bonus}</p>`:''}${dailyMsg}${nextUnlocked?`<div class="pill">ปลดล็อกระดับ${LV[lv+1]}แล้ว</div>`:''}
  <div class="row" style="justify-content:center"><button class="btn ghost" onclick="drill('${m.id}',${lv})">เล่นอีกรอบ (โจทย์อาจเปลี่ยน)</button>${nextUnlocked?`<button class="btn" onclick="drill('${m.id}',${lv+1})">ไปด่านต่อไป</button>`:`<button class="btn" onclick="home('dojo')">กลับ Dojo</button>`}</div></div>`);
  countUp('gx',gain);for(let k=0;k<stars;k++)setTimeout(()=>sfx('pop'),250+k*150);if(stars>=2){confetti(document.getElementById('cf'),m.c);setTimeout(()=>sfx('star'),700)}
  const sv=document.querySelector('.result .sensei');if(sv)sv.style.justifyContent='center';
}
function ring(sec,total,c){const r=46,C=2*Math.PI*r;return `<div class="ring" id="ring" style="--c:${c}"><svg viewBox="0 0 110 110"><circle class="bg" cx="55" cy="55" r="${r}"/><circle class="fg" id="rf" cx="55" cy="55" r="${r}" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="t" id="tm">${sec}</div></div>`}

const HUES=['#FFE3D3','#DCEBFF','#E8DDFB','#D6F3E6','#FFF0C2','#FBDDE6'];
function dBrain(m,d,lv){const prompt=sample(d.prompts,1)[0];let left=d.seconds,ideas=[],running=true;const C=2*Math.PI*46;
  render(`${topbar("lesson('"+m.id+"')")}${head(m,lv)}
  <div class="card"><h3>${prompt}</h3><p class="muted">พิมพ์ทีละไอเดียแล้วกด Enter ไม่ต้องคิดว่าดีหรือไม่ดี พิมพ์ไปเลย</p>${ring(left,d.seconds,m.c)}
  ${sensei(pickOne(SAY.start))}<input id="in" placeholder="พิมพ์ไอเดีย แล้วกด Enter" autocomplete="off">
  <p style="margin:10px 0 0">ได้แล้ว <span class="count" style="--c:${m.c}" id="cnt">0</span> ไอเดีย <span class="muted">(เป้า ${d.targets.join(' / ')} = ★ / ★★ / ★★★)</span></p><div class="goal" id="goal"><span>★</span><span>★</span><span>★</span></div>
  <ul class="ideas" id="list"></ul><div class="row"><button class="btn ghost" id="stop">หมดมุกแล้ว จบเลย</button></div></div>`);
  const inp=document.getElementById('in'),tm=document.getElementById('tm'),list=document.getElementById('list'),cnt=document.getElementById('cnt'),rf=document.getElementById('rf');
  inp.focus();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&running){const v=inp.value.trim();if(!v)return;if(ideas.includes(v)){toast('ซ้ำแล้ว');return}ideas.push(v);inp.value='';idle=0;const li=document.createElement('li');li.textContent=v;li.style.setProperty('--h',HUES[ideas.length%HUES.length]);list.appendChild(li);cnt.textContent=ideas.length;cnt.classList.remove('bump');void cnt.offsetWidth;cnt.classList.add('bump');
    const g=d.targets.indexOf(ideas.length);if(g>=0){document.querySelectorAll('#goal span')[g].classList.add('on');sfx('star');say(['ได้ดาวแรกแล้ว! ต่อเลย','สองดาว! อีกนิด','สามดาวเต็ม! ยังไปต่อได้นะ 🚀'][g])}else{sfx('pop');if(ideas.length%3===0)say(pickOne(SAY.ok))}}});
  let idle=0;const end=()=>{running=false;clearInterval(timerHandle);const n=ideas.length;S.ideasMax=Math.max(S.ideasMax,n);const st=n>=d.targets[2]?3:n>=d.targets[1]?2:n>=d.targets[0]?1:0;
    if(d.flip&&n>0)flip(m,ideas,st);else finish(m,st,n?`คุณคิดได้ ${n} ไอเดียใน ${d.seconds} วินาที ${st===3?'ไหลลื่นมาก':st>=1?'ครั้งหน้าอย่าหยุดคิดว่าดีไหม แค่พิมพ์':'ครั้งหน้าลองตั้งใจว่า "ไม่มีไอเดียไหนโง่"'}`:'ไม่มีไอเดียเลย ลองใหม่อีกรอบ')};
  document.getElementById('stop').onclick=end;
  timerHandle=setInterval(()=>{left--;idle++;tm.textContent=left;rf.style.strokeDashoffset=C*(1-left/d.seconds);if(left<=10)document.getElementById('ring').classList.add('low');if(left<=5&&left>0)sfx('tick');if(idle>=8&&idle%8===0)say(pickOne(SAY.idle));if(left===10)say('อีก 10 วิ! ระเบิดพลังออกมา 💥');if(left<=0)end()},1000);
}
function flip(m,ideas,st){
  render(`${topbar("lesson('"+m.id+"')")}${head(m,CUR.lv)}<div class="card in"><h3>ทีนี้พลิกกลับบ้าง</h3><p class="muted">แต่ละ "วิธีทำให้พัง" เขียนว่าจะกันไว้ยังไง</p>
  ${ideas.map((x,i)=>`<div class="flip"><div class="f">${esc(x)}</div><input id="f${i}" placeholder="กันไว้โดย..."></div>`).join('')}
  <div class="row"><button class="btn" onclick="flipDone('${m.id}',${ideas.length},${st})">เสร็จแล้ว</button></div></div>`);
}
function flipDone(id,n,st){const m=M(id);let f=0;for(let i=0;i<n;i++)if(document.getElementById('f'+i).value.trim())f++;
  const s=Math.max(st===0?0:1,Math.min(3,Math.round((f/n)*3)));
  finish(m,s,`เจอ ${n} วิธีที่ทำให้พัง แล้วพลิกเป็นวิธีกันไว้ได้ ${f} ข้อ ${f===n?'นี่แหละเช็คลิสต์ความเสี่ยงของคุณ':'ข้อที่พลิกไม่ได้ คือเรื่องที่ต้องจับตาดูที่สุด'}`);
}

function dQuiz(m,d,lv){const qs=d.pick?sample(d.qs,d.pick):d.qs;let i=0,score=0,combo=0,t0=0,line=pickOne(SAY.start);
  const table=d.table?`<table class="tb"><tr>${d.table.cols.map(c=>`<th>${c}</th>`).join('')}</tr>${d.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`:'';
  const show=()=>{const q=qs[i];
    render(`${topbar("lesson('"+m.id+"')")}${head(m,lv)}<div class="prog" style="--c:${m.c}">${qs.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>${sensei(line)}
    <div class="card in"><div style="display:flex;justify-content:space-between;align-items:center"><p class="muted" style="margin:0">${d.intro}</p><span class="combo" id="combo">${combo>=2?'🔥 x'+combo:''}</span></div>${table}<h3>${q.q}</h3>
    <div id="opts">${q.o.map((o,k)=>`<button class="opt" onclick="pick(${k})">${o}</button>`).join('')}</div><div id="why"></div><div class="row" id="nx"></div></div>`);
    t0=performance.now();
    window.pick=k=>{const btns=document.querySelectorAll('.opt');btns.forEach(b=>b.onclick=null);btns[q.a].classList.add('right');
      if(k!==q.a){btns[k].classList.add('wrong');combo=0;sfx('bad');buzz();line=pickOne(SAY.bad);say(line);document.getElementById('combo').textContent=''}
      else{score++;combo++;S.maxCombo=Math.max(S.maxCombo,combo);const fast=performance.now()-t0<12000;const b=5+(combo>=2?combo*3:0)+(fast?5:0);CUR.bonus+=b;sfx('ok');floatAt(btns[k],`+${b}${fast?' ⚡':''}`);
        line=combo>=3?pickOne(SAY.combo):pickOne(SAY.ok);say(line);const ce=document.getElementById('combo');if(combo>=2){ce.textContent='🔥 x'+combo;ce.classList.remove('hot');void ce.offsetWidth;ce.classList.add('hot')}}
      document.getElementById('why').innerHTML=`<div class="why ${k===q.a?'ok':'bad'}"><b>${k===q.a?'ถูกต้อง':'ยังไม่ใช่'}</b> — ${q.why}</div>`;
      document.getElementById('nx').innerHTML=`<button class="btn" onclick="nextQ()">${i<qs.length-1?'ข้อถัดไป':'ดูผล'}</button>`;};
    window.nextQ=()=>{i++;if(i<qs.length)show();else{const st=score===qs.length?3:score>=Math.ceil(qs.length/2)?2:score>0?1:0;finish(m,st,`ตอบถูก ${score} จาก ${qs.length} ข้อ`)}};
  };show();
}

function dSeq(m,d,lv){const ch=sample(d.chains,1)[0];const pool=shuffle(ch.items.map((t,i)=>({t,i})));let placed=[];
  const show=()=>{render(`${topbar("lesson('"+m.id+"')")}${head(m,lv)}<div class="card in"><p class="muted">${d.intro}</p><h3>${ch.t}</h3>
    <ol class="seq" style="--c:${m.c}">${ch.items.map((_,k)=>{const p=placed[k];return p!==undefined?`<li><span class="n">${k+1}</span><span>${pool.find(x=>x.i===p).t}</span></li>`:`<li class="empty"><span class="n" style="background:var(--line)">${k+1}</span><span>ว่าง</span></li>`}).join('')}</ol>
    <div class="chips">${pool.map(x=>`<button class="chip ${placed.includes(x.i)?'used':''}" onclick="put(${x.i})">${x.t}</button>`).join('')}</div>
    <div class="row"><button class="btn ghost" onclick="undo()">ย้อน</button><button class="btn" ${placed.length<ch.items.length?'disabled':''} onclick="checkSeq()">ตรวจ</button></div></div>`)};
  window.put=i=>{if(placed.length<ch.items.length&&!placed.includes(i)){placed.push(i);sfx('pop');show()}};
  window.undo=()=>{placed.pop();show()};
  window.checkSeq=()=>{let ok=0;placed.forEach((p,k)=>{if(p===k)ok++});sfx(ok===ch.items.length?'star':ok>=ch.items.length-2?'ok':'bad');
    document.querySelectorAll('.seq li').forEach((li,k)=>li.classList.add(placed[k]===k?'good':'badc'));
    document.querySelector('.row').innerHTML=`<button class="btn" onclick="seqDone(${ok})">ดูผล</button>`;
    document.querySelector('.chips').insertAdjacentHTML('beforebegin',`<div class="why ${ok===ch.items.length?'ok':'bad'}">ถูกตำแหน่ง ${ok}/${ch.items.length} ลำดับที่ถูกต้อง: ${ch.items.map((t,k)=>`${k+1}) ${t}`).join(' → ')}</div>`)};
  window.seqDone=ok=>{const n=ch.items.length;const st=ok===n?3:ok>=n-2?2:ok>=1?1:0;finish(m,st,`ถูกตำแหน่ง ${ok} จาก ${n}`)};
  show();
}

function dMatch(m,d,lv){const pairs=sample(d.pool,d.pick);const L=shuffle(pairs.map((p,i)=>({t:p[0],i}))),R=shuffle(pairs.map((p,i)=>({t:p[1],i})));let sel=null,got=[],wrong=0;
  const show=()=>{render(`${topbar("lesson('"+m.id+"')")}${head(m,lv)}<div class="card in"><p class="muted">${d.intro}</p><p>แตะฝั่งซ้าย แล้วแตะคู่ของมันฝั่งขวา</p>
    <div class="cols"><div><h4>${d.l}</h4>${L.map(x=>`<button class="chip ${got.includes(x.i)?'good':sel===x.i?'sel':''}" onclick="selL(${x.i})">${x.t}</button>`).join('')}</div>
    <div><h4>${d.r}</h4>${R.map(x=>`<button class="chip ${got.includes(x.i)?'good':''}" onclick="selR(${x.i})">${x.t}</button>`).join('')}</div></div>
    <p class="muted" style="margin-top:10px">จับคู่ได้ ${got.length}/${pairs.length} • ผิด ${wrong} ครั้ง</p></div>`)};
  window.selL=i=>{if(got.includes(i))return;sel=i;show()};
  window.selR=i=>{if(sel===null||got.includes(i))return;if(sel===i){got.push(i);sel=null;sfx('ok');if(got.length===pairs.length){const st=wrong===0?3:wrong<=2?2:1;setTimeout(()=>finish(m,st,`จับคู่ครบ ${pairs.length} คู่ ผิด ${wrong} ครั้ง`),300)}}else{wrong++;sfx('bad');buzz();toast('ยังไม่ใช่คู่กัน');sel=null}show()};
  show();
}

function dChain(m,d,lv){const sc=d.scens?sample(d.scens,1)[0]:d;CUR.sc=sc;
  render(`${topbar("lesson('"+m.id+"')")}${head(m,lv)}<div class="card in"><p class="muted">${sc.intro}</p>
  ${sc.steps.map((s,i)=>`<div class="step"><label for="s${i}">${s.l}</label>${s.h?`<div class="hint">${s.h}</div>`:''}<textarea id="s${i}">${esc(S.reflect[m.id+lv+i]||'')}</textarea></div>`).join('')}
  <div class="row"><button class="btn" onclick="chainNext('${m.id}')">${sc.check?'ต่อไป: เช็คตัวเอง':'บันทึกและดูผล'}</button></div></div>`);
}
function chainNext(id){const m=M(id);const sc=CUR.sc,lv=CUR.lv;let filled=0;
  sc.steps.forEach((_,i)=>{const v=document.getElementById('s'+i).value.trim();S.reflect[m.id+lv+i]=v;if(v.length>=15)filled++});save();
  if(filled<sc.steps.length){toast(`ยังมีช่องที่ตอบสั้นไปนะ (${filled}/${sc.steps.length})`);return}
  if(!sc.check){finish(m,3,'เก็บที่คุณเขียนไว้แล้ว ลองกลับมาอ่านอีกทีหลังเล่นโหมดอื่น');return}
  render(`${topbar("drill('"+m.id+"',"+lv+")")}${head(m,lv)}<div class="card in"><h3>เช็คตัวเองแบบไม่โกงนะ</h3><p class="muted">อ่านที่ตัวเองเขียนอีกรอบ แล้วติ๊กเฉพาะข้อที่ทำได้จริง ๆ</p>
  ${sc.steps.map((s,i)=>`<div class="why" style="margin-bottom:8px"><b>${s.l}</b><br>${esc(S.reflect[m.id+lv+i])}</div>`).join('')}
  <div style="margin-top:12px">${sc.check.map((c,i)=>`<label class="chk"><input type="checkbox" id="c${i}"><span>${c}</span></label>`).join('')}</div>
  <div class="row"><button class="btn" onclick="chainDone('${m.id}')">ดูผล</button></div></div>`);
}
function chainDone(id){const m=M(id);const n=CUR.sc.check.length;let k=0;for(let i=0;i<n;i++)if(document.getElementById('c'+i).checked)k++;
  const st=k===n?3:k>=n-1?2:k>=1?1:0;finish(m,st,`ผ่าน ${k} จาก ${n} ข้อ ${st===3?'คิดครบทุกด้านเลย':'ข้อที่ยังไม่ได้ติ๊ก คือจุดที่ควรกลับไปคิดต่อ'}`);
}

/* ===================== BLITZ ===================== */
let BZ=null;
function blitzPool(){const p=[];MODES.forEach(m=>m.levels.forEach(l=>{if(l.type==='quiz'&&!l.table)l.qs.forEach(q=>p.push({m,q}))}));return shuffle(p)}
function startBlitz(){BZ={pool:blitzPool(),i:0,score:0,lives:3,combo:0,max:0,left:60,lock:false,done:false,miss:[]};
  render(`${topbar("home('blitz')")}<div class="card blitz"><div class="bzhud"><div class="hearts" id="bh"></div><div class="bzt" id="bt">60</div><div class="bzs">คะแนน <b id="bs">0</b></div></div>
  <div class="bzbar"><i id="bb" style="width:100%"></i></div><div style="text-align:center"><span class="combo" id="bc"></span></div><div id="bq"></div></div>`);
  sfx('level');bzHud();bzShow();
  timerHandle=setInterval(()=>{if(BZ.done)return;BZ.left--;bzHud();if(BZ.left<=5&&BZ.left>0)sfx('tick');if(BZ.left<=0)bzEnd()},1000);
}
function bzHud(){const t=document.getElementById('bt');if(!t)return;t.textContent=Math.max(0,BZ.left);t.classList.toggle('low',BZ.left<=10);
  document.getElementById('bh').textContent='❤️'.repeat(BZ.lives)+'🖤'.repeat(3-BZ.lives);document.getElementById('bs').textContent=BZ.score;
  document.getElementById('bb').style.width=Math.min(100,BZ.left/60*100)+'%';const c=document.getElementById('bc');c.textContent=BZ.combo>=2?`🔥 คอมโบ x${BZ.combo}`:''}
function bzShow(){const {m,q}=BZ.pool[BZ.i%BZ.pool.length];BZ.lock=false;
  document.getElementById('bq').innerHTML=`<div class="bzq" style="--c:${m.c}"><span class="mtag">${ic(m)} ${m.en}</span><h3>${q.q}</h3>${q.o.map((o,k)=>`<button class="opt" onclick="bzPick(${k})">${o}</button>`).join('')}</div>`}
function bzPick(k){if(BZ.lock||BZ.done)return;BZ.lock=true;const it=BZ.pool[BZ.i%BZ.pool.length],q=it.q;const btns=document.querySelectorAll('#bq .opt');btns[q.a].classList.add('right');
  if(k===q.a){BZ.score++;BZ.combo++;BZ.max=Math.max(BZ.max,BZ.combo);BZ.left+=2;sfx('ok');floatAt(btns[k],BZ.combo>=3?`+1 🔥${BZ.combo}`:'+1 · +2วิ')}
  else{btns[k].classList.add('wrong');BZ.lives--;BZ.combo=0;BZ.miss.push(it);sfx('bad');buzz();shakeCard()}
  bzHud();BZ.i++;setTimeout(()=>{if(BZ.done)return;if(BZ.lives<=0)bzEnd();else bzShow()},k===q.a?420:1200)}
function bzEnd(){if(BZ.done)return;BZ.done=true;clearInterval(timerHandle);
  const rec=BZ.score>S.blitz.best&&BZ.score>0;const gain=BZ.score*5+BZ.max*2+10;S.xp+=gain;S.blitz.played++;if(rec)S.blitz.best=BZ.score;S.maxCombo=Math.max(S.maxCombo,BZ.max);save();
  const why=BZ.lives<=0?'หมดชีวิต 💔':'หมดเวลา ⏰';
  render(`${topbar("home('blitz')")}<div class="card result blitz"><canvas id="cf"></canvas><div class="muted">${why}</div><h2 style="font-size:48px;margin:4px 0">${BZ.score}</h2><div class="muted">คะแนน</div>
  ${rec?'<div class="rec">🏆 สถิติใหม่!</div>':`<p class="muted">สถิติสูงสุด ${S.blitz.best}</p>`}
  <div class="score" style="margin-top:12px"><div><b>${BZ.max}</b><span>คอมโบสูงสุด</span></div><div><b>${BZ.miss.length}</b><span>ตอบผิด</span></div><div><b>+<i id="gx" style="font-style:normal">0</i></b><span>XP</span></div></div>
  ${sensei(BZ.score>=20?'เร็วดั่งสายฟ้า! ⚡':BZ.score>=10?'คมและไว ใช้ได้เลย':'อุ่นเครื่องแล้ว รอบหน้าไปให้ไกลกว่านี้!')}
  <div class="row" style="justify-content:center"><button class="btn" onclick="startBlitz()">อีกรอบ ⚡</button><button class="btn ghost" onclick="home('blitz')">กลับ</button></div></div>
  ${BZ.miss.length?`<div class="sec">ข้อที่พลาด เรียนรู้ไว้<span>${BZ.miss.length} ข้อ</span></div>`+BZ.miss.map(({m,q})=>`<div class="card" style="--c:${m.c};border-left:5px solid ${m.c}"><span class="mtag">${ic(m)} ${m.en}</span><p><b>${q.q}</b></p><div class="why ok">✔ ${q.o[q.a]}<br><span class="muted">${q.why}</span></div></div>`).join(''):''}`);
  document.querySelector('.result .sensei').style.justifyContent='center';countUp('gx',gain);
  if(rec){sfx('star');confetti(document.getElementById('cf'),'#FF8A5B')}
}

/* ===================== CASE CLINIC ===================== */
let CQ=[],ci=0,cs={c:0,n:0},picks=[];
function startClinic(){const basic=CASES.filter(c=>!c.seq),hard=CASES.filter(c=>c.seq);CQ=shuffle([...sample(basic,3),...sample(hard,2)]);ci=0;cs={c:0,n:0};showCase()}
function modeGrid(dis){return `<div class="modegrid">${MODES.map(m=>`<button class="mbtn ${dis&&dis.includes(m.id)?'dis':''}" style="--c:${m.c}" onclick="chooseMode('${m.id}')"><b>${m.en}</b><span>${m.th}</span></button>`).join('')}</div>`}
function showCase(){const c=CQ[ci];picks=[];
  render(`${topbar("home('clinic')")}<div class="prog" style="--c:var(--ink)">${CQ.map((_,k)=>`<i class="${k<=ci?'on':''}"></i>`).join('')}</div>
  <div class="card in"><div class="muted">เคสที่ ${ci+1} จาก ${CQ.length}${c.seq?' • เคสยาก: เลือก 2 แบบเรียงกัน':''}</div><p class="scen">${c.s}</p><p class="muted" id="ask">${c.seq?'ควรเริ่มด้วยวิธีคิดแบบไหน "ก่อน" ดี?':'ควรใช้วิธีคิดแบบไหนดี?'}</p>
  <div id="grid">${modeGrid()}</div><div id="fb"></div></div>`);
}
function chooseMode(id){const c=CQ[ci];picks.push(id);
  if(c.seq&&picks.length<2){document.getElementById('ask').textContent=`เลือก ${M(id).en} ก่อน แล้วต่อด้วยวิธีคิดแบบไหน?`;document.getElementById('grid').innerHTML=modeGrid([id]);return}
  let level,useIds;
  if(c.seq){const exact=picks[0]===c.seq[0]&&picks[1]===c.seq[1];const near=!exact&&(picks.includes(c.seq[0])&&picks.includes(c.seq[1])||c.ok.includes(picks[0])&&picks[1]===c.seq[1]||picks[0]===c.seq[0]);level=exact?2:near?1:0;useIds=level?picks:c.seq}
  else{const best=c.best.includes(id),near=c.ok.includes(id);level=best?2:near?1:0;useIds=level?[id]:c.best}
  if(level===2){cs.c++;sfx('star')}else if(level===1){cs.n++;sfx('ok')}else{sfx('bad');buzz()}
  document.getElementById('grid').querySelectorAll('.mbtn').forEach(b=>b.onclick=null);
  const label=c.seq?c.seq.map(x=>M(x).en).join(' → '):M(c.best[0]).en;
  const use=M(useIds[0]);const qs=use.ask.slice(0,3);
  document.getElementById('fb').innerHTML=`<div class="why ${level===2?'ok':level===1?'':'bad'}" style="margin-top:12px"><b>${level===2?'ตรงเป๊ะ':level===1?'เกือบแล้ว แต่ยังมีแบบหรือลำดับที่ตรงกว่านี้':'ยังไม่ใช่'}</b> — ${level===2?'':`ที่เหมาะที่สุดคือ <b>${label}</b> `}${c.why}</div>
  <div class="card" style="margin-top:12px;border-left:5px solid ${use.c}"><h3>ลองคิดด้วย ${use.en}</h3>${qs.map((q,i)=>`<div class="step"><label>${q}</label><textarea id="ca${i}"></textarea></div>`).join('')}
  <div class="row"><button class="btn" onclick="caseNext()">${ci<CQ.length-1?'เคสถัดไป':'สรุปผล'}</button></div></div>`;
  document.getElementById('fb').scrollIntoView({behavior:'smooth'});
}
function caseNext(){let f=0;for(let i=0;i<3;i++){const el=document.getElementById('ca'+i);if(el&&el.value.trim().length>=10)f++}
  if(f<2){toast('ตอบคำถามอย่างน้อย 2 ข้อก่อนนะ');return}
  ci++;if(ci<CQ.length)showCase();else{const gain=cs.c*30+cs.n*15+20;S.xp+=gain;S.clinic.played+=CQ.length;S.clinic.correct+=cs.c;S.clinic.near+=cs.n;save();
    render(`${topbar("home('clinic')")}<div class="card result"><canvas id="cf"></canvas><h2>จบรอบ Case Clinic</h2><div class="score" style="margin-top:14px"><div><b>${cs.c}</b><span>ตรงเป๊ะ</span></div><div><b>${cs.n}</b><span>ใกล้เคียง</span></div><div><b>${CQ.length-cs.c-cs.n}</b><span>พลาด</span></div></div>
    <p>${cs.c===CQ.length?'อ่านโจทย์ปุ๊บ รู้เลยว่าต้องใช้วิธีไหน เก่งมาก!':cs.c+cs.n>=3?'เริ่มจับทางได้แล้ว ลองสังเกตคำแบบนี้ในโจทย์ เช่น "ต้องเลือก" "ทำไม่ได้" "แล้วจะเกิดอะไร" "มันก็เป็นแบบนี้" "ไม่รู้ว่าอนาคตจะเป็นยังไง"':'ลองกลับไปเล่นใน Dojo อีกหน่อย แล้วสังเกตว่าแต่ละโหมด "เหมาะกับโจทย์แบบไหน"'}</p><p class="muted">+${gain} XP</p>
    <div class="row" style="justify-content:center"><button class="btn" onclick="startClinic()">เล่นอีกรอบ</button><button class="btn ghost" onclick="home('dojo')">กลับ Dojo</button></div></div>`);
    if(cs.c>=3)confetti(document.getElementById('cf'),'#17233A')}
}

/* ===================== MY PROBLEM ===================== */
function myProblem(pre){
  render(`${topbar("home('mine')")}<div class="head" style="--c:var(--ink)"><div class="k">โจทย์ของฉัน</div><h2>เอาปัญหาจริงมาคิด</h2><div class="d">เขียนปัญหาสั้น ๆ แล้วเลือกวิธีคิด เดี๋ยวเกมพาคิดไปทีละคำถาม</div></div>
  <div class="card in"><label class="step" style="font-weight:600">กำลังเจอปัญหาอะไร หรือกำลังลังเลเรื่องอะไรอยู่?</label><textarea id="pb" placeholder="เช่น ต้องเลือกว่าจะรับงานใหม่ที่เงินดีแต่ไกลบ้านไหม"></textarea>
  <p class="muted" style="margin-top:12px">เลือกวิธีคิด${pre?'':' (ไม่แน่ใจ? ลองเล่น Case Clinic ฝึกเลือกดูก่อน)'}</p><div id="pg">${MODES.map(m=>`<button class="mbtn ${pre===m.id?'pick':''}" style="--c:${m.c};margin:3px 0;width:100%" onclick="pickMy('${m.id}')"><b>${m.en}</b><span>${m.th}</span></button>`).join('')}</div></div>`);
  CUR.my=pre||null;if(pre)document.querySelector('.mbtn.pick')?.scrollIntoView({block:'center'});
  window.pickMy=id=>{CUR.my=id;document.querySelectorAll('#pg .mbtn').forEach(b=>b.classList.remove('pick'));[...document.querySelectorAll('#pg .mbtn')].find(b=>b.getAttribute('onclick').includes(id)).classList.add('pick');
    const pb=document.getElementById('pb').value.trim();if(pb.length<8){toast('เขียนปัญหาก่อนสักหน่อย');return}myWalk(pb,id)};
}
function myWalk(problem,id){const m=M(id);let i=0;const ans=[];
  const show=()=>{render(`${topbar("myProblem()")}${head(m)}<div class="prog" style="--c:${m.c}">${m.ask.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>
    <div class="card in"><div class="why" style="margin:0 0 12px"><b>โจทย์:</b> ${esc(problem)}</div>${ans.map((a,k)=>`<p class="muted" style="margin:0">${m.ask[k]}</p><p style="margin:2px 0 10px">${esc(a)}</p>`).join('')}
    <div class="step"><label>${m.ask[i]}</label><textarea id="ma" autofocus></textarea></div>
    <div class="row"><button class="btn" onclick="myNext()">${i<m.ask.length-1?'ข้อถัดไป':'บันทึก'}</button></div></div>`);document.getElementById('ma').focus()};
  window.myNext=()=>{const v=document.getElementById('ma').value.trim();if(v.length<10){toast('ลองเขียนให้ละเอียดขึ้นอีกนิด');return}ans.push(v);i++;if(i<m.ask.length)show();else{S.journal.push({date:today(),mode:id,problem,answers:ans});S.xp+=60;S.last[id]=Date.now();save();
    render(`${topbar("home('mine')")}<div class="card result" style="--c:${m.c}"><canvas id="cf"></canvas><h2>บันทึกแล้ว</h2><p>คุณคิดครบ ${m.ask.length} คำถามของ ${m.en} กับปัญหาจริงของตัวเอง ฝึกแบบนี้แหละติดตัวที่สุด</p><p class="muted">+60 XP</p>
    <div class="row" style="justify-content:center"><button class="btn ghost" onclick="myWalkOther(${JSON.stringify(problem).replace(/"/g,'&quot;')})">ลองคิดเรื่องเดิมด้วยวิธีอื่น</button><button class="btn" onclick="home('mine')">ดูบันทึก</button></div></div>`);confetti(document.getElementById('cf'),m.c)}};
  show();
}
function myWalkOther(p){
  render(`${topbar("home('mine')")}<div class="card in"><div class="why"><b>โจทย์:</b> ${esc(p)}</div><p class="muted" style="margin-top:12px">เลือกวิธีคิดอีกแบบเลย</p><div>${MODES.map(m=>`<button class="mbtn" style="--c:${m.c};margin:3px 0;width:100%" onclick="myWalk(${JSON.stringify(p).replace(/"/g,'&quot;')},'${m.id}')"><b>${m.en}</b><span>${m.th}</span></button>`).join('')}</div></div>`)}

home();
</script>
</body>
