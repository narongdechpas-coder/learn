<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thinking Dojo — ฝึก 18 วิธีคิด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F5F9; --card:#FFFFFF; --ink:#17233A; --ink-2:#4B5568; --ink-3:#8A93A6;
    --line:#DDE2EC; --ok:#2E8B57; --warn:#C9A227; --bad:#C94F3D; --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Thai",-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;font-size:16px;line-height:1.55}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #7C9CFF;outline-offset:2px}
  textarea,input{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
  textarea{min-height:84px;resize:vertical}
  .app{max-width:760px;margin:0 auto;padding:16px 16px 80px;position:relative}

  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 14px}
  .brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
  .brand small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
  .pillrow{display:flex;gap:8px;align-items:center}
  .xp,.streak{display:flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
  .xp{background:var(--ink);color:#fff}
  .streak{background:#FFF3D6;color:#8A5A00;border:1px solid #F1D48A}
  .back{color:var(--ink-2);font-weight:500;padding:6px 0}

  /* hero with canvas */
  .hero{position:relative;padding:22px 0 12px;min-height:150px;overflow:hidden;border-radius:18px}
  .hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.7}
  .hero .in{position:relative;padding:0 4px}
  .hero h1{font-size:30px;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em}
  .hero p{margin:0;color:var(--ink-2);max-width:52ch}

  .tabs{display:flex;gap:6px;margin:16px 0 14px;overflow-x:auto;padding-bottom:2px}
  .tabs button{flex:1 0 auto;padding:10px 14px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-weight:600;color:var(--ink-2);white-space:nowrap}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .sec{margin:18px 0 8px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
  .sec span{font-weight:500;color:var(--ink-3);font-size:13px}
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .tile{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:14px 14px 14px;overflow:hidden;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}
  .tile:active{transform:scale(.97)}
  .tile .num{font-size:12px;color:var(--ink-3);font-weight:600}
  .tile .nm{font-weight:700;font-size:15px;line-height:1.25;margin-top:4px}
  .tile .th{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .tile .lv{display:flex;gap:4px;margin-top:8px}
  .tile .lv i{flex:1;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
  .tile .lv i b{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c);transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .tile.new{border-style:dashed}
  .tile .dot{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:var(--c)}
  .tile .tag{position:absolute;top:10px;right:28px;font-size:11px;color:var(--c);font-weight:700}

  .head{border-left:6px solid var(--c);padding:4px 0 4px 14px;margin:6px 0 16px}
  .head .k{color:var(--ink-3);font-size:13px;font-weight:600}
  .head h2{margin:2px 0 4px;font-size:24px;line-height:1.2;letter-spacing:-.015em}
  .head .d{color:var(--ink-2)}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .card.in{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
  .card.in:nth-child(2){animation-delay:.06s}.card.in:nth-child(3){animation-delay:.12s}.card.in:nth-child(4){animation-delay:.18s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .card h3{margin:0 0 8px;font-size:16px}
  .card p{margin:0 0 8px}.card p:last-child{margin:0}
  .take{background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;margin:10px 0 0}
  .qs{margin:0;padding-left:20px;color:var(--ink-2)}.qs li{margin:3px 0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:600;background:var(--ink);color:#fff;min-height:46px;transition:transform .12s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn.c{background:var(--c)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .muted{color:var(--ink-3);font-size:13.5px}
  .prog{display:flex;gap:4px;margin-bottom:12px}
  .prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--c)}

  /* levels */
  .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
  .lvl{text-align:left;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;position:relative}
  .lvl b{display:block;font-size:14px}.lvl span{font-size:12.5px;color:var(--ink-2)}
  .lvl .st{color:var(--warn);letter-spacing:1px;font-size:13px;margin-top:4px;display:block}
  .lvl.lock{opacity:.5}
  .lvl.lock::after{content:"🔒";position:absolute;top:8px;right:10px}
  @media (max-width:520px){.levels{grid-template-columns:1fr}}

  /* timer ring */
  .ring{width:110px;height:110px;margin:4px auto 10px;position:relative}
  .ring svg{transform:rotate(-90deg);width:100%;height:100%}
  .ring circle{fill:none;stroke-width:8}
  .ring .bg{stroke:var(--line)}
  .ring .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
  .ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
  .ring.low .fg{stroke:var(--bad)}.ring.low .t{color:var(--bad)}
  .ideas{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}
  .ideas li{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  .count{font-weight:700;color:var(--c);display:inline-block}
  .count.bump{animation:bump .3s}
  @keyframes bump{40%{transform:scale(1.4)}}

  .opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;line-height:1.45;transition:transform .12s,border-color .15s}
  .opt:hover{border-color:var(--ink-3)}
  .opt.right{border-color:var(--ok);background:#EEF8F1}
  .opt.wrong{border-color:var(--bad);background:#FCEFEC;animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .why{border-radius:12px;padding:12px 14px;margin-top:6px;background:#F7F8FC;border:1.5px dashed var(--line);animation:rise .3s both}
  .why.ok{background:#EEF8F1;border-color:#B8E0C5}.why.bad{background:#FCEFEC;border-color:#F1C4BC}
  table.tb{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}
  .tb th,.tb td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}
  .tb th:first-child,.tb td:first-child{text-align:left;font-weight:600}
  .tb th{color:var(--ink-3);font-weight:600;font-size:12.5px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;text-align:left;line-height:1.4;transition:transform .12s}
  .chip.used{opacity:.35;pointer-events:none}
  .chip.sel{border-color:var(--ink);background:#F7F8FC;transform:translateY(-2px)}
  .chip.good{border-color:var(--ok);background:#EEF8F1;pointer-events:none}
  .chip.badc{border-color:var(--bad);background:#FCEFEC;animation:shake .35s}
  .seq{list-style:none;padding:0;margin:0 0 12px}
  .seq li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin-bottom:6px}
  .seq li .n{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px;flex:none}
  .seq li.empty{border-style:dashed;color:var(--ink-3)}
  .seq li.good{border-color:var(--ok);background:#EEF8F1}.seq li.badc{border-color:var(--bad);background:#FCEFEC}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cols .chip{width:100%}
  .cols h4{margin:0 0 6px;font-size:13px;color:var(--ink-3);font-weight:600}

  .step{margin-bottom:12px}.step label{display:block;font-weight:600;margin-bottom:6px}
  .step .hint{color:var(--ink-3);font-size:13px;margin-bottom:6px}
  .chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;cursor:pointer}
  .chk input{width:18px;height:18px;margin-top:3px;flex:none}
  .flip{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
  .flip .f{background:#FCEFEC;border-radius:10px;padding:8px 10px;font-size:14px}
  @media (max-width:520px){.flip{grid-template-columns:1fr}}

  .result{text-align:center;padding:26px 16px;position:relative;overflow:hidden}
  .result .big{font-size:46px;letter-spacing:4px;color:var(--warn);margin:6px 0;display:flex;justify-content:center;gap:4px}
  .result .big span{display:inline-block;transform:scale(0);animation:star .5s cubic-bezier(.2,1.4,.4,1) forwards}
  .result .big span:nth-child(2){animation-delay:.15s}.result .big span:nth-child(3){animation-delay:.3s}
  .result .big span.off{color:var(--line)}
  @keyframes star{to{transform:scale(1)}}
  .result h2{margin:0;font-size:24px}.result p{color:var(--ink-2)}
  .result canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  .scen{font-size:18px;line-height:1.5;font-weight:500}
  .modegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
  .mbtn{text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;border-left-width:5px;border-left-color:var(--c);line-height:1.3;transition:transform .12s}
  .mbtn:active{transform:scale(.97)}
  .mbtn b{display:block;font-size:14px}.mbtn span{font-size:12px;color:var(--ink-2)}
  .mbtn.pick{outline:2px solid var(--ink)}
  .mbtn.dis{opacity:.4;pointer-events:none}
  .score{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0 14px}
  .score div{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;text-align:center;min-width:90px}
  .score b{display:block;font-size:22px}.score span{font-size:12px;color:var(--ink-3)}

  .daily{background:linear-gradient(135deg,#17233A,#2F4570);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .daily h3{margin:0 0 4px;font-size:16px}.daily p{margin:0;opacity:.85;font-size:14px}
  .daily .btn{background:#fff;color:var(--ink)}
  .daily.done{background:#EEF8F1;color:var(--ink);border:1.5px solid #B8E0C5}
  .rev{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .rev button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;border-left:5px solid var(--c)}
  .rev b{display:block;font-size:14px}.rev span{font-size:12px;color:var(--ink-3)}
  .journal{border-left:4px solid var(--c);padding:8px 12px;background:#fff;border-radius:0 12px 12px 0;margin-bottom:8px}
  .journal .d{font-size:12px;color:var(--ink-3)}
  .journal p{margin:4px 0;font-size:14px}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .pill{display:inline-block;margin:6px 4px 0;padding:6px 14px;border-radius:999px;background:#FFF3D6;color:#8A5A00;border:1px solid #F1D48A;font-weight:600;font-size:14px;animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}

  /* ===== fun layer ===== */
  body{background:radial-gradient(circle at 10% 0%,#FFE9D6 0,transparent 40%),radial-gradient(circle at 95% 10%,#E3E9FF 0,transparent 45%),radial-gradient(#DDE2EC 1px,transparent 1px) 0 0/22px 22px,var(--paper)}
  .xp{border-left:6px solid var(--b,#eee)}
  .mute{width:34px;height:34px;border-radius:50%;background:#fff;border:1.5px solid var(--line);font-size:15px;display:grid;place-items:center}
  .hero{background:linear-gradient(135deg,#17233A 0%,#2F4570 60%,#5B3A8C 100%);color:#fff;padding:20px 16px 16px;box-shadow:0 10px 30px -12px rgba(23,35,58,.55)}
  .hero h1{font-size:26px}.hero p{color:rgba(255,255,255,.8)}
  .beltrow{display:flex;align-items:center;gap:12px;margin-top:12px}
  .beltico{width:54px;height:16px;outline:1.5px solid rgba(255,255,255,.35);border-radius:3px;background:var(--b);position:relative;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
  .beltico::after{content:"";position:absolute;left:50%;top:-3px;width:14px;height:22px;margin-left:-7px;border-radius:3px;background:var(--b);filter:brightness(.88)}
  .beltbar{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}
  .beltbar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#FFD36E,#FF8A5B);transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .beltlbl{font-size:13px;opacity:.9;margin-top:6px}
  .quick{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .quick button{padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:600;font-size:14px}
  .quick button:active{transform:scale(.96)}

  .tile{background:color-mix(in srgb,var(--c) 7%,#fff);border-color:color-mix(in srgb,var(--c) 22%,var(--line));transition:transform .15s,box-shadow .15s}
  .tile:hover{transform:translateY(-3px);box-shadow:0 10px 20px -10px color-mix(in srgb,var(--c) 70%,transparent)}
  .tile .ic{font-size:26px;line-height:1;margin-bottom:6px;display:inline-block;transition:transform .2s}
  .tile:hover .ic{transform:scale(1.2) rotate(-8deg)}
  .tile .crown{position:absolute;top:8px;right:10px;font-size:16px}
  .head h2 .ic{margin-right:6px}

  .sensei{display:flex;align-items:flex-end;gap:10px;margin:0 0 12px}
  .sensei .av{font-size:34px;line-height:1;flex:none;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-4px)}}
  .sensei .bub{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;font-weight:600;font-size:14.5px}
  .sensei .bub.say{animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
  .combo{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:#E0482F;font-size:15px;min-height:22px}
  .combo.hot{animation:bump .35s}
  .float{position:fixed;pointer-events:none;font-weight:800;font-size:18px;color:var(--ok);z-index:20;animation:floatup .9s ease-out forwards;text-shadow:0 2px 0 #fff}
  @keyframes floatup{to{transform:translateY(-48px);opacity:0}}
  .card.shake{animation:shake .35s}
  .ideas li{background:var(--h,#F3F5F9);border-color:transparent;font-weight:500}
  .goal{display:flex;gap:6px;margin-top:8px}.goal span{font-size:22px;color:var(--line);transition:color .3s,transform .3s}.goal span.on{color:var(--warn);transform:scale(1.2)}

  .lvup{position:fixed;inset:0;background:rgba(23,35,58,.75);display:grid;place-items:center;z-index:30;animation:fade .3s both;padding:16px}
  @keyframes fade{from{opacity:0}}
  .lvbox{position:relative;overflow:hidden;background:#fff;border-radius:20px;padding:28px 22px;text-align:center;max-width:340px;width:100%;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
  .lvbox canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .lvbox h2{margin:8px 0 4px;font-size:26px}
  .beltart{width:220px;height:30px;margin:14px auto 22px;background:var(--b);border-radius:4px;position:relative;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.4)}
  .beltart::before{content:"";position:absolute;left:50%;top:-6px;width:34px;height:42px;margin-left:-17px;background:var(--b);border-radius:5px;filter:brightness(.88);z-index:1}
  .beltart::after{content:"";position:absolute;left:50%;top:26px;width:46px;height:30px;margin-left:-23px;background:linear-gradient(100deg,transparent 0 10%,var(--b) 10% 42%,transparent 42% 58%,var(--b) 58% 90%,transparent 90%);filter:brightness(.8)}
  .badgepop{position:fixed;left:50%;top:14px;transform:translate(-50%,-160%);visibility:hidden;background:#fff;border:2px solid var(--warn);border-radius:16px;padding:10px 16px;display:flex;gap:10px;align-items:center;z-index:25;box-shadow:0 10px 30px -10px rgba(0,0,0,.35);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
  .badgepop.on{transform:translate(-50%,0);visibility:visible}
  .badgepop .bi{font-size:30px}.badgepop b{display:block}.badgepop span{font-size:13px;color:var(--ink-2)}
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .bdg{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
  .bdg .bi{font-size:28px;display:block}.bdg b{display:block;font-size:12.5px;line-height:1.3;margin-top:4px}.bdg span{font-size:11px;color:var(--ink-3);line-height:1.3;display:block}
  .bdg.lock .bi{filter:grayscale(1);opacity:.35}.bdg.lock b{color:var(--ink-3)}

  .blitz{border-color:#FFB547}
  .bzhud{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .hearts{font-size:20px;letter-spacing:2px}
  .bzt{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;min-width:60px;text-align:center}
  .bzt.low{color:var(--bad);animation:bump .5s infinite}
  .bzs{font-weight:600;color:var(--ink-2)}.bzs b{font-size:22px;color:var(--ink)}
  .bzbar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 0 10px}
  .bzbar i{display:block;height:100%;background:linear-gradient(90deg,#FF8A5B,#FFD36E);transition:width 1s linear}
  .mtag{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:999px;padding:3px 10px;margin-bottom:6px}
  .bzq{animation:rise .25s both}
  .bzq h3{font-size:16.5px}
  .bzhero{text-align:center;padding:22px 16px}
  .bzhero .bolt{font-size:56px;display:inline-block;animation:bob 1.6s ease-in-out infinite}
  .rec{display:inline-block;background:linear-gradient(90deg,#FF8A5B,#FFD36E);color:#4A2A00;font-weight:800;padding:6px 14px;border-radius:999px;margin:6px 0;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero canvas{display:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="badgepop" id="badgepop" aria-live="polite"></div>
<script>
/* ===================== MODE DATA ===================== */
/* level types: quiz{qs,pick,table?,intro} brainstorm{prompts,seconds,targets,flip?} sequence{chains,intro}

{"id":"lateral","num":3,"group":"ลองมองมุมอื่นดูบ้าง","en":"Lateral Thinking","th":"คิดนอกกรอบ","c":"#8E44AD","def":"มองปัญหาจากมุมที่ไม่มีใครคิด แทนที่จะลุยชนตรง ๆ","ex":"โรงพยาบาลทำให้คนไข้รอสั้นลงไม่ได้ เลยติดกระจก ติดจอ แล้วมีข้อมูลให้อ่านในห้องรอ คนไข้เลย \"รู้สึก\" ว่ารอไม่นาน","take":"ถ้าวิธีตรง ๆ ไม่เวิร์ก ลองเปลี่ยนมุมมองปัญหาดู","ask":["จริง ๆ แล้วปัญหาคืออะไร เป็นเรื่องตัวเลข หรือเรื่องความรู้สึกของคน?","ถ้าแก้ตรง ๆ ไม่ได้ แก้ที่ \"รอบ ๆ\" มันแทนได้ไหม?","ถ้าเปลี่ยนจาก \"จะลด X ยังไง\" เป็น \"ทำยังไงให้ X ไม่สำคัญอีกต่อไป\" จะได้ไอเดียอะไร?","มีใครในโลกเจอปัญหาคล้าย ๆ กัน แล้วแก้ด้วยวิธีที่คาดไม่ถึงบ้าง?"],"levels":[{"type":"quiz","pick":3,"intro":"อันไหน \"เปลี่ยนมุม\" จริง ไม่ใช่ลุยชนตรง ๆ","qs":[{"q":"คนเช่าตึกบ่นว่าลิฟต์ช้ามาก แต่จะเปลี่ยนระบบลิฟต์ก็แพงเกิน","o":["เปลี่ยนมอเตอร์ลิฟต์","ติดกระจกกับจอข่าวสั้น ๆ ในลิฟต์และหน้าลิฟต์","ห้ามใช้ลิฟต์ไปชั้น 1–3","ส่งจดหมายขอโทษทุกเดือน"],"a":1,"why":"จริง ๆ ปัญหาไม่ใช่ \"ลิฟต์ช้า\" แต่คือ \"คนเบื่อตอนรอ\" ต่างหาก"},{"q":"ร้านอาหารคิวยาวตอนเที่ยง ลูกค้าเห็นคิวแล้วเดินหนี จะขยายร้านก็ไม่ได้","o":["ลดเมนูลง","ให้สั่งและจ่ายผ่านมือถือตอนต่อคิวไปเลย แล้วเปลี่ยนคิวรอโต๊ะเป็นคิวรับกลับบ้าน","จ้างพนักงานเสิร์ฟเพิ่ม","ขึ้นราคาตอนเที่ยง"],"a":1,"why":"เปลี่ยนคิวจากเรื่องน่ารำคาญ ให้เป็นช่วงที่ลูกค้าได้ทำอะไรที่มีประโยชน์"},{"q":"พนักงานไม่ยอมอ่านอีเมลประกาศจากฝ่ายบุคคล","o":["ส่งซ้ำสามรอบ","บังคับให้กดตอบรับ","ย้ายประกาศไปไว้ในที่ที่พนักงานเปิดดูทุกวันอยู่แล้ว","ให้หัวหน้าลงโทษ"],"a":2,"why":"แทนที่จะลากคนมาอ่านอีเมล ก็เอาข้อความไปหาคนแทนสิ"},{"q":"เมืองนึงมีคนทิ้งขยะไม่ลงถัง ขึ้นค่าปรับแล้วก็ไม่ดีขึ้น","o":["ขึ้นค่าปรับอีก","เพิ่มถังขยะเป็น 2 เท่า","ทำถังขยะที่มีเสียงตลก ๆ ตอนทิ้งลงถัง (ทิ้งขยะแล้วสนุก)","ติดกล้องวงจรปิด"],"a":2,"why":"เปลี่ยนจากแก้ด้วย \"การลงโทษ\" เป็นแก้ด้วย \"ความสนุก\" แค่เปลี่ยนว่าอะไรทำให้คนอยากทำ ก็คือเปลี่ยนมุมแล้ว"}]},{"type":"brainstorm","seconds":60,"targets":[4,7,10],"prompts":["โรงเรียนอยากให้เด็กอ่านหนังสือเยอะขึ้น แต่ \"ห้าม\" บังคับ ห้ามให้รางวัล ห้ามสอบ จะทำยังไงได้บ้าง?","ร้านออนไลน์โดนคืนของเยอะ อยากให้น้อยลง แต่ \"ไม่\" อยากทำให้การคืนของยุ่งยากขึ้น","บริษัทอยากให้พนักงานเสนอไอเดียเยอะขึ้น โดยไม่ต้องมีกล่องรับไอเดียหรือประชุม"]},{"type":"chain","scens":[{"intro":"ปัญหา: \"ลูกค้าโทรเข้า call center เยอะเกินไป รอสายนาน ลูกค้าโมโห\" ก่อนแก้ ลองเปลี่ยนมุมมองปัญหาก่อน","steps":[{"l":"1. เขียนปัญหาใหม่ 3 แบบ จาก 3 มุมที่ต่างกัน","h":"เช่น \"ทำไมลูกค้าต้องโทรมาด้วย?\" \"ทำยังไงให้รอแล้วไม่หงุดหงิด?\" \"จริง ๆ ลูกค้าอยากได้อะไร ไม่ใช่อยากคุยกับคนหรอกมั้ง?\""},{"l":"2. มุมไหนเปิดทางแก้ใหม่ได้มากที่สุด เพราะอะไร","h":""},{"l":"3. ทางแก้ 2 ทางที่ได้จากมุมใหม่ แบบที่ไม่ใช่ \"จ้างคนรับสายเพิ่ม\"","h":""}],"check":["3 มุมนั้นต่างกันจริง ไม่ได้แค่เปลี่ยนคำพูด","ทางแก้ไม่ได้มุ่งไปที่ \"ลดเวลารอ\" ตรง ๆ","มีอย่างน้อย 1 ทางที่ทำให้ปัญหาเดิม \"ไม่สำคัญ\" ไปเลย แทนที่จะแก้มัน"]},{"intro":"ปัญหา: \"พนักงานมาสายบ่อย เตือนแล้วก็ยังสาย\" ลองเปลี่ยนมุมก่อนแก้","steps":[{"l":"1. เขียนปัญหาใหม่ 3 แบบ จาก 3 มุมที่ต่างกัน","h":"เช่น \"งานนี้ต้องมาตรงเวลาจริงไหม?\" \"อะไรทำให้มาสายแล้วเขารู้สึกคุ้ม?\""},{"l":"2. มุมไหนเปิดทางแก้ใหม่ได้มากที่สุด","h":""},{"l":"3. ทางแก้ 2 ทางที่ไม่ใช่การลงโทษหรือตักเตือน","h":""}],"check":["3 มุมนั้นต่างกันจริง","ทางแก้ไม่ได้วนอยู่แค่ \"เข้มขึ้น\" หรือ \"หย่อนลง\"","มีอย่างน้อย 1 ทางที่ถามกลับว่าตัวปัญหามันใช่ปัญหาจริงไหม"]}]}]},
{"id":"systemic","num":4,"group":"ลองมองมุมอื่นดูบ้าง","en":"Systemic Thinking","th":"คิดเชิงระบบ","c":"#1E8F6E","def":"มองให้เห็นว่าแต่ละส่วนมันส่งผลถึงกันยังไง อะไรวนกลับมาทำให้เรื่องหนักขึ้น แล้วใครอยากได้อะไร","ex":"ปล่อยหมาป่ากลับเข้า Yellowstone → กวางเปลี่ยนนิสัยไม่กล้ากินหญ้าริมน้ำ → ต้นไม้ฟื้น → ตลิ่งแม่น้ำแข็งแรงขึ้น","take":"สิ่งที่เราเห็นว่าเป็นปัญหา หลายทีเป็นแค่อาการ ต้องขุดลงไปดูว่าอะไรอยู่เบื้องหลัง","ask":["อาการที่เห็นอยู่ เชื่อมโยงกับส่วนไหนบ้าง?","ใครได้ประโยชน์จากสภาพตอนนี้ แล้วอะไรที่ผลักให้คนทำแบบนี้?","มีอะไรที่วนกลับมาทำให้ปัญหาเกิดซ้ำหรือหนักขึ้นเรื่อย ๆ ไหม?","ถ้าแก้ตรงนี้ จะไปกระทบส่วนไหนต่อบ้าง?"],"levels":[{"type":"sequence","intro":"เรียงดูว่าผลกระทบมันไหลต่อกันยังไง","chains":[{"t":"บริษัทเปลี่ยนมาจ่ายโบนัสเซลส์ตาม \"ยอดขาย\" อย่างเดียว","items":["เซลส์รีบปิดการขายให้ได้มากที่สุด","ลูกค้าได้ของที่ไม่ตรงกับที่อยากได้มากขึ้น","คืนของกับร้องเรียนเยอะขึ้น","ทีมบริการหลังการขายงานล้น ต้นทุนพุ่ง","ยอดขายสูง แต่กำไรจริงไม่ขึ้น ผู้บริหารงงว่าทำไม"]},{"t":"เมืองสร้างถนนเพิ่มเพื่อแก้รถติด","items":["เปิดถนนใหม่ รถวิ่งโล่งได้พักนึง","คนที่เคยนั่งรถเมล์รถไฟ หันมาขับรถเองเพราะสะดวก","รถเยอะขึ้นจนถนนใหม่ก็ติด","รถเมล์รถไฟรายได้หด ต้องลดรอบวิ่ง","คนยิ่งต้องพึ่งรถส่วนตัว รถติดหนักกว่าเดิมอีก"]}]},{"type":"quiz","pick":3,"intro":"ขุดลงไปดูว่าอะไรอยู่ใต้อาการ","qs":[{"q":"\"พนักงานลาออกเยอะ\" แบบไหนคือการมองทั้งระบบที่สุด?","o":["ขึ้นเงินเดือนให้ทุกคน","ดูว่าคนลาออกจากทีมไหนเยอะเป็นพิเศษ หัวหน้าทีมนั้นโดนวัดผลด้วยอะไร แล้วการวัดแบบนั้นทำให้หัวหน้าทำตัวยังไง","สัมภาษณ์คนที่ลาออก แล้วแก้ไปทีละเรื่อง","รีบจ้างคนใหม่ให้ไวขึ้น"],"a":1,"why":"หาว่าอะไรในโครงสร้างที่ \"ผลิต\" คนลาออกออกมา ไม่ใช่ไล่แก้ทีละอาการ"},{"q":"แบบไหนคือ \"ยิ่ง...ยิ่ง...\" ที่วนเสริมกันไปเรื่อย ๆ?","o":["ยิ่งขายดี ยิ่งมีงบโฆษณา ยิ่งขายดีขึ้นอีก","แอร์ปรับอุณหภูมิห้องให้คงที่","ของแพงขึ้น คนซื้อน้อยลง ราคาเลยลดลง","ฝนตกแล้วก็หยุด"],"a":0,"why":"แบบ \"ยิ่ง...ยิ่ง...\" จะโตขึ้นเรื่อย ๆ (ทั้งทางดีและทางแย่) ส่วนแอร์กับราคาของเป็นแบบที่ดึงกลับมาให้สมดุล"},{"q":"แก้ปัญหาตรงนี้แล้ว ปัญหาไปโผล่อีกที่ แบบนี้เรียกว่าอะไร?","o":["ดวงซวย","แค่ย้ายปัญหาไปที่อื่น แปลว่ายังไม่ได้แตะต้นเหตุจริง","ความสำเร็จ","ผลข้างเคียงที่เลี่ยงไม่ได้"],"a":1,"why":"ปัญหามักไหลไปหาทางที่ง่ายที่สุดเสมอ เหมือนน้ำ"},{"q":"ข้อไหนคือคำถามแบบมองทั้งระบบ?","o":["ใครทำผิด?","ทำไมสภาพแบบนี้ถึงทำให้คนรู้สึกว่าทำแบบนี้แหละสมเหตุสมผล?","จะลงโทษยังไงดี?","ทำให้เร็วขึ้นได้ไหม?"],"a":1,"why":"ระบบดี ๆ ทำให้คนธรรมดาทำถูก ระบบแย่ ๆ ทำให้คนดีทำผิดได้แบบมีเหตุผลเลย"}]},{"type":"chain","scens":[{"intro":"เรื่องมีอยู่ว่า: โรงพยาบาลเอกชนแห่งนึง \"หมอลาออกบ่อย\" ทั้งที่จ่ายเงินสูงกว่าที่อื่น ลองวาดภาพทั้งระบบดู","steps":[{"l":"1. ในเรื่องนี้มีใครบ้าง แล้วแต่ละคนโดนวัดผลด้วยอะไร","h":"หมอ ผู้บริหาร พยาบาล คนไข้ ผู้ถือหุ้น... แต่ละคนอยากได้อะไร โดนวัดผลด้วยอะไร"},{"l":"2. อะไรที่วนกลับมาทำให้ปัญหาหนักขึ้นเรื่อย ๆ","h":"เช่น หมอลาออก → หมอที่เหลืองานหนัก → เหนื่อย → ลาออกเพิ่มอีก"},{"l":"3. \"อาการ\" ที่คนชอบแก้ กับ \"ต้นเหตุ\" ที่ทำให้อาการนั้นเกิด","h":""},{"l":"4. จุดเดียวที่ถ้าขยับแล้วทั้งระบบเปลี่ยนตาม และผลข้างเคียงที่ต้องคอยดู","h":""}],"check":["บอกได้ว่าอย่างน้อย 3 ฝ่ายแต่ละฝ่ายอยากได้อะไร","เห็นวงจรที่อธิบายได้ว่าทำไมปัญหาไม่หายไปไหน","แยกอาการกับต้นเหตุออกจากกันได้ชัด","จุดที่เลือกไม่ใช่ \"ขึ้นเงินเดือน\" แล้วคิดเผื่อผลข้างเคียงไว้ด้วย"]},{"intro":"เรื่องมีอยู่ว่า: แอปสั่งอาหารมีปัญหา \"ไรเดอร์ขับเร็ว อุบัติเหตุบ่อย\" ออกกฎเข้มแล้วก็ไม่ดีขึ้น","steps":[{"l":"1. ในเรื่องนี้มีใครบ้าง แล้วแต่ละคนโดนวัดผลด้วยอะไร","h":"ไรเดอร์ ร้าน ลูกค้า แพลตฟอร์ม ระบบจ่ายงาน"},{"l":"2. อะไรที่วนผลักให้ไรเดอร์ต้องขับเร็ว","h":""},{"l":"3. ทำไมออกกฎเข้มแล้วไม่ช่วย ถ้ามองทั้งระบบ","h":""},{"l":"4. จุดที่ควรขยับ และผลข้างเคียง","h":""}],"check":["บอกได้ว่าอย่างน้อย 3 ฝ่ายแต่ละฝ่ายอยากได้อะไร","เห็นว่าขับเร็วเป็นสิ่งที่ \"สมเหตุสมผล\" สำหรับไรเดอร์ในระบบแบบนี้","จุดที่เลือกไปแก้ที่ว่าอะไรผลักให้คนทำ ไม่ใช่ไปออกกฎเพิ่ม","คิดเผื่อผลข้างเคียงไว้ได้"]}]}]},
{"id":"associative","num":5,"group":"ลองมองมุมอื่นดูบ้าง","en":"Associative Thinking","th":"เชื่อมโยงข้ามวงการ","c":"#C0392B","def":"หยิบไอเดียจากวงการที่ไม่เกี่ยวกันเลย มาต่อกันจนได้ของใหม่","ex":"ทีมหมอไปดูทีมช่างเปลี่ยนยางรถ F1 ทำงาน แล้วเอามาปรับวิธีส่งต่อคนไข้ในห้องผ่าตัด","take":"ไอเดียที่ดีที่สุดของเรา อาจซ่อนอยู่ในวงการที่เรายังไม่เคยไปส่องเลยก็ได้","ask":["มีวงการไหนเจอปัญหาหน้าตาเดียวกับเรา แต่แก้เก่งกว่า?","ในธรรมชาติ กีฬา ศิลปะ หรือเกม มีอะไรคล้าย ๆ เรื่องนี้บ้าง?","แก่นที่หยิบมาใช้ได้คืออะไร (ไม่ใช่ลอกวิธีมาทั้งดุ้น)?","ถ้าให้คนนอกวงการมาดู เขาจะเห็นอะไรที่เรามองข้ามไป?"],"levels":[{"type":"match","pick":5,"intro":"จับคู่ \"ไอเดียต้นทาง\" กับ \"ของที่เอาไปทำจริง\"","l":"ต้นทาง","r":"เอาไปใช้กับ","pool":[["ทีมช่างเปลี่ยนยาง F1","การส่งต่อคนไข้ในห้องผ่าตัด"],["สายการผลิตของโตโยต้า","ลดเวลารอในโรงพยาบาล"],["เกมมือถือ (แต้ม/สตรีค)","แอปเรียนภาษา"],["ปากนกกระเต็น","หัวรถไฟชินคันเซ็นที่ลดเสียงดังตอนออกจากอุโมงค์"],["หนามพืชที่ติดขนหมา","เทปตีนตุ๊กแก (Velcro)"],["จอมปลวก (ระบายอากาศเก่ง)","ตึกที่ไม่ต้องเปิดแอร์"],["นักบิน (เช็คลิสต์ก่อนบิน)","เช็คลิสต์ก่อนผ่าตัด"]]},{"type":"brainstorm","seconds":60,"targets":[4,7,10],"prompts":["ร้านตัดผมเรียนอะไรจาก \"สายการบิน\" ได้บ้าง?","โรงเรียนเรียนอะไรจาก \"เกมออนไลน์\" ได้บ้าง?","ธนาคารเรียนอะไรจาก \"ร้านสะดวกซื้อ\" ได้บ้าง?"]},{"type":"chain","scens":[{"intro":"โจทย์: บริษัทซอฟต์แวร์อยากให้ \"ปล่อยเวอร์ชันใหม่แล้วพังน้อยลง\" ลองยืมไอเดียจากวงการไกล ๆ มาช่วย","steps":[{"l":"1. เลือกวงการที่ไม่เกี่ยวกับซอฟต์แวร์เลย แต่เก่งเรื่อง \"ปล่อยของออกไปแบบไม่พลาด\"","h":"เช่น สายการบิน ครัวร้านอาหารหรู วงออร์เคสตรา การยิงจรวด"},{"l":"2. วงการนั้นใช้แก่นอะไร (เอาแก่น ไม่ใช่วิธีทำ)","h":""},{"l":"3. แปลงแก่นนั้นเป็นสิ่งที่ทีมซอฟต์แวร์ทำได้จริง 2 อย่าง","h":""},{"l":"4. อะไรที่ \"ไม่ควร\" ยกมาใช้ เพราะสถานการณ์ต่างกัน","h":""}],"check":["วงการที่เลือกไกลตัวจริง ไม่ใช่สาย IT ด้วยกัน","หยิบมาแค่แก่น ไม่ได้ลอกวิธีมาทั้งดุ้น","สิ่งที่แปลงมาเอาไปทำได้จริง","บอกได้ว่าการเทียบนี้ใช้ไม่ได้ตรงไหน"]}]}]},
{"id":"critical","num":6,"group":"หาเหตุผล ดูหลักฐาน","en":"Critical Thinking","th":"คิดแบบจับผิด","c":"#34495E","def":"เช็คหลักฐานให้ดี ถามกลับสิ่งที่ทุกคนเชื่อ แล้วค่อยสรุปแบบมีเหตุผลรองรับ","ex":"Barry Marshall ไม่เชื่อที่ใคร ๆ บอกกันว่าเครียดแล้วเป็นแผลในกระเพาะ เลยขุดต่อจนเจอว่าจริง ๆ แล้วเป็นเพราะเชื้อแบคทีเรีย H. pylori","take":"การตัดสินใจแย่ ๆ อยู่รอดมาได้ เพราะไม่มีใครหยุดถามว่า \"แน่ใจเหรอ?\"","ask":["มีหลักฐานอะไรบ้าง มาจากไหน ใครเก็บ แล้วเก็บยังไง?","เรากำลังเชื่ออะไรอยู่แบบไม่รู้ตัวรึเปล่า?","ถ้ามันผิด จะเห็นได้จากอะไร แล้วเราไปหาดูหรือยัง?","ถ้าเราเชื่อเรื่องนี้ ใครได้ประโยชน์?"],"levels":[{"type":"quiz","pick":3,"intro":"หาว่ามีอะไรที่แอบเชื่อไว้ หรือมองแบบลำเอียง","qs":[{"q":"\"ยอดขายขึ้น 20% หลังลงโฆษณา แปลว่าโฆษณาได้ผล\" ประโยคนี้แอบเชื่ออะไรไว้มากที่สุด?","o":["ลูกค้าชอบโฆษณา","ช่วงนั้นไม่มีอะไรอื่นเปลี่ยนเลย","โฆษณาทำมาดี","ยอดขายนับถูกต้อง"],"a":1,"why":"กับดัก \"เกิดทีหลัง เลยคิดว่าเป็นเพราะ\" ถ้าคู่แข่งของขาดพอดี ยอดก็ขึ้นได้เหมือนกัน"},{"q":"\"ลูกค้า 90% ที่ตอบแบบสอบถามพอใจ\" ต้องระวังอะไร?","o":["ตัวเลขสูงเกินจริง","คนที่ไม่พอใจมักไม่มาตอบ คนที่ตอบเลยเอียงไปทางพอใจ","แบบสอบถามยาวไป","ควรให้เลือก 5 ระดับ"],"a":1,"why":"คนที่ตอบคือคนที่เลือกจะตอบเอง คนที่โกรธเขาเดินหนีเงียบ ๆ ไปแล้ว"},{"q":"\"บริษัทที่สำเร็จทุกที่ทำงานหนักกันหมด แปลว่าทำงานหนักแล้วจะสำเร็จ\" ผิดตรงไหน?","o":["ไม่ผิดนะ","ดูแต่บริษัทที่รอด ไม่ได้ดูบริษัทที่ทำงานหนักเหมือนกันแต่เจ๊งไปแล้ว","ทำงานหนักไม่ดี","ต้องดูตัวเลข"],"a":1,"why":"ถ้าบริษัทที่เจ๊งก็ทำงานหนักพอ ๆ กัน การทำงานหนักก็ไม่ใช่สิ่งที่ทำให้สำเร็จแล้วล่ะ"},{"q":"ผู้เชี่ยวชาญดัง ๆ บอกว่า X ดี ควรทำไง?","o":["เชื่อเลย","ถามว่าเขามีหลักฐานอะไร เรื่องนี้ตรงสายเขาไหม แล้วเขาได้อะไรจากการพูดแบบนี้","ไม่เชื่อเลย","ไปถามคนอื่นเพิ่ม"],"a":1,"why":"คนดังไม่ได้แปลว่าเป็นหลักฐาน ต้องดูที่หลักฐานที่เขาใช้"},{"q":"ข้อไหนคือสิ่งที่ \"แอบเชื่อไว้\" ในประโยค \"เราต้องขึ้นราคาเพราะต้นทุนขึ้น\"?","o":["ต้นทุนขึ้นจริง","ลูกค้าจะยอมจ่ายเพิ่ม และไม่หนีไปหาคู่แข่ง","ราคาเดิมถูกไป","คู่แข่งก็ขึ้นราคา"],"a":1,"why":"ประโยคนี้ข้ามคำถามว่า \"ลูกค้ารับได้ไหม\" แล้วกระโดดไปทางแก้เดียวเลย"}]},{"type":"quiz","pick":3,"intro":"หลักฐานแบบไหนที่ \"ล้ม\" สิ่งที่เชื่อได้","qs":[{"q":"เชื่อว่า: \"พนักงานลาออกเพราะเงินเดือนน้อย\" หลักฐานไหนล้มความเชื่อนี้ได้?","o":["บางคนที่ลาออกบ่นเรื่องเงิน","คู่แข่งจ่ายเยอะกว่า","คนที่เงินเดือนสูงกว่าเฉลี่ยก็ลาออกพอ ๆ กัน แล้วตอนสัมภาษณ์ก่อนออกก็พูดถึงหัวหน้ากันหมด","ผลสำรวจบอกว่าอยากได้เงินเพิ่ม"],"a":2,"why":"หลักฐานที่ดีคือหลักฐานที่ \"ค้าน\" สิ่งที่เราเชื่อได้"},{"q":"เชื่อว่า: \"แอปช้าเพราะเซิร์ฟเวอร์ไม่พอ\" จะเช็คยังไงให้ถูกที่สุด?","o":["เพิ่มเซิร์ฟเวอร์แล้วดู","ดูว่าช่วงที่คนใช้น้อย แอปยังช้าอยู่ไหม ถ้ายังช้าอยู่ก็ไม่ใช่เรื่องเซิร์ฟเวอร์แล้ว","ถามคนใช้","เปลี่ยนเจ้าที่ให้บริการ"],"a":1,"why":"หาสถานการณ์ที่ ถ้าเราเชื่อถูก ปัญหาต้องหายไป แล้วไปดูว่ามันหายจริงไหม"},{"q":"ทีมเชื่อว่า \"ลูกค้าอยากได้ฟีเจอร์ X\" หลักฐานแบบไหน \"อ่อน\" ที่สุด?","o":["ลูกค้า 30% กดลองฟีเจอร์ X ในเวอร์ชันทดสอบ","ลูกค้าตอบแบบสอบถามว่า \"สนใจ\"","ลูกค้ายอมจ่ายเงินล่วงหน้าเพื่อ X","ลูกค้าเลิกใช้ของคู่แข่งเพราะไม่มี X"],"a":1,"why":"สิ่งที่คนพูดกับสิ่งที่คนทำต่างกันเยอะ พูดว่า \"สนใจ\" มันไม่ต้องเสียอะไรเลย"},{"q":"\"พอเริ่มประชุมเช้าทุกวัน ยอดขายก็ขึ้น\" จะรู้ได้ไงว่าเป็นเพราะประชุมจริง?","o":["ถามทีมว่าคิดว่าใช่ไหม","เทียบกับทีมที่ไม่ได้ประชุมเช้าช่วงเดียวกัน หรือลองหยุดประชุมสักพักแล้วดู","ประชุมให้นานขึ้น","ดูตัวเลขย้อนหลัง"],"a":1,"why":"ต้องมีอะไรให้เทียบ ไม่งั้นแยกไม่ออกว่าเป็นเพราะประชุม หรือเพราะช่วงนั้นของขายดีเอง"}]},{"type":"chain","scens":[{"intro":"ลองเช็คประโยคนี้: \"รายงานในบริษัทบอกว่า ลูกค้าที่ใช้แชทบอทกลับมาซื้อซ้ำมากกว่าลูกค้าทั่วไป 2 เท่า ทีมเลยเสนอให้ลงเงินขยายแชทบอท 10 ล้านบาท\"","steps":[{"l":"1. หลักฐานคืออะไร แล้วเชื่อได้แค่ไหน","h":"ใครทำรายงาน เทียบกับใคร ช่วงไหน มีกี่คน"},{"l":"2. มีอะไรที่แอบเชื่อไว้ ระหว่าง \"ตัวเลข\" กับ \"สิ่งที่เสนอ\"","h":"เช่น เชื่อว่าแชทบอททำให้คนซื้อซ้ำ แต่อาจกลับกันก็ได้ คือคนที่ซื้อซ้ำอยู่แล้วเป็นคนที่ชอบใช้แชทบอท"},{"l":"3. ถ้าข้อสรุปนี้ผิด จะเห็นได้จากอะไร แล้วไปหาดูได้ที่ไหน","h":""},{"l":"4. ถ้าข้อเสนอผ่าน ใครได้ประโยชน์ แล้วทำให้รายงานน่าเชื่อน้อยลงไหม","h":""},{"l":"5. สรุปแล้วคุณว่ายังไง และถ้าเจออะไรถึงจะเปลี่ยนใจ","h":""}],"check":["ถามถึงที่มาและวิธีเก็บข้อมูล","ชี้ได้ว่า \"เกิดพร้อมกัน ไม่ได้แปลว่าเป็นเหตุ\" หรือคนที่ถูกเลือกมาเอียง","บอกได้ชัดว่าหลักฐานแบบไหนจะล้มข้อสรุปนี้ได้","คำตอบมีเงื่อนไข ไม่ได้ตอบสุดโต่งแค่ เชื่อ/ไม่เชื่อ"]}]}]},
{"id":"analogical","num":7,"group":"หาเหตุผล ดูหลักฐาน","en":"Analogical Thinking","th":"คิดแบบเปรียบเทียบ","c":"#D68910","def":"เอาเรื่องที่เราคุ้นเคยมาช่วยเข้าใจหรือแก้เรื่องที่ไม่คุ้น โดยเทียบที่ \"กลไก\" ไม่ใช่แค่หน้าตาที่ดูคล้าย","ex":"Google จัดอันดับเว็บด้วยวิธีคิดเดียวกับงานวิจัย: งานไหนโดนงานดัง ๆ อ้างถึงเยอะ งานนั้นก็สำคัญ","take":"ถ้าเจอเรื่องที่เทียบได้ตรง ๆ ก็เหมือนได้คำตอบมาครึ่งนึงแล้ว","ask":["ปัญหานี้มัน \"ทำงานเหมือน\" อะไรที่เรารู้จักดีอยู่แล้วบ้าง?","ในเรื่องที่เอามาเทียบ อะไรตรงกับอะไรในปัญหาเรา (จับคู่ทีละส่วน)?","เรื่องนั้นเขาแก้ปัญหานี้ยังไง แล้วเอามาใช้กับเราได้ยังไง?","เทียบแบบนี้แล้วพังตรงไหน มีจุดไหนต่างกันจนใช้ไม่ได้บ้าง?"],"levels":[{"type":"match","pick":5,"intro":"จับคู่ \"เรื่องต้นทาง\" กับ \"ปัญหาใหม่ที่ทำงานแบบเดียวกัน\"","l":"ต้นทาง","r":"ทำงานแบบเดียวกับ","pool":[["การอ้างอิงงานวิจัย","จัดอันดับว่าเว็บไหนสำคัญ"],["ภูมิคุ้มกันในร่างกาย","โปรแกรมแอนตี้ไวรัสที่ \"จำ\" ไวรัสเก่าได้"],["มดหาทางไปที่อาหาร","ระบบวางเส้นทางรถส่งของ"],["ค่าทางด่วนแพงขึ้นตอนชั่วโมงเร่งด่วน","ตั๋วเครื่องบินที่ราคาขึ้นลงตามคนจอง"],["บัตรยืมหนังสือห้องสมุด","ระบบยืม-คืนของในบริษัท"],["ระบบประปา (ท่อ แรงดัน จุดที่ตัน)","เงินไหลเข้าออกในธุรกิจ"],["วิวัฒนาการ (กลายพันธุ์ + ตัวที่เหมาะได้ไปต่อ)","ลองหลาย ๆ แบบ แล้วเก็บแบบที่ชนะไว้"]]},{"type":"quiz","pick":3,"intro":"การเปรียบเทียบทุกอัน มีจุดที่ใช้ไม่ได้ ต้องรู้ว่าตรงไหน","qs":[{"q":"\"บริษัทก็เหมือนครอบครัว\" เทียบแบบนี้พังตรงไหนที่อันตรายที่สุด?","o":["ครอบครัวไม่มีเงินเดือน","ครอบครัวไม่ไล่ใครออกเพราะผลงานไม่ดี แต่บริษัทต้องทำ คนเลยรู้สึกโดนหักหลัง","บริษัทใหญ่กว่า","ครอบครัวไม่มีหัวหน้า"],"a":1,"why":"การเปรียบเทียบสร้างความคาดหวัง ถ้าเรื่องต้นทางไม่มีสิ่งที่ปลายทางต้องมี คนจะผิดหวัง"},{"q":"\"ข้อมูลคือน้ำมันยุคใหม่\" ตรงไหนที่เทียบไม่ได้?","o":["ข้อมูลไม่มีค่า","น้ำมันใช้แล้วหมด แต่ข้อมูลใช้ซ้ำได้ แล้วยิ่งเอามารวมกันยิ่งมีค่า","น้ำมันแพงกว่า","ข้อมูลไม่ต้องกลั่น"],"a":1,"why":"เทียบแบบนี้ช่วยให้เห็นว่า \"มีค่า ต้องเอาไปกลั่นก่อน\" แต่พังเรื่อง \"ใช้แล้วหมด\" ซึ่งทำให้คิดเรื่องการแชร์ข้อมูลผิดไปหมด"},{"q":"ทีมบอกว่า \"เปิดตัวสินค้าก็เหมือนยิงจรวด ต้องเตรียมทุกอย่างให้พร้อมก่อนกดปุ่ม\" คิดแบบนี้อาจพลาดอะไร?","o":["ยิงเร็วไป","ไม่ยอมเอาไปลองกับลูกค้าจริงก่อน เพราะคิดว่าต้องเพอร์เฟกต์ก่อนปล่อย ทั้งที่ซอฟต์แวร์ปล่อยแล้วค่อยแก้ได้","ใช้เงินเยอะ","ทีมเครียด"],"a":1,"why":"จรวดยิงไปแล้วแก้ไม่ได้ แต่ซอฟต์แวร์แก้ได้ เลือกเทียบผิด วางแผนก็ผิดตาม"},{"q":"จะเช็คยังไงว่าการเทียบนี้ใช้ได้?","o":["ดูว่าฟังแล้วเข้าท่าไหม","จับคู่ทีละส่วนว่าอะไรตรงกับอะไร แล้วดูว่าส่วนสำคัญของปัญหาเรามีคู่ในเรื่องต้นทางไหม","ถามว่าคนอื่นใช้แบบนี้ไหม","ใช้หลาย ๆ อย่างมาเทียบ"],"a":1,"why":"เทียบดี ๆ ต้องตรงกันที่ \"ความเชื่อมโยงข้างใน\" ไม่ใช่แค่หน้าตาข้างนอก"}]},{"type":"chain","scens":[{"intro":"โจทย์: ทีมใหม่ต้องทำ \"ระบบเก็บความรู้ในบริษัท\" ที่คนจะยอมใช้จริง แต่ไม่รู้จะเริ่มตรงไหน ลองหาเรื่องมาเทียบแบบเป็นขั้นเป็นตอน","steps":[{"l":"1. เลือกเรื่องต้นทางที่เก่งเรื่อง \"คนเอาความรู้มาแบ่งกัน แล้วมีคนใช้จริง\"","h":"เช่น Wikipedia, ตลาดสด, ห้องสมุด, Stack Overflow, สูตรอาหารของบ้าน"},{"l":"2. จับคู่: อะไรในเรื่องต้นทาง ตรงกับอะไรในบริษัท (อย่างน้อย 4 คู่)","h":"เช่น คนตรวจแก้ = ?, การให้คะแนน = ?, การค้นหา = ?"},{"l":"3. เรื่องต้นทางแก้ปัญหา \"คนไม่ยอมเขียน\" กับ \"หาไม่เจอ\" ยังไง แล้วเอามาใช้กับระบบเรายังไง","h":""},{"l":"4. เทียบแล้วพังตรงไหน แล้วจะอุดตรงนั้นยังไง","h":""}],"check":["คู่ที่จับตรงกันที่กลไก ไม่ใช่แค่ชื่อคล้ายกัน","ได้วิธีที่ใช้ได้จริงอย่างน้อย 2 อย่างจากเรื่องต้นทาง","บอกได้ว่าตรงไหนเทียบไม่ได้ แล้วมีวิธีอุด"]}]}]},
{"id":"abductive","num":8,"group":"หาเหตุผล ดูหลักฐาน","en":"Abductive Thinking","th":"เดาให้แม่นแบบนักสืบ","c":"#5D6D7E","def":"ข้อมูลไม่ครบก็เดาได้ แต่ต้องเดาให้มีเหตุผลที่สุด โดยเอาเบาะแส สถานการณ์ และสิ่งที่เคยเห็นมาต่อกัน","ex":"นักสืบเห็นรอยไหม้แดด ท่าเดิน เสื้อผ้า และแผลบนตัว แต่ละอย่างพิสูจน์อะไรไม่ได้เลย แต่พอเอามารวมกันกลับชี้ไปที่คำตอบที่น่าจะใช่ที่สุด","take":"จะตัดสินใจดี ๆ ไม่ต้องรอข้อมูลครบ แค่ใช้เหตุผลให้ดีกับข้อมูลที่มีอยู่","ask":["มีเบาะแสอะไรบ้าง (จดให้ครบ รวมถึงสิ่งที่ \"ไม่เกิดขึ้น\" ด้วย)?","เป็นไปได้กี่ทาง ลองคิดมาอย่างน้อย 3 ทาง?","ทางไหน \"ง่ายที่สุด\" แต่อธิบายเบาะแสได้ครบ?","ถ้าได้ข้อมูลอะไรมาเพิ่ม จะรู้เลยว่าเดาถูกหรือผิด?"],"levels":[{"type":"quiz","pick":3,"intro":"เลือกคำตอบที่ \"น่าจะใช่ที่สุด\" ไม่ต้องรอให้แน่ใจ 100%","qs":[{"q":"ร้านชานมสาขานึง ยอดตกเฉพาะวันเสาร์ตั้งแต่เดือนที่แล้ว • หน้าร้านมีป้ายซ่อมถนนช่วงวันหยุด • รีวิวยังดีอยู่ • สาขาอื่นปกติ","o":["พนักงานวันเสาร์บริการไม่ดี","มีคู่แข่งเปิดใหม่","ซ่อมถนนช่วงวันหยุด เลยเข้าร้านหรือหาที่จอดยาก","ของไม่อร่อยเหมือนเดิม"],"a":2,"why":"เบาะแส \"แค่วันเสาร์ + แค่สาขานี้ + รีวิวยังดี + ซ่อมถนนวันหยุด\" ชี้ไปทางเดียวกันหมด"},{"q":"พนักงานที่ปกติมาตรงเวลา เริ่มมาสาย 3 วันติด • แต่งตัวเนี้ยบกว่าปกติ • พักเที่ยงนาน • งานยังดีอยู่","o":["ป่วยเรื้อรัง","กำลังไปสัมภาษณ์งานที่อื่น","ขี้เกียจขึ้น","รถติด"],"a":1,"why":"ยังพิสูจน์ไม่ได้หรอก แต่คำตอบนี้ตรงกับเบาะแสเยอะที่สุด ต่อไปก็ไปหาข้อมูลมายืนยัน"},{"q":"เว็บมีคนสมัครสมาชิกลดลง 40% อาทิตย์นี้ • คนเข้าเว็บเท่าเดิม • ทีมเทคนิคเพิ่งแก้หน้าสมัคร • ไม่มีคู่แข่งใหม่","o":["คนเบื่อของเรา","หน้าสมัครใหม่มีอะไรบางอย่างที่ทำให้สมัครไม่ผ่าน","เศรษฐกิจไม่ดี","โฆษณาไม่ดี"],"a":1,"why":"คนเข้าเว็บเท่าเดิม แปลว่าไม่ใช่เรื่องโฆษณาหรือคนเลิกสนใจ สิ่งเดียวที่เปลี่ยนคือหน้าสมัคร"},{"q":"ถ้ามีคำตอบหลายทาง ควรเลือกยังไง?","o":["เลือกอันที่ซับซ้อนที่สุด","เลือกอันที่ต้องเดาเพิ่มน้อยที่สุด แต่อธิบายเบาะแสได้ครบ","เลือกอันที่คนส่วนใหญ่เชื่อ","เลือกอันที่ร้ายแรงที่สุดไว้ก่อน เพื่อความปลอดภัย"],"a":1,"why":"หลักง่าย ๆ คือ คำตอบที่ง่ายที่สุดแต่ตรงกับหลักฐานทั้งหมด มักจะใช่"}]},{"type":"quiz","pick":3,"intro":"ด่านนี้มีเบาะแสหลอก ต้องแยกให้ออก","qs":[{"q":"บริษัทกำไรลด • ยอดขายเพิ่ม • ค่าวัตถุดิบเท่าเดิม • เพิ่งเปิดสาขาใหม่ 3 ที่เมื่อ 2 เดือนก่อน • CEO เพิ่งลาป่วย","o":["CEO ลาป่วย เลยบริหารไม่ดี","สาขาใหม่ยังไม่คืนทุน ค่าใช้จ่ายประจำเพิ่มเร็วกว่ายอดขาย","ขายของขาดทุน","วัตถุดิบแพง"],"a":1,"why":"CEO ลาป่วยเป็นเบาะแสหลอก มันอธิบายไม่ได้ว่าทำไมกำไรลดใน 2 เดือน แต่สาขาใหม่อธิบายได้ทั้ง \"ยอดขายเพิ่ม\" และ \"กำไรลด\" ในทีเดียว"},{"q":"แอปโดนรีวิว 1 ดาวพุ่งใน 3 วัน • ไม่ได้อัปเดตอะไรเลย • รีวิวส่วนใหญ่มาจากประเทศเดียว • ข้อความรีวิวคล้าย ๆ กัน • คู่แข่งเพิ่งเปิดแคมเปญ","o":["แอปมีบั๊ก","คนใช้เบื่อ","มีคนจัดตั้งมาปั่นรีวิวปลอม","คนประเทศนั้นไม่ชอบแอป"],"a":2,"why":"\"ไม่ได้อัปเดต\" ตัดเรื่องบั๊กไป \"ข้อความคล้ายกัน + ประเทศเดียว + ใน 3 วัน\" ชี้ว่ามีคนจัดตั้ง ส่วนเรื่องคู่แข่งยังเป็นแค่ข้อสงสัย ต้องหาหลักฐานต่อ"},{"q":"ทีมนึงลาป่วยพร้อมกัน 4 คนวันจันทร์ • ทั้ง 4 คนไปงานเลี้ยงบริษัทวันศุกร์ • ทีมอื่นที่ไปงานเลี้ยงปกติดี • ทั้ง 4 นั่งโซนเดียวกัน • ทีมนี้เพิ่งทะเลาะกับหัวหน้าเมื่ออาทิตย์ก่อน","o":["อาหารเป็นพิษจากงานเลี้ยง","ประท้วงหัวหน้าด้วยการลาพร้อมกัน","แอร์ในโซนนั้นมีปัญหา","บังเอิญ"],"a":1,"why":"ถ้าเป็นเพราะอาหาร ทีมอื่นที่ไปงานเดียวกันก็ต้องป่วยด้วย \"ลาพร้อมกัน + ทะเลาะกับหัวหน้า\" อธิบายได้ครบกว่า ถึงจะยังไม่ชัวร์ ก็ควรไปคุยกับทีมนี้ก่อนไปตรวจแอร์"},{"q":"ข้อไหนคือการเดาแบบพลาด?","o":["ปักใจกับคำตอบแรก แล้วเลือกดูแต่เบาะแสที่เข้าทาง","คิดคำตอบไว้หลาย ๆ ทาง","หาข้อมูลเพิ่มก่อนสรุป","ยอมรับว่ายังไม่ชัวร์"],"a":0,"why":"การเลือกดูแต่สิ่งที่เข้าข้างความเชื่อตัวเอง คือศัตรูตัวฉกาจของการเดา ต้องคิดทางอื่นมาแข่งไว้เสมอ"}]},{"type":"chain","scens":[{"intro":"เบาะแส: ร้านอาหารของคุณยอดวันธรรมดาตกไป 25% ใน 6 อาทิตย์ • วันหยุดยอดปกติ • รีวิวออนไลน์ยังดี • มีร้านใหม่เปิดในซอยเมื่อ 2 เดือนก่อน • พนักงานเสิร์ฟคนเก่งลาออกไปเมื่อ 7 อาทิตย์ก่อน • บริษัทใหญ่ตึกข้าง ๆ เพิ่งให้คนทำงานจากบ้าน 3 วันต่ออาทิตย์","steps":[{"l":"1. เป็นไปได้กี่ทาง ลองคิดมาอย่างน้อย 3 ทาง","h":"ทางละ 1–2 บรรทัดพอ"},{"l":"2. แต่ละทาง อธิบายเบาะแสข้อไหนได้ ข้อไหนไม่ได้","h":"โดยเฉพาะ \"วันหยุดยอดปกติ\" อันนี้สำคัญมาก"},{"l":"3. ทางไหนน่าจะใช่ที่สุด เพราะอะไร","h":""},{"l":"4. จะไปหาข้อมูลอะไร 1–2 อย่างมายืนยันหรือล้มคำตอบ แล้วถ้าผลออกมาแต่ละแบบจะทำยังไง","h":""}],"check":["มีทางที่เป็นไปได้มาแข่งกันอย่างน้อย 3 ทาง","ใช้เบาะแส \"วันหยุดยอดปกติ\" มาช่วยตัดทางที่ไม่ใช่","ทางที่เลือกตรงกับเบาะแสมากที่สุด ไม่ใช่แค่ฟังดูน่ากลัวที่สุด","มีแผนชัด ๆ ว่าจะไปหาข้อมูลอะไรมายืนยัน"]}]}]},
{"id":"first","num":9,"group":"รื้อของเดิม มองให้ไกล","en":"First-Principles Thinking","th":"คิดจากรากฐาน","c":"#117A8B","def":"รื้อปัญหาลงไปจนเหลือแต่ความจริงที่ปฏิเสธไม่ได้ แล้วค่อยสร้างใหม่ ถามว่า \"อะไรที่ต้องจริงแน่ ๆ\" แทนที่จะถามว่า \"ปกติเขาทำกันยังไง\"","ex":"IKEA ไม่เชื่อว่าเฟอร์นิเจอร์ต้องส่งแบบประกอบเสร็จแล้ว เลยแยกเป็นชิ้นให้ลูกค้าประกอบเอง ใส่กล่องแบน ๆ ประหยัดค่าส่งกับที่เก็บไปเยอะ","take":"ข้อจำกัดหลายอย่างไม่ใช่กฎธรรมชาติหรอก เป็นแค่ความเชื่อที่ทำต่อ ๆ กันมา","ask":["เรื่องนี้ มีอะไรบ้างที่ \"ใคร ๆ ก็รู้\" ว่าต้องทำ?","ในนั้น อันไหนห้ามไม่ได้จริง ๆ (กฎธรรมชาติ กฎหมาย) อันไหนแค่ทำตามกันมา?","ความจริงที่ตัดทิ้งไม่ได้เลย มีกี่ข้อ?","ถ้าเริ่มจากศูนย์ โดยมีแค่ความจริงพวกนั้น จะออกแบบใหม่ยังไง?"],"levels":[{"type":"quiz","pick":3,"intro":"แยก \"สิ่งที่ห้ามไม่ได้จริง\" ออกจาก \"สิ่งที่ทำตามกันมา\"","qs":[{"q":"อันไหนห้ามไม่ได้จริง ๆ ไม่ใช่แค่ทำตามกันมา?","o":["ร้านอาหารต้องมีโต๊ะให้ลูกค้านั่ง","ธนาคารต้องมีสาขา","อาหารต้องปลอดภัย กินได้ตามกฎหมาย","พนักงานต้องทำงาน 9 โมงถึง 6 โมงเย็น"],"a":2,"why":"อีกสามข้อโดนธุรกิจจริงรื้อไปแล้ว (ร้านที่ขายเดลิเวอรี่อย่างเดียว ธนาคารออนไลน์ งานที่เข้าออกเวลาไหนก็ได้)"},{"q":"คำถามแบบคิดจากรากฐานคือข้อไหน?","o":["คู่แข่งเขาทำยังไง?","ปีที่แล้วเราทำยังไง?","ถ้าไม่มีวิธีเดิม ๆ เลย ต้องมีอะไรจริงบ้างถึงจะทำให้ลูกค้าได้สิ่งที่อยากได้?","ผู้เชี่ยวชาญแนะนำว่ายังไง?"],"a":2,"why":"สามข้อแรกเริ่มจาก \"สิ่งที่มีอยู่แล้ว\" แต่ข้อนี้เริ่มจาก \"สิ่งที่ต้องจริง\""},{"q":"แบตเตอรี่ \"แพงเกินไป\" คนทั่วไปเลยสรุปว่ารถไฟฟ้าไม่คุ้ม ถ้าคิดจากรากฐานจะถามว่าอะไร?","o":["ใครขายแบตถูกที่สุด","แบตทำจากอะไรบ้าง ของพวกนั้นในตลาดราคาเท่าไหร่ แล้วส่วนต่างระหว่างราคาวัตถุดิบกับราคาแบตมาจากไหน","รอให้ราคาลง","ใช้แบตให้น้อยลง"],"a":1,"why":"ถ้าวัตถุดิบรวมกันถูกกว่าราคาแบตเยอะ ส่วนต่างนั้นคือ \"วิธีผลิตแบบเดิม ๆ\" ที่รื้อได้"},{"q":"แบบไหนที่บอกว่าคุณกำลัง \"ทำตามกันมา\" แทนที่จะ \"คิดจากรากฐาน\"?","o":["อธิบายได้ว่าทำไมต้องทำแบบนี้","ตอบว่า \"ก็ทำกันมาแบบนี้\" หรือ \"ใคร ๆ ในวงการก็ทำ\"","มีข้อมูลรองรับ","เคยลองทางอื่นมาแล้ว"],"a":1,"why":"ได้ยินคำว่า \"ก็ทำกันมาแบบนี้\" เมื่อไหร่ ให้หยุดแล้วถามว่า \"ทำไม?\""}]},{"type":"chain","scens":[{"intro":"โจทย์: \"ร้านอาหารต้องมีหน้าร้านและโต๊ะให้ลูกค้านั่ง\" ลองรื้อความเชื่อนี้ดู","steps":[{"l":"1. อะไรที่คนส่วนใหญ่เชื่อว่า \"ต้องมี\" อย่างน้อย 3 อย่าง","h":"หน้าร้าน พนักงานเสิร์ฟ ครัวในร้าน เมนู..."},{"l":"2. อะไรที่ \"ต้องจริงแน่ ๆ\" ถ้าจะขายอาหาร","h":"ความจริงที่ตัดทิ้งไม่ได้"},{"l":"3. วิธีใหม่ที่สร้างจากความจริงพวกนั้น","h":""}],"check":["บอกได้อย่างน้อย 3 อย่างที่เชื่อตามกันมา","แยกได้ชัดว่าอันไหนห้ามไม่ได้จริง","วิธีใหม่ไม่ได้เริ่มจาก \"ปกติเขาทำกันยังไง\"","วิธีใหม่ยังตอบโจทย์ความจริงพื้นฐานครบ"]},{"intro":"โจทย์: \"ประชุมต้องมีคนมานั่งรวมกันพร้อมกัน\" ลองรื้อความเชื่อนี้ดู","steps":[{"l":"1. ความเชื่อที่แอบซ่อนอยู่ในการประชุมแบบเดิม อย่างน้อย 3 อย่าง","h":"ต้องมาพร้อมกัน ต้องมีคนนำ ต้องมีห้อง ต้องใช้เวลา 1 ชั่วโมง..."},{"l":"2. จริง ๆ แล้วประชุมไปเพื่ออะไร (ความจริงพื้นฐาน)","h":"เพื่อตัดสินใจ? แชร์ข้อมูล? ให้คนสนิทกัน?"},{"l":"3. ออกแบบวิธีที่ได้ผลแบบเดียวกัน โดยไม่ยึดความเชื่อในข้อ 1","h":""}],"check":["บอกได้อย่างน้อย 3 ความเชื่อ","แยกได้ว่าเป้าหมายจริงคืออะไร รูปแบบคืออะไร","วิธีใหม่ต่างจากประชุมแบบเดิมแบบเห็นได้ชัด","ยังได้ผลตามเป้าหมายจริงครบ"]}]},{"type":"chain","scens":[{"intro":"โจทย์ยาก: บริษัทขนส่งพัสดุเสียเงินกับ \"ช่วงสุดท้าย\" (ส่งถึงบ้าน) ถึง 50% ของต้นทุนทั้งหมด ใคร ๆ ในวงการก็บอกว่า \"มันก็เป็นแบบนี้แหละ\"","steps":[{"l":"1. แตกต้นทุนช่วงสุดท้ายออกเป็นชิ้นเล็ก ๆ","h":"คน รถ น้ำมัน เวลาที่ใช้ต่อจุด กี่ครั้งที่ส่งไม่สำเร็จ ระยะห่างระหว่างจุด..."},{"l":"2. ชิ้นไหนห้ามไม่ได้จริง (กฎธรรมชาติ/กฎหมาย) ชิ้นไหนแค่ทำตามกันมา","h":"เช่น \"ต้องส่งถึงหน้าประตู\" นี่บังคับจริงหรือแค่ทำกันมา?"},{"l":"3. คิดวิธีใหม่จากความจริงพื้นฐาน อย่างน้อย 2 แบบ","h":""},{"l":"4. ประเมินคร่าว ๆ ว่าแต่ละแบบลดต้นทุนส่วนไหนได้ แล้วไปเพิ่มต้นทุนหรือความเสี่ยงตรงไหน","h":""}],"check":["แตกต้นทุนได้อย่างน้อย 4 ชิ้น","แยกได้มีเหตุผลว่าอันไหนห้ามไม่ได้ อันไหนทำตามกันมา","วิธีใหม่ไปแก้ชิ้นที่ใหญ่ที่สุด ไม่ใช่ชิ้นเล็ก ๆ","บอกข้อเสียของวิธีใหม่อย่างตรงไปตรงมา"]}]}]},
{"id":"inverted","num":10,"group":"รื้อของเดิม มองให้ไกล","en":"Inverted Thinking","th":"คิดกลับหัว","c":"#7B241C","def":"แทนที่จะถามว่าทำยังไงให้สำเร็จ ลองถามว่า \"ทำยังไงให้พังแน่ ๆ\" แล้วไล่กำจัดสิ่งพวกนั้นทิ้ง","ex":"วิศวกรสะพานถามว่าอะไรบ้างที่ทำให้สะพานพังได้ แล้วออกแบบกันไว้ทีละจุด","take":"เลิกทำสิ่งที่ทำให้พัง บางทีได้ผลกว่าไปหาวิธีเก่งขึ้นเพิ่มเรื่อย ๆ อีก","ask":["ถ้าอยากให้เรื่องนี้พังแน่ ๆ ต้องทำอะไรบ้าง (อย่างน้อย 5 อย่าง)?","ในนั้น มีอันไหนที่เราทำอยู่แล้วแบบไม่รู้ตัวบ้าง?","เลิกอันไหนก่อน แล้วจะเห็นผลเยอะที่สุด?","ก่อนจะพังแต่ละแบบ จะมีอะไรเตือนให้เห็นก่อนบ้าง?"],"levels":[{"type":"quiz","pick":3,"intro":"รู้ว่าเมื่อไหร่ที่คิดกลับหัวแล้วเวิร์ก","qs":[{"q":"ทำไม \"คิดวิธีทำให้พัง\" มักได้ไอเดียเยอะกว่า \"คิดวิธีทำให้สำเร็จ\"?","o":["เพราะคนชอบมองโลกในแง่ร้าย","เพราะวิธีทำให้พังมีน้อยกว่า","เพราะเราจำเรื่องพัง ๆ ที่เคยเห็นได้ชัดกว่า แล้วการติก็ง่ายกว่าการสร้าง","ไม่จริงหรอก ได้เท่ากัน"],"a":2,"why":"เราเห็นโปรเจกต์พังมาเยอะกว่าเห็นสูตรสำเร็จ คิดกลับหัวเลยดึงประสบการณ์พวกนั้นออกมาใช้ได้"},{"q":"\"ซ้อมงานศพล่วงหน้า\" (Pre-mortem) คืออะไร?","o":["ประชุมกันหลังโปรเจกต์พัง","ก่อนเริ่มงาน ให้สมมติว่าโปรเจกต์พังไปแล้ว แล้วให้ทุกคนเขียนว่าพังเพราะอะไร","การตรวจรอบสุดท้าย","แผนสำรอง"],"a":1,"why":"พอสมมติว่า \"พังไปแล้ว\" คนก็กล้าพูดเรื่องที่กังวลอยู่แต่ปกติไม่กล้าพูด"},{"q":"ข้อไหนคือการคิดกลับหัวกับเรื่อง \"อยากสนิทกับลูกทีม\"?","o":["อ่านหนังสือเรื่องการเป็นผู้นำ","ลิสต์ว่าทำอะไรแล้วลูกทีมเกลียดหัวหน้าแน่ ๆ แล้วเลิกทำสิ่งพวกนั้น","พาไปกินเลี้ยงบ่อยขึ้น","ให้โบนัส"],"a":1,"why":"\"เลิกทำสิ่งที่ทำร้าย\" มักเห็นผลไวกว่า \"เพิ่มสิ่งดี ๆ\""}]},{"type":"brainstorm","seconds":60,"targets":[4,7,10],"flip":true,"prompts":["บริษัทจะเปิดตัวสินค้าใหม่ ทำยังไงให้งานเปิดตัว \"พังแน่ ๆ\"?","คุณเพิ่งได้เป็นหัวหน้าทีมใหม่ ทำยังไงให้ลูกทีม \"เกลียดคุณภายในเดือนเดียว\"?","ทำยังไงให้การเรียนภาษาใหม่ \"ล้มเหลวแน่ ๆ ใน 3 เดือน\"?"]},{"type":"chain","scens":[{"intro":"ซ้อมงานศพล่วงหน้า: อีก 12 เดือน โปรเจกต์ \"ย้ายระบบหลักของบริษัทขึ้นคลาวด์\" พังไปแล้ว ลองเขียนว่ามันพังเพราะอะไร","steps":[{"l":"1. เล่าว่ามันพังยังไง เขียนเหมือนมันเกิดขึ้นไปแล้วจริง ๆ","h":"เล่าเป็นเรื่อง ทีละเหตุการณ์ ไม่ใช่ลิสต์"},{"l":"2. ต้นเหตุจริง 3–5 ข้อ แยกเป็น \"คุมได้\" กับ \"คุมไม่ได้\"","h":""},{"l":"3. ก่อนพังจริง แต่ละต้นเหตุจะมีอะไรเตือนให้เห็นก่อน","h":"เช่น ถ้าเดือนที่ 3 เห็น X แปลว่ากำลังจะพังแล้ว"},{"l":"4. วิธีกันไว้ 3 อย่าง เรียงจากช่วยได้มากไปน้อย แล้วใครเป็นคนรับผิดชอบ","h":""}],"check":["เรื่องที่เล่าเป็นลำดับ ฟังแล้วเกิดขึ้นได้จริง","แยกต้นเหตุที่คุมได้/คุมไม่ได้","สัญญาณเตือนวัดผลได้จริง","วิธีกันมีคนรับผิดชอบ และเรียงว่าอะไรสำคัญก่อน"]}]}]},
{"id":"second","num":11,"group":"รื้อของเดิม มองให้ไกล","en":"Second-Order Thinking","th":"คิดต่อว่า \"แล้วไงต่อ\"","c":"#6C3483","def":"อย่าหยุดแค่ผลที่เห็นทันที ถามต่อว่า \"พอเกิดอันนั้นแล้ว จะเกิดอะไรตามมาอีก\"","ex":"ช่วยจ่ายค่ารถเมล์ให้ → คนนั่งเยอะขึ้น → เมืองลดคุณภาพบริการเพื่อคุมงบ → รถแน่น → คนกลับไปขับรถเองเหมือนเดิม","take":"คิดชั้นแรกเจอผลที่เห็นชัด ๆ คิดชั้นที่สองถึงจะเจอผลที่ตามมาจากผลนั้นอีกที","ask":["ผลที่เห็นทันทีคืออะไร แล้วคนจะ \"ปรับตัว\" ยังไงกับผลนั้น?","มีอะไรใหม่ที่ทำให้คนอยากทำบางอย่างไหม ใครได้ ใครเสีย?","คู่แข่ง ลูกค้า หรือหน่วยงานรัฐ จะตอบโต้ยังไง?","อีก 1 ปี กับ 3 ปี เรื่องนี้จะหน้าตาเป็นยังไง?"],"levels":[{"type":"quiz","pick":3,"intro":"ผลที่ตามมาทีหลังที่คนชอบมองข้าม","qs":[{"q":"ร้านออนไลน์จัด \"ส่งฟรีทุกออเดอร์\" แล้วจะเกิดอะไรตามมา?","o":["ยอดขายเพิ่ม","ลูกค้าสั่งของชิ้นเล็ก ๆ ทีละหลายรอบแทนสั่งรวมทีเดียว ค่าส่งต่อชิ้นพุ่ง แล้วคู่แข่งก็ต้องทำตาม จนทั้งตลาดกำไรบางเฉียบ","ลูกค้าพอใจ","ต้องจ้างคนแพ็คของเพิ่ม"],"a":1,"why":"ผลชั้นแรกคือยอดขึ้น ชั้นที่สองคือ \"คนเปลี่ยนพฤติกรรม\" กับ \"คู่แข่งตอบโต้\""},{"q":"ห้ามพนักงานทำโอทีเพื่อประหยัดเงิน แล้วจะเกิดอะไรตามมา?","o":["ประหยัดเงิน","งานที่ต้องเสร็จก็ยังต้องเสร็จ พนักงานเลยแอบทำแบบไม่ลงเวลา หรือไม่งั้นงานค้างจนเสียลูกค้า","พนักงานแฮปปี้","ไม่มีอะไรเกิดขึ้น"],"a":1,"why":"กฎเปลี่ยนแค่ \"วิธี\" ทำงาน แต่งานไม่ได้น้อยลงเลย"},{"q":"ให้รางวัลทีมที่ \"ปิดเรื่องร้องเรียนลูกค้าได้ไวที่สุด\" แล้วจะเกิดอะไรตามมา?","o":["ลูกค้าได้รับความช่วยเหลือไว","ทีมกดปิดเรื่องก่อนแก้เสร็จจริง หรือแยกปัญหาเดียวเป็นหลายเรื่อง ตัวเลขดูดี แต่ลูกค้าแย่ลง","ทีมขยันขึ้น","ต้นทุนลดลง"],"a":1,"why":"พอเอาตัวเลขไหนมาเป็นเป้า คนก็จะหาทางทำให้ตัวเลขสวย จนตัวเลขนั้นไม่ได้บอกความจริงอีกต่อไป"},{"q":"วิธีคิด \"แล้วไงต่อ\" ที่ใช้ได้จริงคือข้อไหน?","o":["เดาอนาคต","ถาม \"แล้วไงต่อ?\" อย่างน้อย 3 รอบ แล้วดูผลกับคนแต่ละกลุ่มแยกกัน","รอดูผล","ถามผู้เชี่ยวชาญ"],"a":1,"why":"ถามต่อกันเป็นทอด ๆ แล้วแยกดูทีละกลุ่ม เพราะแต่ละกลุ่มปรับตัวไม่เหมือนกัน"}]},{"type":"sequence","intro":"เรียงผลที่ตามกันมาให้ถูกลำดับ","chains":[{"t":"รัฐช่วยจ่ายค่ารถเมล์รถไฟ","items":["คนนั่งประหยัดเงิน แฮปปี้","คนหันมานั่งรถเมล์รถไฟกันเยอะขึ้น","คนแน่นจนเมืองต้องคุมงบด้วยการลดคุณภาพบริการ","แออัด รอนาน คนเริ่มไม่พอใจ","บางคนกลับไปขับรถเอง"]},{"t":"โซเชียลเพิ่มปุ่ม \"ไม่ชอบ\"","items":["คนกดไม่ชอบโพสต์ที่ไม่ถูกใจได้ง่าย","คนทำคอนเทนต์ไม่กล้าทำอะไรเสี่ยง ทำแต่ของเซฟ ๆ","คอนเทนต์ในแอปเริ่มเหมือนกันไปหมด น่าเบื่อ","คนเล่นแอปน้อยลง","แอปได้เงินโฆษณาน้อยลง ต้องเอาปุ่มออก"]}]},{"type":"chain","scens":[{"intro":"เหตุการณ์: \"บริษัทประกาศให้ทุกคนทำงานจากบ้านได้ 100% ตลอดไป\"","steps":[{"l":"ชั้นที่ 1: เกิดอะไรขึ้นทันที","h":"อาทิตย์แรก"},{"l":"ชั้นที่ 2: คนจะเปลี่ยนพฤติกรรมยังไง","h":"พนักงาน หัวหน้า ฝ่ายบุคคล เจ้าของตึก"},{"l":"ชั้นที่ 3: มีอะไรใหม่ที่ทำให้คนอยากทำบางอย่าง ใครได้ ใครเสีย","h":""},{"l":"ชั้นที่ 4: อีก 2–3 ปีจะเป็นยังไง","h":"บรรยากาศในบริษัท การรั้งคนไว้ ต้นทุน ความเสี่ยงใหม่ ๆ"}],"check":["แต่ละชั้นต่อกันด้วย \"เพราะ...ก็เลย...\"","มีผลแย่ ๆ ที่คนชอบมองข้ามอย่างน้อย 1 อย่าง","คิดถึงคนที่ไม่ใช่พนักงานด้วย","มองไกลไปถึงหลักปี"]},{"intro":"เหตุการณ์: \"เมืองประกาศห้ามใช้ถุงพลาสติกทุกแบบตั้งแต่เดือนหน้า\"","steps":[{"l":"ชั้นที่ 1: เกิดอะไรขึ้นทันที","h":""},{"l":"ชั้นที่ 2: คนซื้อ ร้านค้า แล้วก็โรงงาน จะปรับตัวยังไง","h":""},{"l":"ชั้นที่ 3: มีอะไรใหม่ที่ผลักให้คนทำบางอย่าง แล้วผลที่ไม่ได้ตั้งใจ","h":"เช่น ถุงผ้าที่ผลิตมาแล้วใช้ไม่กี่ครั้ง ถุงกระดาษที่เปลืองทรัพยากรกว่า"},{"l":"ชั้นที่ 4: ผลระยะยาว แล้วจะทำยังไงให้กฎนี้ได้ผลจริง","h":""}],"check":["แต่ละชั้นต่อกันแบบมีเหตุผล","มีผลที่ไม่ได้ตั้งใจอย่างน้อย 1 อย่าง","แยกดูผลกับคนแต่ละกลุ่ม","ปิดท้ายด้วยข้อเสนอที่คิดเผื่อผลชั้นถัดไปแล้ว"]}]}]},
{"id":"janusian","num":12,"group":"เรื่องขัดกัน กับเรื่องในหัวตัวเอง","en":"Janusian Thinking","th":"ถือสองขั้วไว้พร้อมกัน","c":"#1F618D","def":"เก็บไอเดียสองอันที่ขัดกันไว้ในหัวพร้อมกัน แล้วถามว่า \"ถ้าทั้งสองฝั่งมีอะไรดีอยู่จริงล่ะ\"","ex":"ทีมนึงช่วยกันปั้นไอเดียให้แน่นที่สุด อีกทีมรุมจับผิดหาจุดอ่อน แล้วทีมแรกก็เอาคำติไปปรับให้ดีขึ้น","take":"คนคิดเก่ง ๆ ไม่ได้รีบตัดความขัดแย้งทิ้งเสมอไป บางทีเขาใช้แรงดึงระหว่างสองฝั่งสร้างของที่ดีกว่าเดิม","ask":["แต่ละฝั่งกำลังปกป้องอะไรที่สำคัญอยู่ (เขียนให้แฟร์ที่สุด)?","ทั้งสองฝั่งจะถูกพร้อมกันได้ในสถานการณ์ไหน?","ถ้าไม่ต้องเลือกข้าง จะเอาข้อดีของทั้งสองมารวมกันยังไง?","เรื่องที่ขัดกันนี้ กำลังบอกอะไรเกี่ยวกับปัญหาจริงที่ซ่อนอยู่?"],"levels":[{"type":"quiz","pick":3,"intro":"แยกให้ออกระหว่าง \"ได้ทั้งสองอย่าง\" กับ \"เอากลาง ๆ\"","qs":[{"q":"ทีมเถียงกันว่าควร \"เร็ว\" หรือ \"รอบคอบ\" ข้อไหนคือได้ทั้งสองอย่างจริง ไม่ใช่ถอยกันคนละก้าว?","o":["เร็วกลาง ๆ รอบคอบกลาง ๆ","แบ่งงานเป็นส่วนที่พลาดแล้วถอยกลับได้ (ทำไว ๆ) กับส่วนที่พลาดแล้วถอยไม่ได้ (ทำแบบรอบคอบ)","โหวต","ให้หัวหน้าตัดสิน"],"a":1,"why":"เอากลาง ๆ ได้อย่างละครึ่ง แต่การรวมสองขั้วได้เต็ม ๆ ทั้งสองอย่างในจังหวะที่ใช่"},{"q":"\"ลูกค้าอยากมีตัวเลือกเยอะ\" กับ \"ลูกค้างงถ้าตัวเลือกเยอะ\" จะทำยังไงดี?","o":["ตัดให้เหลือแค่ 3 ตัวเลือก","มีตัวเลือกเยอะเหมือนเดิม แต่ \"แนะนำ\" 3 ตัวเด่น ๆ ไว้ แล้วซ่อนที่เหลือไว้ให้คนที่อยากดู","ให้ลูกค้าเลือกเอง","ทำแบบสอบถาม"],"a":1,"why":"ทั้งสองเรื่องจริงพร้อมกัน ทางออกคือออกแบบให้แต่ละเรื่องไปเจอคนที่ต้องการมัน"},{"q":"แบบไหนที่บอกว่าคุณกำลัง \"เลือกข้าง\" เร็วเกินไป?","o":["อธิบายข้อดีของอีกฝั่งได้ดีจนเขาพอใจ","นึกไม่ออกเลยว่าคนฉลาด ๆ จะไปอยู่อีกฝั่งได้ยังไง","ใช้เวลาตัดสินใจนาน","ถามหลายคน"],"a":1,"why":"ถ้าคิดว่าอีกฝั่งโง่ แปลว่าเรายังไม่เข้าใจว่าเขากำลังปกป้องอะไรอยู่"}]},{"type":"chain","scens":[{"intro":"ไอเดีย A: \"ต้องตอบแชทลูกค้าภายใน 1 นาที\" กับ ไอเดีย B: \"ต้องตอบให้ถูกและครบ ถึงจะใช้เวลานานก็ตาม\" อย่าเพิ่งเลือกข้างนะ","steps":[{"l":"ข้อดีของ A (ตอบไว) ปกป้องอะไรอยู่","h":""},{"l":"ข้อดีของ B (ตอบถูก) ปกป้องอะไรอยู่","h":""},{"l":"ทางที่ 3 ที่ได้ทั้งสองอย่างจริง ๆ","h":"ไม่ใช่ \"งั้นตอบภายใน 5 นาที\" นะ"}],"check":["อธิบายข้อดีของทั้งสองฝั่งได้แฟร์","ทางที่ 3 ไม่ใช่แค่เอากลาง ๆ","บอกได้ว่าเรื่องที่ขัดกันนี้ บอกอะไรเกี่ยวกับสิ่งที่ลูกค้าต้องการ"]},{"intro":"ไอเดีย A: \"ให้ทีมตัดสินใจเองได้เต็มที่ (อิสระ)\" กับ ไอเดีย B: \"ต้องมีมาตรฐานกลางที่ทุกทีมทำตาม (คุมไว้)\"","steps":[{"l":"A ปกป้องอะไร แล้วเมื่อไหร่ที่ A ถูกที่สุด","h":""},{"l":"B ปกป้องอะไร แล้วเมื่อไหร่ที่ B ถูกที่สุด","h":""},{"l":"ระบบที่ให้ทั้งอิสระและมาตรฐานไปพร้อมกัน","h":"ลองคิดว่า \"อิสระเรื่องไหน คุมเรื่องไหน\""}],"check":["อธิบายได้ว่าแต่ละฝั่งถูกในสถานการณ์ไหน","แยกเรื่องที่ให้อิสระกับเรื่องที่คุมไว้ได้ชัด","ไม่ใช่ถอยกันคนละครึ่ง"]}]},{"type":"chain","scens":[{"intro":"ปั้น → ถล่ม → ปรับ: เล่นเองทั้งสามบท","steps":[{"l":"1. ปั้น: เขียนไอเดียหรือแผนที่คุณเชื่อที่สุดตอนนี้ (เรื่องอะไรก็ได้) ให้แน่นที่สุด","h":"4–6 บรรทัด ใส่เหตุผลด้วยว่าทำไมมันดี"},{"l":"2. ถล่ม: สวมบทคนที่ไม่เห็นด้วยที่ฉลาดที่สุด แล้วโจมตี 3 จุดที่เจ็บที่สุด","h":"ห้ามโจมตีจุดง่าย ๆ ต้องเป็นจุดที่คุณไม่อยากได้ยินเลย"},{"l":"3. ปรับ: แก้ไอเดียให้รับคำโจมตีได้ แต่แก่นของมันต้องยังอยู่","h":""},{"l":"4. คำโจมตีข้อไหนที่ตอบไม่ได้จริง ๆ แล้วมันแปลว่าอะไร","h":""}],"check":["คำโจมตีแรงพอจนรู้สึกอึดอัด","ไอเดียที่ปรับแล้วต่างจากเดิมแบบเห็นได้ชัด","ยอมรับตรง ๆ ว่าจุดไหนตอบไม่ได้","แก่นของไอเดียยังอยู่"]}]}]},
{"id":"meta","num":13,"group":"เรื่องขัดกัน กับเรื่องในหัวตัวเอง","en":"Metacognitive Thinking","th":"รู้ทันความคิดตัวเอง","c":"#B03A6E","def":"คอยสังเกตว่าตัวเองกำลังคิดยังไง ระหว่างทำงานก็เช็คแล้วปรับไปเรื่อย ๆ วนแบบนี้: วางแผน → คอยดู → เช็คผล → ปรับ → ทบทวน","ex":"เทคนิคของ Feynman: ถ้าอธิบายให้ง่าย ๆ ไม่ได้ แปลว่ายังเข้าใจไม่พอ","take":"ที่ทำให้เราเหนือกว่าคนอื่น ไม่ใช่รู้เยอะกว่า แต่คือรู้ทันว่าตัวเองคิดยังไง พลาดตรงไหน แล้วแก้ยังไง","ask":["ตอนนี้กำลังคิดแบบไหนอยู่ เหมาะกับโจทย์นี้ไหม?","มีอะไรยืนยันว่าคืบหน้าจริง ไม่ใช่แค่รู้สึกว่าคืบหน้า?","มีอะไรที่อาจมองข้ามไป เพราะรีบ เพราะเชื่อไปแล้ว หรือเพราะกลัว?","รอบหน้าจะทำอะไรต่างไป แล้วจะรู้ได้ไงว่าทำจริง?"],"levels":[{"type":"quiz","pick":3,"intro":"จับให้ได้ว่าตัวเองอยู่ขั้นไหน แล้วพลาดตรงไหน","qs":[{"q":"ทำงานมา 2 ชั่วโมง รู้สึกว่าไปได้ดี แต่ยังไม่ได้อะไรที่ใช้ได้เลย ควรทำไง?","o":["ทำต่อไป","หยุดก่อน แล้วถามตัวเองว่า \"มีอะไรยืนยันว่าคืบหน้า\" กับ \"วิธีที่ใช้อยู่ยังเหมาะไหม\"","พักก่อน","เริ่มใหม่หมด"],"a":1,"why":"รู้สึกว่าคืบหน้าไม่ได้แปลว่าคืบหน้าจริง การหยุดเช็คตัวเองคือหัวใจของเรื่องนี้เลย"},{"q":"ข้อไหนคือคำถามตอน \"วางแผน\"?","o":["อะไรเวิร์ก อะไรไม่เวิร์ก?","เป้าหมายคืออะไร รู้อะไรอยู่แล้วบ้าง จะใช้วิธีไหน?","ควรเปลี่ยนวิธีไหม?","มีหลักฐานอะไรรองรับ?"],"a":1,"why":"วางแผนต้องทำก่อนลงมือ อีก 3 ข้อเป็นคำถามตอนทบทวน ปรับ และเช็คผล"},{"q":"อธิบายเรื่องนึงให้เพื่อนฟังแล้วเพื่อนงง แบบนี้บอกอะไรเรา?","o":["เพื่อนไม่ฉลาด","เราอาจยังเข้าใจไม่พอ ลองหาว่าติดตรงไหน","ต้องใช้คำยาก ๆ มากขึ้น","เลิกอธิบายดีกว่า"],"a":1,"why":"อธิบายไม่ได้ คือตัวจับได้ดีที่สุดเลยว่าตรงไหนที่เรายังไม่เข้าใจ"},{"q":"ข้อไหนคือการ \"ทบทวนตัวเอง\" ที่มีประโยชน์จริง?","o":["\"รอบหน้าจะพยายามให้มากขึ้น\"","\"รอบนี้พลาดเพราะไม่ได้เช็คว่าที่เชื่อเรื่อง X ถูกไหม รอบหน้าจะจดสิ่งที่เชื่อไว้ก่อนเริ่ม\"","\"ทำได้ดีแล้ว\"","\"ดวงไม่ดี\""],"a":1,"why":"ทบทวนดี ๆ ต้องบอกได้เลยว่าจะเปลี่ยนการกระทำอะไรแบบเจาะจง ไม่ใช่แค่ตั้งใจกว้าง ๆ"}]},{"type":"reflect","intro":"ลองทบทวนการเล่นเกมนี้ของตัวเอง ตอบตรง ๆ ไม่ต้องสวย","steps":[{"l":"วางแผน: ก่อนเริ่มแต่ละด่าน ตั้งเป้าไว้ไหม หรือกดเล่นเลย?","h":""},{"l":"คอยดู: ด่านไหนที่รู้ตัวว่าเริ่มเดามั่ว แทนที่จะคิด?","h":""},{"l":"เช็คผล: คิดแบบไหนที่ทำได้ดีอยู่แล้ว แบบไหนยังอ่อน?","h":""},{"l":"ปรับ: ถ้าเล่นด่านที่อ่อนอีกรอบ จะเปลี่ยนวิธียังไง?","h":""},{"l":"ทบทวน: อาทิตย์นี้จะเอาวิธีคิดแบบไหนไปใช้กับงานจริง เรื่องอะไร?","h":""}]},{"type":"chain","scens":[{"intro":"เทคนิคของ Feynman: เลือกวิธีคิด 1 แบบจากเกมนี้ที่คิดว่าเข้าใจดีที่สุด แล้วลองทดสอบตัวเอง","steps":[{"l":"1. อธิบายวิธีคิดนั้นให้เด็ก 12 ขวบฟังรู้เรื่อง ห้ามใช้ศัพท์ยาก","h":"ใช้ตัวอย่างจากชีวิตเด็ก ๆ"},{"l":"2. อ่านที่ตัวเองเขียน ตรงไหนที่ใช้คำกว้าง ๆ เพราะจริง ๆ ก็ยังไม่ชัวร์","h":"ตอบตรง ๆ นะ"},{"l":"3. ช่องโหว่ตรงนั้นคืออะไร แล้วจะไปหาคำตอบจากไหน","h":""},{"l":"4. เขียนคำอธิบายใหม่ที่อุดช่องโหว่แล้ว","h":""}],"check":["คำอธิบายข้อ 1 ไม่มีศัพท์ยากจริง ๆ","เจอช่องโหว่อย่างน้อย 1 จุด","คำอธิบายใหม่สั้นและชัดกว่าเดิม"]}]}]},
{"id":"ooda","num":14,"group":"วางเกม รับมือเรื่องไม่แน่นอน","en":"OODA Loop","th":"ดู–คิด–เลือก–ลุย แล้ววนใหม่","c":"#1A5276","isNew":true,"def":"ดูว่าเกิดอะไรขึ้น → คิดว่ามันแปลว่าอะไร → เลือกว่าจะทำอะไร → ลงมือ แล้ววนใหม่ทุกครั้งที่สถานการณ์เปลี่ยน ใครวนได้ไวกว่าและแม่นกว่า คนนั้นได้เปรียบ","ex":"นักบินขับไล่ชื่อ John Boyd สังเกตว่าเครื่องบินที่ \"ด้อยกว่า\" ก็ชนะได้ ถ้านักบินดูสถานการณ์แล้วปรับตัวได้ไวกว่าอีกฝ่าย ธุรกิจก็เหมือนกัน บริษัทที่ปล่อยของไว เรียนรู้ไว ปรับไว ชนะบริษัทที่วางแผนเป๊ะแต่ช้า","take":"พอสถานการณ์เปลี่ยน อย่าแข็งทื่อ ดูใหม่ ปรับใหม่ แล้วลุยอีกรอบ","ask":["ดู: มีอะไรเปลี่ยนไปจากที่คิดไว้บ้าง (เอาแค่ข้อเท็จจริง ยังไม่ต้องตีความ)?","คิด: ที่เปลี่ยนไปนั้นแปลว่าอะไร มีอะไรที่เคยเชื่อแล้วตอนนี้ใช้ไม่ได้แล้ว?","เลือก: ตอนนี้ทำอะไรได้ทันทีบ้าง แล้วจะเลือกอะไร?","ลุย: ภายใน 24 ชั่วโมงจะทำอะไร แล้วจะกลับมาดูใหม่เมื่อไหร่?"],"levels":[{"type":"quiz","pick":3,"intro":"เข้าใจแต่ละขั้น และจุดที่คนชอบติด","qs":[{"q":"ขั้นไหนที่คนมักติดที่สุด และสำคัญที่สุด?","o":["ขั้นดู เพราะต้องมีข้อมูล","ขั้นคิด เพราะเราตีความจากประสบการณ์ ความลำเอียง และภาพในหัว ซึ่งเป็นตัวกำหนดว่าเราจะเห็นอะไรและเลือกอะไร","ขั้นเลือก เพราะต้องตัดสินใจ","ขั้นลุย เพราะต้องลงมือ"],"a":1,"why":"Boyd บอกว่าขั้นคิดคือหัวใจ ข้อมูลชุดเดียวกัน แต่คนตีความต่างกัน ก็เลือกทำต่างกันไปเลย"},{"q":"ทีมวางแผนไว้ 6 เดือน ทำไปได้ 2 เดือนตลาดเปลี่ยน แต่ทีมยังทำตามแผนเดิม เพราะ \"ลงทุนไปแล้ว\" แบบนี้พลาดที่ขั้นไหน?","o":["ขั้นดู","ขั้นคิด (ไม่ยอมเปลี่ยนความคิด เพราะเสียดายของที่ลงไปแล้ว)","ขั้นเลือก","ขั้นลุย"],"a":1,"why":"เขาก็เห็นนะว่าตลาดเปลี่ยน (ขั้นดูผ่าน) แต่ไม่ยอมคิดใหม่ว่ามันแปลว่าอะไร"},{"q":"\"วนให้ไวกว่าคู่แข่ง\" แปลว่าอะไร?","o":["ตัดสินใจแบบไม่ต้องคิด","วนรอบเล็ก ๆ ถี่ ๆ: ลองทีละนิด ดูผลไว ปรับไว แทนที่จะวางแผนใหญ่แล้วลุยทีเดียว","ทำงานหนักขึ้น","ข้ามขั้นคิดไปเลย"],"a":1,"why":"ไวเพราะรอบสั้นลง ไม่ใช่ไปรีบทำทุกขั้น"},{"q":"ข้อไหนคือการ \"ดู\" ที่ดี?","o":["\"ลูกค้าไม่ชอบของเรา\"","\"อาทิตย์นี้ยอดขายลด 15% กลุ่มอายุ 25–34 ลดเยอะสุด แล้วคู่แข่งเพิ่งลดราคา\"","\"เราควรลดราคา\"","\"ตลาดแย่\""],"a":1,"why":"ขั้นดูคือข้อเท็จจริงล้วน ๆ ที่ยังไม่ได้ตีความ อีก 3 ข้อคือตีความหรือตัดสินใจไปแล้ว"}]},{"type":"sequence","intro":"เรียงสิ่งที่ทีมทำให้ตรงกับรอบ ดู → คิด → เลือก → ลุย → ดูอีกรอบ","chains":[{"t":"ร้านอาหารเพิ่งออกเมนูใหม่ แต่ลูกค้าสั่งน้อยกว่าที่คิดไว้เยอะ","items":["ดูข้อมูล: เมนูใหม่โดนสั่งแค่ 5% ของออเดอร์ รีวิวบอกว่า \"แพงไปเมื่อเทียบกับปริมาณ\"","คิด: ปัญหาไม่ใช่รสชาติ แต่ลูกค้ารู้สึกว่าไม่คุ้ม ที่เคยเชื่อว่า \"ลูกค้ายอมจ่ายเพื่อของใหม่\" ใช้ไม่ได้แล้ว","เลือก: ลดขนาดจานกับราคาลง 20% แทนที่จะถอดเมนูทิ้ง","ลุย: เปลี่ยนราคากับขนาดตั้งแต่พรุ่งนี้ ลอง 1 อาทิตย์","กลับมาดูข้อมูลอีกรอบ: คนสั่งเยอะขึ้นไหม รีวิวเปลี่ยนไหม"]},{"t":"สตาร์ทอัพปล่อยแอปเวอร์ชันแรก แล้วเจ้าใหญ่ก็ปล่อยฟีเจอร์เดียวกันแบบฟรี","items":["ดู: คนสมัครใหม่ลด 40% หลังเจ้าใหญ่ประกาศ แต่คนที่ใช้อยู่แล้วยังใช้ต่อ","คิด: เราแข่งเรื่องฟีเจอร์ไม่ได้แล้ว แต่คนเดิมยังอยู่ แปลว่าเรามีอะไรที่เจ้าใหญ่ไม่มี","เลือก: หยุดทำฟีเจอร์ที่ซ้ำกับเขา แล้วไปเน้นสิ่งที่คนเดิมชอบ","ลุย: คุยกับคนที่ใช้อยู่ 20 คนภายในอาทิตย์นี้ แล้วเปลี่ยนหน้าแรกให้เน้นจุดที่เราต่าง","ดูรอบใหม่: หลังเปลี่ยนหน้าแรก คนสมัครและใช้งานเป็นยังไง"]}]},{"type":"chain","scens":[{"intro":"เจอเรื่องกลางทาง: คุณกำลังจัดงานเปิดตัวสินค้ากลางแจ้งในอีก 3 วัน ขายบัตรไปแล้ว 500 ใบ เช้านี้พยากรณ์อากาศบอกว่ามีโอกาสฝนตกหนัก 70% แล้วเจ้าที่ให้เช่าเต็นท์ก็เพิ่งโทรมาบอกว่าส่งได้แค่ครึ่งเดียว","steps":[{"l":"รอบที่ 1 — ดู: ตอนนี้รู้อะไรแน่ ๆ บ้าง (ห้ามตีความ)","h":""},{"l":"รอบที่ 1 — คิด: มันแปลว่าอะไร อะไรที่เคยเชื่อไว้แล้วพัง","h":""},{"l":"รอบที่ 1 — เลือก + ลุย: วันนี้จะทำอะไร","h":""},{"l":"รอบที่ 2 — มีข้อมูลใหม่: ผ่านไป 1 วัน พยากรณ์เปลี่ยนเป็น 30% แต่คนถือบัตร 80 คนขอเงินคืนไปแล้ว ลองดู/คิด/เลือกใหม่","h":"อย่ายึดติดกับที่เลือกไว้รอบแรก"}],"check":["ขั้นดูรอบแรกเป็นข้อเท็จจริงล้วน ๆ","ขั้นคิดบอกได้ว่าอะไรที่เคยเชื่อแล้วพัง","สิ่งที่เลือกรอบแรกทำได้จริงภายในวันนั้น","รอบที่ 2 ปรับตามข้อมูลใหม่ ไม่ยึดติดกับรอบแรก"]}]}]},
{"id":"game","num":15,"group":"วางเกม รับมือเรื่องไม่แน่นอน","en":"Game Theory","th":"คิดเผื่อว่าอีกฝ่ายจะเล่นยังไง","c":"#4A235A","isNew":true,"def":"คิดถึงว่าแต่ละฝ่ายอยากได้อะไร แล้วคิดไปไกลกว่าตาที่เราจะเดิน ไปถึงตาที่คนอื่นจะเดินสวนกลับมา","ex":"สายการบิน A ลดราคา หวังจะแย่งลูกค้า แต่ถ้า B ลดตาม ทั้งคู่ก็ได้ลูกค้าเท่าเดิม แถมกำไรหดอีก คนที่คิดเป็นจะถามก่อนว่า \"ถ้าเราลด B จะทำอะไร\" ไม่ใช่แค่ \"ถ้าลดแล้วเราจะได้อะไร\"","take":"คิดถึงทั้งของเราและของเขา แล้วหาจุดที่ชนะด้วยกันได้","ask":["ในเรื่องนี้มีใครเกี่ยวบ้าง (รวมคนที่ไม่ได้นั่งอยู่บนโต๊ะด้วย)?","แต่ละคนอยากได้อะไรจริง ๆ แล้วกลัวอะไร?","ถ้าเราเดินตานี้ แต่ละคนจะสวนกลับยังไงให้ตัวเองได้ประโยชน์?","มีทางไหนที่ทุกฝ่ายดีขึ้นพร้อมกัน หรือทำให้การร่วมมือกันเป็นทางที่ดีที่สุดของเขาเองไหม?"],"levels":[{"type":"quiz","pick":3,"intro":"เดาให้ได้ว่าอีกฝ่ายจะสวนกลับยังไง แล้วเขาอยากได้อะไร","qs":[{"q":"คุณกับคู่แข่งขายของเหมือนกัน ถ้าคุณลดราคา 10% น่าจะเกิดอะไรขึ้น?","o":["ได้ลูกค้าเพิ่ม 10%","คู่แข่งลดตามในไม่กี่วัน ลูกค้าแบ่งกันเท่าเดิม แต่กำไรหายทั้งคู่","คู่แข่งเจ๊ง","ลูกค้าไม่สนใจ"],"a":1,"why":"ถ้าคู่แข่งคิดเป็น เขาไม่ยอมเสียลูกค้าหรอก สงครามราคาคือเกมที่แพ้ทั้งคู่"},{"q":"ทำไมร้านค้าสัญญากันว่า \"จะไม่มีใครลดราคา\" แล้วสุดท้ายมักพังเอง?","o":["เพราะผิดกฎหมาย","เพราะทุกร้านอยากแอบลดราคาไปแย่งลูกค้า ถ้าเชื่อว่าร้านอื่นไม่ลด","เพราะลูกค้าไม่ชอบ","เพราะราคาแพงเกิน"],"a":1,"why":"ถ้าแต่ละคนโกงแล้วได้มากกว่าร่วมมือ สัญญาก็อยู่ไม่ได้ ถ้าไม่มีวิธีลงโทษคนโกง"},{"q":"ทำยังไงให้การร่วมมือกันอยู่ได้นานขึ้น?","o":["ขอร้องกันดี ๆ","ทำให้ต้องเจอกันหลายรอบ (ชื่อเสียงมีค่า) แล้วมีวิธีจับได้และเอาคืนคนโกงที่ชัดเจน","ทำทีเดียวจบ","ปิดข้อมูลไว้"],"a":1,"why":"ถ้าเจอกันรอบเดียว โกงแล้วคุ้ม แต่ถ้าต้องเจอกันอีกหลายรอบ โกงเท่ากับทำลายอนาคตตัวเอง"},{"q":"ก่อนไปต่อรอง ควรรู้อะไรเกี่ยวกับอีกฝ่ายมากที่สุด?","o":["เขาอยากได้เงินเท่าไหร่","ถ้าไม่ตกลงกับเรา เขามีทางอื่นที่ดีที่สุดคืออะไร เพราะมันบอกว่าเขายอมได้แค่ไหน","เขาชอบอะไร","เขามีเงินเท่าไหร่"],"a":1,"why":"อำนาจต่อรองมาจากทางเลือกนอกโต๊ะ ไม่ใช่จากว่าอยากได้แค่ไหน"},{"q":"ข้อไหนคือ \"คนที่ไม่ได้นั่งบนโต๊ะ\" ที่คนชอบลืม?","o":["ลูกค้า","หน่วยงานรัฐที่คุมกฎ คนที่จะเข้ามาแข่งในอนาคต และพนักงานที่ต้องทำตามแผน","คู่แข่ง","ผู้ถือหุ้น"],"a":1,"why":"คนที่ตอบโต้ช้าหรือเงียบ ๆ มักเป็นคนที่มาพลิกเกมทีหลัง"}]},{"type":"match","pick":5,"intro":"จับคู่ \"ตาที่เราเดิน\" กับ \"ที่อีกฝ่ายน่าจะสวนกลับ\"","l":"เราเดิน","r":"อีกฝ่ายน่าจะสวนกลับ","pool":[["ลดราคาแรง ๆ เพื่อแย่งตลาด","คู่แข่งลดตาม กลายเป็นสงครามราคา"],["ขึ้นราคาเพราะเป็นเจ้าตลาด","มีเจ้าใหม่เข้ามาขายถูกกว่า"],["บังคับพนักงานเข้าออฟฟิศ 5 วัน","คนเก่ง ๆ ที่มีที่ไป ลาออกไปที่ที่ยืดหยุ่นกว่า"],["ยื่นข้อเสนอสุดท้าย ห้ามต่อรอง","อีกฝ่ายถอนตัวหรือไปหาทางอื่น ถึงข้อเสนอจะดีก็ตาม"],["ให้ส่วนลดเยอะ ๆ เฉพาะลูกค้าใหม่","ลูกค้าเก่าโกรธ หรือยกเลิกแล้วสมัครใหม่"],["ประกาศแผนให้ทุกคนรู้","คู่แข่งปรับตัวทันก่อนแผนจะสำเร็จ"],["ตั้งราคาถูกมาก ๆ ในตลาดใหม่","หน่วยงานรัฐเข้ามาตรวจเรื่องทุ่มตลาด"]]},{"type":"chain","scens":[{"intro":"เรื่องมีอยู่ว่า: คุณเป็นเจ้าเล็กที่ส่งของให้ลูกค้าเจ้าใหญ่ (60% ของยอดขาย) เขาขอลดราคา 15% บอกว่ามีเจ้าอื่นเสนอถูกกว่า","steps":[{"l":"1. ในเรื่องนี้มีใครบ้าง แล้วแต่ละคนอยากได้อะไรจริง ๆ","h":"รวมทีมจัดซื้อของลูกค้า (เขาโดนวัดผลด้วยอะไร) เจ้าอื่นที่ส่งของ และลูกค้ารายอื่นของคุณด้วย"},{"l":"2. ถ้าคุณปฏิเสธ เขามีทางไหน แล้วถ้าเขาไปจริง คุณมีทางไหน","h":"ประเมินแบบตรง ๆ: ถ้าเขาเปลี่ยนเจ้า เขาต้องเสียอะไรบ้าง"},{"l":"3. ตาที่คุณเดินได้ 3 แบบ แล้วแต่ละแบบเขาน่าจะสวนกลับยังไง","h":"เช่น ยอมลด / ปฏิเสธ / เสนอรูปแบบใหม่"},{"l":"4. ข้อเสนอที่ทำให้ทีมจัดซื้อ \"ชนะ\" ในตัวเลขที่เขาโดนวัด โดยคุณไม่ต้องเสียกำไรไปหมด","h":""}],"check":["บอกได้ว่าทีมจัดซื้ออยากได้อะไร (ไม่ใช่แค่ \"บริษัทลูกค้า\")","ประเมินทางเลือกของทั้งสองฝ่ายแบบตามจริง","แต่ละตาที่เดินมีการเดาว่าอีกฝ่ายจะสวนกลับยังไง","ข้อเสนอสุดท้ายทำให้ได้ประโยชน์เพิ่ม ไม่ใช่แค่มาแบ่งส่วนลดกัน"]}]}]},
{"id":"leverage","num":16,"group":"วางเกม รับมือเรื่องไม่แน่นอน","en":"Leverage Thinking","th":"หาจุดทุ่นแรง","c":"#7D6608","isNew":true,"def":"หาจุดที่ออกแรงนิดเดียวแต่ได้ผลเยอะเกินตัว หาจุดที่ติดขัดอยู่ ซึ่งขยับนิดเดียวแล้วทั้งเรื่องเปลี่ยนไปเลย","ex":"ร้านออนไลน์แก้ปุ่ม \"จ่ายเงิน\" ให้เห็นชัดขึ้น ในหน้าที่ลูกค้าทิ้งตะกร้าเยอะที่สุด ใช้เวลาแค่ครึ่งวัน แต่ยอดขายเพิ่มมากกว่ายิงโฆษณาทั้งเดือน เพราะแก้ตรงจุดที่ทุกคนต้องผ่าน","take":"หาจุดที่ติดขัด แล้วขยับนิดเดียวให้ได้ผลใหญ่","ask":["กว่าจะได้ผลที่อยากได้ ต้องผ่านขั้นไหนบ้าง แล้วตอนนี้ไปติดอยู่ขั้นไหน?","มีอะไรที่ทำครั้งเดียวแล้วได้ผลไปเรื่อย ๆ ไหม (ระบบ เครื่องมือ หรือการตัดสินใจที่วางโครงไว้เลย)?","ผลลัพธ์ส่วนใหญ่ มาจากแค่ส่วนน้อยของอะไร?","ที่ทำอยู่ตอนนี้ อันไหนเหนื่อยมากแต่ได้ผลน้อย ควรเลิกได้แล้ว?"],"levels":[{"type":"quiz","pick":3,"intro":"แยกงานที่ทุ่นแรงจริง ออกจากงานที่แค่ทำให้ดูยุ่ง","qs":[{"q":"อะไรที่ช่วยทุ่นแรงที่สุดนะ?","o":["ตอบอีเมลลูกค้าเองทุกฉบับให้ดีที่สุด","เขียนคำตอบสำเร็จรูปสำหรับ 10 คำถามที่โดนถามบ่อยที่สุด แล้วให้ทีมหยิบไปใช้","ทำโอทีเพื่อตอบให้ทัน","จ้างคนเพิ่ม"],"a":1,"why":"ทำครั้งเดียว ใช้ได้เป็นพันครั้ง นี่แหละคือการทุ่นแรง"},{"q":"โรงงานมี 5 ขั้นตอน ขั้นที่ 3 ทำได้ชั่วโมงละ 100 ชิ้น ขั้นอื่นทำได้ชั่วโมงละ 200 ชิ้น ควรลงเงินที่ไหน?","o":["ลงทุกขั้นเท่า ๆ กัน","ขั้นที่ 1 เพราะเป็นจุดเริ่ม","ขั้นที่ 3 เพราะติดอยู่ตรงนั้น ไปแก้ขั้นอื่นยังไงก็ผลิตได้เท่าเดิม","ขั้นที่ 5 เพราะใกล้ลูกค้า"],"a":2,"why":"ทั้งโรงงานผลิตได้เท่ากับขั้นที่ช้าที่สุด ไปแก้ที่อื่นก็เสียแรงเปล่า"},{"q":"ข้อไหนคือการทุ่นแรงแบบได้ผลยาว ๆ?","o":["ทำงานให้ไวขึ้น","สร้างอะไรที่ทำงานแทนเราได้ถึงเราจะไม่อยู่: ระบบ โค้ด คอนเทนต์ หรือทีมที่ตัดสินใจเองได้","ประชุมให้มากขึ้น","ทำหลายงานพร้อมกัน"],"a":1,"why":"ลงแรงเองยังไงก็ติดเพดานที่จำนวนชั่วโมง แต่ของที่ทุ่นแรงไม่มีเพดานแบบนั้น"},{"q":"แบบไหนที่บอกว่ากำลังทำงานแบบไม่ทุ่นแรงเลย?","o":["เหนื่อยแทบตายแต่ผลไม่ขยับ แล้วถ้าหยุดทำเมื่อไหร่ ทุกอย่างก็หยุดตาม","ผลออกมาดีเกินคาด","งานเสร็จไว","คนอื่นทำแทนได้"],"a":0,"why":"ถ้าผลที่ได้เพิ่มตามชั่วโมงที่ลงไปเป๊ะ ๆ แปลว่ายังไม่มีอะไรช่วยทุ่นแรงเลย"}]},{"type":"sequence","intro":"เรียงจาก \"ทุ่นแรงที่สุด\" (บนสุด) ไป \"ทุ่นแรงน้อยที่สุด\" (ล่างสุด)","chains":[{"t":"ร้านออนไลน์อยากเพิ่มยอดขาย แต่งบน้อย","items":["แก้หน้าจ่ายเงินที่ลูกค้า 60% ทิ้งตะกร้าไว้","ตั้งอีเมลอัตโนมัติเตือนคนที่ทิ้งตะกร้าไว้","เพิ่มสินค้าใหม่ 20 อย่าง","ยิงโฆษณาเพิ่มให้คนเข้าเว็บเยอะขึ้น","ตอบคอมเมนต์ในโซเชียลเองทุกอัน"]},{"t":"หัวหน้าทีม 8 คน อยากให้ทีมทำงานได้ดีขึ้น","items":["วางหลักให้ทีมตัดสินใจเองได้ โดยไม่ต้องรอหัวหน้า","เขียนคู่มือสำหรับงานที่ทำซ้ำบ่อย ๆ 5 อย่าง","จัดอบรมสักครั้ง","ตรวจงานทุกชิ้นเองให้ละเอียดขึ้น","ทำงานแทนคนที่ทำช้า"]}]},{"type":"chain","scens":[{"intro":"เรื่องมีอยู่ว่า: คุณดูแลการรับคนเข้าทำงาน ตอนนี้ใช้เวลาเฉลี่ย 45 วันต่อตำแหน่ง ผู้บริหารอยากให้เหลือ 20 วัน ขั้นตอนคือ (1) เขียนประกาศ 3 วัน (2) รอคนสมัคร 10 วัน (3) คัดใบสมัคร 5 วัน (4) นัดสัมภาษณ์รอบแรก 12 วัน (5) สัมภาษณ์รอบสอง 7 วัน (6) ยื่นข้อเสนอแล้วรอตอบ 8 วัน","steps":[{"l":"1. จริง ๆ แล้วติดอยู่ตรงไหน เพราะอะไร (อย่าตอบขั้นที่นานที่สุดแบบไม่คิด)","h":"ลองถามว่าเวลาในแต่ละขั้นคือ \"เวลาที่ทำงานจริง\" หรือ \"เวลาที่นั่งรอ\""},{"l":"2. ขยับอะไรเล็ก ๆ 1 อย่างตรงจุดที่ติด แล้วลดเวลาได้เยอะที่สุด","h":""},{"l":"3. อะไรที่ทำครั้งเดียว แล้วทำให้การรับคนทุกครั้งต่อจากนี้ไวขึ้น","h":"ระบบ แบบฟอร์มสำเร็จรูป หลักการตัดสินใจ"},{"l":"4. อะไรที่ทีมทำอยู่แล้วควร \"เลิก\" เพราะเหนื่อยแต่ไม่ช่วยลดเวลาเลย","h":""}],"check":["บอกจุดที่ติดได้แบบมีเหตุผล ไม่ใช่แค่ดูเลขที่เยอะที่สุด","สิ่งที่ขยับในข้อ 2 เล็กจริง แต่ได้ผลใหญ่","ข้อ 3 ใช้ซ้ำได้เรื่อย ๆ โดยไม่ต้องลงแรงเพิ่ม","กล้าบอกว่าอะไรควรเลิกทำ"]}]}]},
{"id":"scenario","num":17,"group":"วางเกม รับมือเรื่องไม่แน่นอน","en":"Scenario Planning","th":"เตรียมรับหลายอนาคต","c":"#0E6655","isNew":true,"def":"ลองนึกภาพอนาคตไว้หลาย ๆ แบบ แทนที่จะเทหมดหน้าตักกับการเดาแบบเดียว แล้วเตรียมไว้ก่อนว่าแต่ละแบบจะทำยังไง","ex":"ช่วงปี 1970 บริษัท Shell ซ้อมนึกภาพอนาคตไว้หลายแบบ พอเกิดวิกฤตน้ำมันจริง ก็เป็นไม่กี่เจ้าที่ไม่ตื่นตูม เพราะเคย \"ซ้อม\" เรื่องนี้ในหัวมาแล้ว","take":"นึกภาพไว้ว่าดีสุดเป็นยังไง น่าจะเป็นยังไง แย่สุดเป็นยังไง แล้วเตรียมแผนไว้ทุกแบบ","ask":["เรื่องที่เดายากแต่ส่งผลกับเราเยอะที่สุด 2 เรื่องคืออะไร?","อนาคต 3 แบบ (ดีสุด / น่าจะเป็น / แย่สุด) หน้าตาเป็นยังไง?","แต่ละแบบเราจะทำอะไร แล้วมีอะไรที่ทำแล้วรอดได้ทุกแบบไหม?","มีอะไรเตือนล่วงหน้าบ้าง ว่าเรากำลังเดินเข้าอนาคตแบบไหน?"],"levels":[{"type":"quiz","pick":3,"intro":"หลักการเตรียมรับหลายอนาคต","qs":[{"q":"จริง ๆ แล้วการนึกภาพอนาคตหลายแบบทำไปเพื่ออะไร?","o":["เพื่อเดาอนาคตให้แม่น","เพื่อให้รับมือได้ดีไม่ว่าอนาคตแบบไหนจะมา และไม่ตกใจตอนมันมาถึง","เพื่อเลือกอนาคตที่ดีที่สุด","เพื่อทำงบประมาณ"],"a":1,"why":"มันไม่ใช่การดูดวง แต่เป็นการซ้อมรับมือ"},{"q":"ข้อไหนคือการตัดสินใจแบบ \"รอดได้ทุกทาง\"?","o":["เลือกทางที่ได้ผลดีที่สุดในกรณีที่น่าจะเกิด","เลือกทางที่ผลออกมารับได้ทุกกรณี ถึงจะไม่ได้ดีที่สุดในกรณีไหนเลยก็ตาม","ตัดสินใจช้าที่สุด","ทำตามผู้บริหาร"],"a":1,"why":"ถ้าไม่รู้ว่าอนาคตไหนจะมา ทางที่ \"ไม่พังสักกรณี\" มักดีกว่าทางที่ \"เจ๋งมากอยู่กรณีเดียว\""},{"q":"\"สัญญาณเตือนล่วงหน้า\" ที่ดีเป็นแบบไหน?","o":["ข่าวที่ทุกคนรู้กันแล้ว","ตัวเลขที่จะขยับก่อนเรื่องนั้นจะเกิดเต็ม ๆ แล้วเราคอยดูได้จริง","ความรู้สึกของผู้บริหาร","ผลประกอบการไตรมาสที่แล้ว"],"a":1,"why":"สัญญาณต้องมาก่อนเรื่องจะเกิด ไม่ใช่มายืนยันสิ่งที่เกิดไปแล้ว"},{"q":"พลาดแบบไหนที่คนเจอบ่อยที่สุด เวลานึกภาพอนาคตหลายแบบ?","o":["นึกออกมาเยอะเกินไป","นึกไว้ 3 แบบ แต่สุดท้ายก็เตรียมแผนไว้แค่แบบ \"น่าจะเป็น\" อยู่ดี","ใช้เวลานาน","ไม่ใช้ตัวเลข"],"a":1,"why":"ถ้าสุดท้ายเตรียมไว้แค่แบบเดียว ก็ไม่ต่างจากไม่ได้ทำเลย"}]},{"type":"chain","scens":[{"intro":"ต้องตัดสินใจ: ร้านกาแฟของคุณกำลังคิดจะเซ็นสัญญาเช่า 3 ปีเพื่อขยายร้านเป็น 2 เท่า ค่าเช่าจะขึ้นจาก 30,000 เป็น 70,000 บาทต่อเดือน","steps":[{"l":"1. เรื่องที่เดายากแต่สำคัญที่สุด 2 เรื่อง","h":"เช่น คนแถวนี้จะอยากกินกาแฟแค่ไหน / ค่าวัตถุดิบ / คู่แข่ง / เศรษฐกิจ"},{"l":"2. แบบดีสุด: เกิดอะไรขึ้น ตัวเลขคร่าว ๆ แล้วเราจะทำอะไร","h":""},{"l":"3. แบบน่าจะเป็น: เกิดอะไรขึ้น ตัวเลข แล้วเราจะทำอะไร","h":""},{"l":"4. แบบแย่สุด: เกิดอะไรขึ้น ตัวเลข เราจะรอดไหม แล้วจะทำอะไร","h":""},{"l":"5. สรุป: เซ็นหรือไม่เซ็น หรือมีทางที่สาม แล้วสัญญาณอะไรจะบอกว่ากำลังเข้าแบบไหน","h":"เช่น ต่อรองให้สัญญายกเลิกได้หลังผ่านไป 1 ปี"}],"check":["เรื่องที่เดายากที่เลือกมา ส่งผลจริงและคาดเดาได้ยากจริง","แบบแย่สุดแย่พอที่จะลองดูว่าจะรอดไหม","ไม่ได้ตัดสินใจโดยดูแค่แบบน่าจะเป็น","มีสัญญาณเตือนล่วงหน้าที่คอยดูได้จริง"]}]},{"type":"chain","scens":[{"intro":"ด่านยาก: บริษัทคุณต้องเลือกว่าจะลงเงิน 3 ปีกับเทคโนโลยี A (ที่ตลาดใช้กันอยู่ตอนนี้) หรือ B (ของใหม่ ยังไม่รู้ว่าจะกลายเป็นมาตรฐานไหม) ลองทำตาราง 2×2 ดู","steps":[{"l":"1. เลือกเรื่องที่ยังไม่แน่นอน 2 เรื่อง (แต่ละเรื่องออกได้ 2 ทาง) จะได้อนาคต 4 แบบ","h":"เช่น เรื่องที่ 1: B ได้เป็นมาตรฐาน / ไม่ได้ ; เรื่องที่ 2: ตลาดโตไว / โตช้า"},{"l":"2. ตั้งชื่อเล่นให้อนาคตทั้ง 4 แบบ แล้วเล่าสั้น ๆ","h":""},{"l":"3. แต่ละแบบ ถ้าเลือก A หรือ B จะออกมาเป็นยังไง","h":""},{"l":"4. ทางที่รอดได้ทุกแบบ หรือทางที่สาม (เช่น ลงกับ A ไปก่อน แต่เผื่อเงินนิดหน่อยไว้ลองเล่นกับ B) และสัญญาณที่จะบอกว่าเรากำลังอยู่ในแบบไหน","h":""},{"l":"5. จุดเปลี่ยนแผน: ถ้าเห็นสัญญาณ X ภายในเดือน Y จะเปลี่ยนแผนยังไง","h":""}],"check":["สองเรื่องที่เลือกไม่ได้ขึ้นต่อกัน และสำคัญจริง","ดูผลของ A กับ B ครบทั้ง 4 แบบ","มีทางเลือกอื่นที่ไม่ใช่แค่ A หรือ B","จุดเปลี่ยนแผนบอกชัดว่าเห็นอะไร เมื่อไหร่ แล้วจะทำอะไร"]}]}]},
{"id":"prob","num":18,"group":"วางเกม รับมือเรื่องไม่แน่นอน","en":"Probabilistic Thinking","th":"คิดเป็นเปอร์เซ็นต์","c":"#922B21","isNew":true,"def":"เลิกคิดแบบ \"ชัวร์/ไม่ชัวร์\" แล้วคิดเป็นโอกาสกี่เปอร์เซ็นต์ เสี่ยงแค่ไหน คุ้มไหม แล้วพอได้ข้อมูลใหม่ก็ปรับตัวเลขตาม","ex":"นักลงทุนเก่ง ๆ ไม่ถามว่า \"หุ้นนี้จะขึ้นไหม\" แต่ถามว่า \"มีโอกาสขึ้นกี่เปอร์เซ็นต์ ถ้าขึ้นได้เท่าไหร่ ถ้าลงเสียเท่าไหร่\" แทงถูกก็แพ้ได้ แทงผิดก็ชนะได้ ต้องแยกว่าตัดสินใจดีไหม ออกจากผลที่ออกมา","take":"ถามว่า \"แต่ละแบบมีโอกาสเกิดกี่เปอร์เซ็นต์\" แล้วปรับตัวเลขเมื่อได้ข้อมูลใหม่","ask":["เป็นไปได้กี่แบบ แล้วให้แต่ละแบบกี่เปอร์เซ็นต์?","เรื่องแบบนี้ ปกติทั่ว ๆ ไปเกิดขึ้นบ่อยแค่ไหน?","ถ้าคิดรวมโอกาสกับผลที่ได้ แต่ละทางคุ้มแค่ไหน แล้วถ้าเจอกรณีแย่ รับไหวไหม?","ถ้าได้ข้อมูลอะไรใหม่ จะปรับตัวเลข แล้วปรับไปทางไหน?"],"levels":[{"type":"quiz","pick":3,"intro":"กับดักที่คนชอบพลาดเวลาคิดเรื่องโอกาส","qs":[{"q":"สตาร์ทอัพ 90% เจ๊งภายใน 5 ปี คนก่อตั้งคนนึงมั่นใจ 80% ว่าจะรอด เพราะ \"ทีมเราเก่ง\" ปัญหาคืออะไร?","o":["เขามั่นใจน้อยไป","เขาลืมดูว่าปกติแล้วรอดกันแค่ไหน ทุกทีมก็คิดว่าตัวเองเก่ง ควรเริ่มจาก 10% ก่อน แล้วค่อยบวกเพิ่มถ้ามีหลักฐานเฉพาะของตัวเอง","ไม่มีปัญหา","เขาควรเลิกทำ"],"a":1,"why":"เริ่มจากภาพรวมคนอื่นก่อน แล้วค่อยปรับด้วยข้อมูลของตัวเอง"},{"q":"คุณตัดสินใจอย่างดีแล้วจากข้อมูลที่มี แต่ผลออกมาแย่ ควรสรุปว่าอะไร?","o":["ตัดสินใจผิด","ที่ตัดสินใจไปอาจดีแล้วก็ได้ ผลแย่เกิดได้เพราะมันเป็นเรื่องของโอกาส ต้องดูที่วิธีตัดสินใจ ไม่ใช่ดูแค่ผล","ดวงไม่ดีอย่างเดียว ไม่ต้องทบทวน","รอบหน้าอย่าตัดสินใจอะไรเลย"],"a":1,"why":"เอาผลมาตัดสินว่าตัดสินใจดีหรือไม่ดี เป็นกับดักที่ทำให้เราเรียนรู้ผิด ๆ"},{"q":"ทาง A: ได้ 100,000 ชัวร์ ๆ ทาง B: 50% ได้ 250,000 / 50% ได้ 0 ถ้าเฉลี่ยแล้ว ทาง B ได้เท่าไหร่?","o":["100,000","125,000","250,000","0"],"a":1,"why":"0.5×250,000 + 0.5×0 = 125,000 มากกว่า A แต่จะเลือก B ไหม ขึ้นอยู่กับว่ารับได้ไหมถ้าได้ 0"},{"q":"\"ตรวจสุขภาพแม่น 95%\" แล้วผลออกมาเป็นบวก สำหรับโรคที่เป็นกันแค่ 1 ใน 1,000 คน คุณมีโอกาสเป็นโรคจริงประมาณเท่าไหร่?","o":["95%","ประมาณ 2% เพราะคน 999 คนที่ไม่ได้เป็นโรค จะมีคนที่ผลขึ้นบวกแบบผิด ๆ (≈50 คน) เยอะกว่าคนที่เป็นจริง (≈1 คน)","50%","100%"],"a":1,"why":"นี่แหละทำไมต้องดูว่าปกติเรื่องนี้เกิดบ่อยแค่ไหน ขนาดหมอยังพลาดบ่อยเลย"},{"q":"ข้อไหนคือการ \"ปรับความเชื่อ\" ที่ถูก?","o":["ได้ข้อมูลใหม่ที่ขัดกับที่เชื่อ → ไม่รับข้อมูล","ได้ข้อมูลใหม่ → ปรับเปอร์เซ็นต์ตามว่าหลักฐานหนักแค่ไหน ไม่ได้พลิกไปสุดขั้ว","ได้ข้อมูลใหม่ → เปลี่ยนความเชื่อทั้งหมดทันที","ไม่เปลี่ยนจนกว่าจะชัวร์ 100%"],"a":1,"why":"หลักฐานแน่นก็ปรับเยอะ หลักฐานอ่อนก็ปรับนิดเดียว"}]},{"type":"quiz","pick":3,"intro":"ลองเดาโอกาสให้สมเหตุสมผล (คำตอบคือช่วงที่ใกล้ความจริงที่สุด)","qs":[{"q":"โปรเจกต์ IT ในบริษัททั่วไป มีโอกาสเสร็จทันเวลาและไม่เกินงบประมาณสักเท่าไหร่?","o":["80–90%","50–60%","20–35%","ต่ำกว่า 5%"],"a":2,"why":"มีงานวิจัยหลายชิ้นบอกว่าโปรเจกต์ IT ใหญ่ ๆ ส่วนมากเกินเวลาหรือเกินงบ ถ้าไม่มีข้อมูลอื่น ก็เริ่มจากตัวเลขนี้"},{"q":"ร้านอาหารเปิดใหม่ มีโอกาสยังเปิดอยู่หลังผ่านไป 3 ปีสักเท่าไหร่?","o":["90%","70%","40–50%","10%"],"a":2,"why":"ข้อมูลจากหลายประเทศบอกว่าประมาณครึ่งนึงไปไม่ถึงปีที่ 3 ถ้าคิดว่าร้านตัวเองรอดแน่ 90% ลองถามตัวเองว่ามีหลักฐานอะไร"},{"q":"ทีมบอกว่างานจะเสร็จใน 2 อาทิตย์ \"ชัวร์\" คุณควรให้โอกาสที่จะเสร็จจริงใน 2 อาทิตย์เท่าไหร่?","o":["95%","75%","40–55%","10%"],"a":2,"why":"คนเรามักเดาเวลาน้อยกว่าความจริงเสมอ ได้ยินคำว่า \"ชัวร์\" เมื่อไหร่ให้ระวังไว้"},{"q":"โยนเหรียญธรรมดา 5 ครั้ง ออกหัวหมดเลย ครั้งที่ 6 มีโอกาสออกหัวเท่าไหร่?","o":["ต่ำกว่า 50% เพราะถึงตาก้อยแล้ว","50%","สูงกว่า 50% เพราะเหรียญกำลังมือขึ้น","ไม่รู้"],"a":1,"why":"การโยนแต่ละครั้งไม่เกี่ยวกัน เหรียญมัน \"จำ\" ไม่ได้หรอกว่าเคยออกอะไร"}]},{"type":"chain","scens":[{"intro":"ต้องตัดสินใจ: บริษัทคุณได้รับเชิญให้เข้าประมูลงานใหญ่ ค่าเตรียมเอกสาร 500,000 บาท ถ้าชนะได้กำไร 4,000,000 บาท มีคู่แข่ง 4 เจ้า บริษัทเคยชนะประมูลงานแบบนี้ 2 ใน 9 ครั้ง","steps":[{"l":"1. โอกาสชนะ: เริ่มจากสถิติที่เคยชนะ แล้วปรับตามเรื่องเฉพาะของรอบนี้ (บอกตัวเลขและเหตุผลที่ปรับ)","h":"สถิติเดิม ≈ 22% แล้วจะปรับขึ้นหรือลงเพราะอะไร"},{"l":"2. คิดว่าถ้าเข้าประมูล เฉลี่ยแล้วคุ้มแค่ไหน เทียบกับไม่เข้า","h":"เฉลี่ยแล้วได้ = โอกาสชนะ × 4,000,000 − 500,000"},{"l":"3. กรณีแย่สุดรับไหวไหม ถ้าแพ้ 3 รอบติดบริษัทจะเป็นยังไง","h":""},{"l":"4. มีข้อมูลอะไรที่หาได้ก่อนตัดสินใจ ที่จะเปลี่ยนโอกาสชนะได้เยอะ แล้วคุ้มที่จะไปหาไหม","h":""},{"l":"5. สรุปว่าจะเข้าหรือไม่ แล้วถ้าเจออะไรถึงจะเปลี่ยนใจ","h":""}],"check":["เริ่มจากสถิติจริงก่อนค่อยปรับ ไม่ได้เดาจากความรู้สึก","คิดเลขความคุ้มถูก","คิดถึงความเสี่ยงกรณีแย่ด้วย ไม่ได้ดูแค่ค่าเฉลี่ย","บอกได้ว่าข้อมูลแบบไหนจะเปลี่ยนการตัดสินใจ"]}]}]}

function flushRewards(){const bi=beltIdx(S.xp);if(S.belt===undefined){S.belt=bi;save()}
  const nb=BADGES.filter(b=>!S.badges.includes(b.id)&&b.t());if(nb.length){nb.forEach(b=>S.badges.push(b.id));save()}
  let wait=500;if(bi>S.belt){S.belt=bi;save();setTimeout(()=>levelUp(bi),500);wait=3200}
  nb.forEach((b,k)=>setTimeout(()=>badgePop(b),wait+k*2400))}

function levelUp(bi){const b=BELTS[bi];const o=document.createElement('div');o.className='lvup';o.onclick=()=>o.remove();

function countUp(id,to){const el=document.getElementById(id);if(!el)return;const t0=performance.now();const st=t=>{const p=Math.min(1,(t-t0)/900);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)}
function randomDrill(){const o=[];MODES.forEach(m=>m.levels.forEach((l,i)=>{if(unlocked(m.id,i))o.push([m.id,i])}));const [id,l]=pickOne(o);sfx('pop');toast(`🎲 ${ic(M(id))} ${M(id).en} — ระดับ${LV[l]}`);drill(id,l)}
