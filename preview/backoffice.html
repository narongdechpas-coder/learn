<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partner Desk Backoffice</title>
<meta name="description" content="Mockup ระบบหลังบ้านของ LINE OA Partner Desk: ภาพรวม, Action ของคู่ค้า, งานติดตามของ Marketing ตามขอบเขตคู่ค้า และการตั้งค่าสิทธิ์">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: work-tool shell. Fixed sidebar nav + top bar (role, theme); content swaps per view. Sidebar folds to a top strip on phones. */
:root {
  --page: #EEF2F6;
  --surface: #FFFFFF;
  --surface-2: #F5F8FB;
  --ink: #0F2438;
  --muted: #56677A;
  --line: #D5DDE6;
  --navy: #0E3A5B;
  --navy-2: #13507C;
  --side: #0E3A5B;
  --side-ink: #D7E4EF;
  --teal: #0A7C74;
  --teal-soft: #DDF1EE;
  --amber: #A86500;
  --amber-soft: #FBEBD2;
  --red: #B9382F;
  --red-soft: #F8DEDB;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --grid: #E3E9EF;
  --font-display: "Anuphan", "IBM Plex Sans Thai", "Leelawadee UI", "Thonburi", sans-serif;
  --font-body: "IBM Plex Sans Thai", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0B141D; --surface: #13202C; --surface-2: #182837; --ink: #E4ECF3; --muted: #93A4B5; --line: #263646;
    --navy: #2C6A99; --navy-2: #3B83B8; --side: #0A1823; --side-ink: #B8C9D8;
    --teal: #3FB8AC; --teal-soft: #11332F; --amber: #F0AA45; --amber-soft: #3A2A10; --red: #F07C72; --red-soft: #3A1A17;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --grid: #223242;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0B141D; --surface: #13202C; --surface-2: #182837; --ink: #E4ECF3; --muted: #93A4B5; --line: #263646;
  --navy: #2C6A99; --navy-2: #3B83B8; --side: #0A1823; --side-ink: #B8C9D8;
  --teal: #3FB8AC; --teal-soft: #11332F; --amber: #F0AA45; --amber-soft: #3A2A10; --red: #F07C72; --red-soft: #3A1A17;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --grid: #223242;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.25; text-wrap: balance; }
h1 { font-size: 24px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-size: 12.5px; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-ink); padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.brand .logo { width: 34px; height: 34px; border-radius: 10px; background: #0A7C74; display: grid; place-items: center; flex: none; }
.brand .logo svg { width: 19px; height: 19px; }
.brand b { font-family: var(--font-display); color: #fff; font-size: 15px; display: block; line-height: 1.2; }
.brand small { font-size: 11.5px; opacity: .75; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; color: var(--side-ink); padding: 9px 10px; border-radius: 10px; cursor: pointer; text-align: left; font-size: 14px; }
.nav button svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav button:hover { background: rgba(255, 255, 255, .06); }
.nav button[aria-current="page"] { background: rgba(255, 255, 255, .12); color: #fff; font-weight: 600; }
.nav .count { margin-left: auto; font-size: 11.5px; background: rgba(255, 255, 255, .14); color: #fff; padding: 0 7px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.nav .count.hot { background: #B9382F; }
.side-foot { margin-top: auto; font-size: 12px; opacity: .7; padding: 0 6px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; }
.top .now { color: var(--muted); font-size: 13px; }
.top .spacer { flex: 1; }
.role { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.role select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; color: var(--ink); max-width: 100%; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.seg button svg { width: 14px; height: 14px; }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.me { display: flex; align-items: center; gap: 8px; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #fff; background: var(--navy-2); flex: none; }
.av.sm { width: 24px; height: 24px; font-size: 10.5px; }
.me b { font-size: 13px; display: block; line-height: 1.2; }
.me small { font-size: 11.5px; color: var(--muted); }
.content { padding: 24px; display: grid; gap: 20px; align-content: start; min-width: 0; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.head p { color: var(--muted); margin-top: 4px; }
.scope { display: flex; gap: 8px; align-items: center; background: var(--teal-soft); color: var(--teal); padding: 8px 12px; border-radius: 10px; font-size: 13px; }
.scope svg { width: 16px; height: 16px; flex: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; padding: 12px 16px; gap: 10px; }
  .nav { display: flex; overflow-x: auto; gap: 4px; }
  .nav button { width: auto; white-space: nowrap; }
  .side-foot { display: none; }
  .top { padding: 10px 16px; position: static; }
  .content { padding: 16px; }
}

/* ---------- Building blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 2px; }
.kpi .lbl { font-size: 12.5px; color: var(--muted); }
.kpi .val { font-family: var(--font-display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .val small { font-size: 14px; font-weight: 500; color: var(--muted); }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi.alert { border-color: var(--red); }
@media (max-width: 600px) { .kpi:last-child:nth-child(odd) { grid-column: 1 / -1; } }
.kpi.alert .val { color: var(--red); }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 1100px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.chip svg { width: 11px; height: 11px; }
.chip.urgent { background: var(--red-soft); color: var(--red); }
.chip.high { background: var(--amber-soft); color: var(--amber); }
.chip.normal { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.chip.ok { background: var(--teal-soft); color: var(--teal); }
.cat { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.cat i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); flex: none; }
.btn { border: 0; border-radius: 10px; padding: 8px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; background: var(--navy); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.teal { background: var(--teal); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.link { border: 0; background: none; padding: 0; color: var(--navy-2); cursor: pointer; text-align: left; font-weight: 500; }
.link:hover { text-decoration: underline; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters input[type="search"], .filters select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-width: 0; }
.filters input[type="search"] { width: 220px; max-width: 100%; }
.filters label.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
td .me { white-space: nowrap; }
.team th, .team td { padding-inline: 10px; }
.grid-2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .grid-2.even { grid-template-columns: minmax(0, 1fr); } }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.meter { height: 8px; border-radius: 999px; background: var(--grid); overflow: hidden; width: 90px; display: inline-block; vertical-align: middle; margin-right: 8px; }
.meter i { display: block; height: 100%; background: var(--teal); }
.meter.warn i { background: var(--amber); }
.meter.bad i { background: var(--red); }

/* ---------- Charts ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.chart { position: relative; overflow-x: auto; }
.chart svg { min-width: 520px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover { fill: var(--ink); fill-opacity: .04; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 8px 24px -12px rgba(9, 30, 50, .35); min-width: 150px; z-index: 2; }
.tip b { display: block; margin-bottom: 4px; font-family: var(--font-display); }
.tip .row { display: flex; justify-content: space-between; gap: 14px; }
.tip .row span:last-child { font-variant-numeric: tabular-nums; }
.tip .tot { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; font-weight: 600; }
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: 130px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; }
.hbar .bar { height: 14px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.hbar .bar i { display: block; height: 100%; background: var(--c); border-radius: 0 4px 4px 0; }
.hbar .v { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- Lists ---------- */
.list { display: grid; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .t { font-weight: 500; }
.item .s { font-size: 12.5px; color: var(--muted); }
.due { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.due.late { color: var(--red); font-weight: 600; }

/* ---------- Kanban ---------- */
.board-wrap { overflow-x: auto; }
.board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 12px; min-width: 960px; }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 8px; align-content: start; }
.col h3 { display: flex; justify-content: space-between; padding: 2px 4px 4px; font-size: 14px; }
.col h3 span { color: var(--muted); font-family: var(--font-body); font-weight: 500; font-variant-numeric: tabular-nums; }
.task { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; cursor: pointer; text-align: left; width: 100%; }
.task:hover { border-color: var(--navy-2); }
.task.late { border-left: 3px solid var(--red); }
.task .t { font-weight: 600; font-size: 13.5px; line-height: 1.4; }
.task .p { font-size: 12.5px; color: var(--muted); }
.task .f { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.task .tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* ---------- Drawer + toast ---------- */
.veil { position: fixed; inset: 0; background: rgba(5, 15, 25, .45); z-index: 10; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); z-index: 11; display: flex; flex-direction: column; box-shadow: -20px 0 50px -30px rgba(0, 0, 0, .5); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer .dh { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.drawer .dh small { color: var(--muted); font-size: 12px; display: block; }
.drawer .x { border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; }
.drawer .db { padding: 18px 20px; overflow-y: auto; display: grid; gap: 18px; align-content: start; }
.drawer .df { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 6px 12px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.source { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: grid; gap: 2px; }
.timeline { display: grid; gap: 10px; border-left: 2px solid var(--line); padding-left: 14px; margin-left: 4px; }
.timeline div { position: relative; font-size: 13px; }
.timeline div::before { content: ""; position: absolute; left: -20px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--navy-2); }
.timeline small { color: var(--muted); display: block; font-size: 12px; }
.field { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.field select, .field textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--ink); width: 100%; font-size: 14px; }
.field textarea { min-height: 72px; resize: vertical; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 13.5px; z-index: 20; max-width: calc(100% - 32px); }

/* ---------- Settings ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 14px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--teal); font-weight: 600; }
.switch { position: relative; width: 38px; height: 22px; display: inline-block; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + span { background: var(--teal); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--teal); outline-offset: 2px; }
.yes { color: var(--teal); font-weight: 600; }
.no { color: var(--muted); }
td select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
@media (prefers-reduced-motion: reduce) { .switch span, .switch span::after { transition: none; } }

/* ---------- Monthly report ---------- */
.report { display: grid; gap: 18px; min-width: 0; }
.rep-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
.rep-head h1 { font-size: 26px; margin-top: 2px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); font-weight: 600; }
.rep-meta { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: 13px; margin: 0; }
.rep-meta dt { color: var(--muted); }
.rep-meta dd { margin: 0; }
.rep-sum ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 80ch; }
.rep-sec { display: grid; gap: 12px; min-width: 0; }
.rep-sec > h2 { display: flex; align-items: center; gap: 10px; font-size: 19px; }
.rep-sec .no { width: 26px; height: 26px; border-radius: 8px; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 14px; flex: none; }
.delta { color: var(--muted); font-variant-numeric: tabular-nums; }
tr.sumrow td { font-weight: 600; background: var(--surface-2); }
.rep-foot { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
@page { size: A4; margin: 12mm; }
@media print {
  :root, :root[data-theme], :root:not([data-theme="light"]) {
    --page: #FFFFFF; --surface: #FFFFFF; --surface-2: #F5F8FB; --ink: #0F2438; --muted: #56677A; --line: #D5DDE6;
    --navy: #0E3A5B; --navy-2: #13507C; --teal: #0A7C74; --teal-soft: #DDF1EE; --amber: #A86500; --amber-soft: #FBEBD2; --red: #B9382F; --red-soft: #F8DEDB;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --grid: #E3E9EF; color-scheme: light;
  }
  html, body { height: auto; background: #FFFFFF; font-size: 12px; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .side, .top, .no-print, .drawer, .veil, .toast, .scope, .tip { display: none !important; }
  .app { display: block; }
  .content { padding: 0; gap: 14px; }
  .kpis { grid-template-columns: repeat(4, 1fr); }
  .content, .report, .rep-sec, .grid-2, .grid-2.even, .card { display: block; }
  .report > *, .rep-sec > *, .grid-2 > *, .card > * + * { margin-top: 10px; }
  .report > *:first-child, .rep-sec > *:first-child { margin-top: 0; }
  .card { padding: 12px 14px; }
  .kpis, .card, .tbl, tr, .rep-sum, .rep-head { break-inside: avoid; }
  .rep-weekly { display: none; }
  .rep-sec > h2 { break-after: avoid; }
  .kpi .val { font-size: 20px; }
  .kpi { padding: 10px 12px; }
  .chart { overflow: visible; }
  .chart svg { min-width: 0; }
  .tbl { overflow: visible; }
}
</style>
</head>
<body>


<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.2-3 7.6-7 9-4-1.4-7-4.8-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div>

  function drawBars(elId, rows, labels, o) {

        } else g += '<rect x="' + x + '" y="' + (y0 - h) + '" width="' + w + '" height="' + h + '" style="fill:' + cats[catKeys[i]].c + '"/>';
      });
      if ((d + 1) % (o.every || 1) === 0 || d === n - 1) g += '<text x="' + (x + w / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + labels[d] + '</text>';
      if (o.labelAll) g += '<text x="' + (x + w / 2) + '" y="' + (y(tot[d]) - 6) + '" text-anchor="middle" style="fill:var(--ink);font-weight:600">' + nf(tot[d]) + '</text>';
      g += '<rect class="hit" data-d="' + d + '" x="' + (L + bw * d) + '" y="' + Tp + '" width="' + bw + '" height="' + (H - Tp - B) + '"/>';
    });

    el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + o.aria + '">' + g + '</svg><div class="tip" hidden></div>';
    const tip = el.querySelector('.tip');

      const show = () => {
        const d = +h.dataset.d, r = rows[d];

    });

      (A.overdue.length ? '<div class="tbl"><table><thead><tr><th>คู่ค้า</th><th>เลขที่บิล</th><th class="r">ยอด</th></tr></thead><tbody>' + A.overdue.map(b => '<tr><td>' + P[b[0]].name + '</td><td class="mono">' + b[1] + '</td><td class="r">' + baht(b[2]) + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="muted">ไม่มีบิลเกินกำหนด</p>') +
      '</div></div></section>' +
      '<footer class="rep-foot">ข้อมูลตัวอย่างสมมติ · สร้างจากระบบหลังบ้าน Partner Desk · ' + mo.label + '</footer>' +
      '</article>';
  }
  function drawReport() {
    drawBars('repChart', agg(S.repMonth).weeks, weekLabels, { labelAll: true, barMax: 64, aria: 'กราฟแท่งซ้อน จำนวน Action รายสัปดาห์ แยกตามเมนู' });
  }

  /* ================= Settings (Admin) ================= */
  function vSettings() {
    const tabs = [['users', 'ผู้ใช้และสิทธิ์'], ['assign', 'มอบหมายคู่ค้า'], ['rules', 'กฎสร้างงานอัตโนมัติ']];
    let body = '';
    if (S.setTab === 'users') {
      const perms = [
        ['ดูภาพรวมและ Action ของคู่ค้า', 'ทุกราย', 'ทุกราย', 'เฉพาะคู่ค้าของตน'],
        ['รับงานและบันทึกผล', '✓', '✓', 'เฉพาะงานของตน'],
        ['มอบหมายงานให้คนอื่น', '✓', '✓', '–'],
        ['เปลี่ยน Marketing ผู้ดูแลคู่ค้า', '✓', '–', '–'],
        ['ตั้งกฎสร้างงานและ SLA', '✓', '–', '–'],
        ['จัดการผู้ใช้และสิทธิ์', '✓', '–', '–']
      ];
      const cell = v => v === '✓' ? '<span class="yes">✓</span>' : v === '–' ? '<span class="no">–</span>' : v;
      body = '<div class="tbl"><table><thead><tr><th>ผู้ใช้</th><th>บทบาท</th><th>ตำแหน่ง</th><th>ขอบเขตข้อมูล</th><th>สถานะ</th></tr></thead><tbody>' +
        Object.keys(users).map(k => '<tr><td><span class="me">' + av(k, true) + users[k].name + '</span></td><td>' + users[k].role + '</td><td>' + users[k].title + '</td><td>' + (mkts.includes(k) ? 'คู่ค้า ' + partners.filter(p => p.owner === k).length + ' ราย' : 'คู่ค้าทุกราย') + '</td><td><span class="chip ok">ใช้งาน</span></td></tr>').join('') +
        '</tbody></table></div><h2>สิทธิ์ตามบทบาท</h2><div class="tbl"><table><thead><tr><th>สิทธิ์</th><th>Admin</th><th>หัวหน้าทีม</th><th>Marketing</th></tr></thead><tbody>' +
        perms.map(r => '<tr><td>' + r[0] + '</td>' + r.slice(1).map(v => '<td>' + cell(v) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
    } else if (S.setTab === 'assign') {
      body = '<p class="muted">เปลี่ยน Marketing ผู้ดูแลแล้ว งานที่ยังเปิดอยู่ของคู่ค้ารายนั้นจะย้ายไปให้ผู้ดูแลคนใหม่ทันที</p><div class="tbl"><table><thead><tr><th>คู่ค้า</th><th>ประเภท</th><th>Marketing ผู้ดูแล</th><th class="r">งานเปิด</th></tr></thead><tbody>' +
        partners.map(p => '<tr><td>' + p.name + '<div class="muted mono">' + p.id + '</div></td><td>' + p.type + '</td><td><select data-assign="' + p.id + '" aria-label="ผู้ดูแล ' + p.name + '">' + mkts.map(m => '<option value="' + m + '"' + (p.owner === m ? ' selected' : '') + '>' + users[m].name + '</option>').join('') + '</select></td><td class="r">' + tasks.filter(t => t.pid === p.id && t.st !== 'done').length + '</td></tr>').join('') +
        '</tbody></table></div>';
    } else {
      body = '<p class="muted">ระบบตรวจ Action ของคู่ค้าและข้อมูลกรมธรรม์/บิลตามกฎด้านล่าง แล้วสร้างงานให้ Marketing ที่ดูแลคู่ค้ารายนั้น</p><div class="tbl"><table><thead><tr><th>กฎ</th><th>เมื่อ</th><th>สร้างงาน</th><th>SLA</th><th>ความสำคัญ</th><th>แจ้ง Marketing ทาง</th><th>เปิดใช้</th></tr></thead><tbody>' +
        rules.map(r => '<tr><td class="mono">' + r.id + '</td><td>' + r.when + '</td><td>' + r.task + '</td><td class="num">' + r.sla + '</td><td>' + prChip(r.pr) + '</td><td>' + r.notify + '</td><td><label class="switch"><input type="checkbox" data-rule="' + r.id + '"' + (r.on ? ' checked' : '') + ' aria-label="เปิดใช้กฎ ' + r.id + '"><span></span></label></td></tr>').join('') +
        '</tbody></table></div>';
    }
    return '<div class="head"><div><h1>ตั้งค่าระบบ</h1><p>เฉพาะ Admin</p></div></div><div class="tabs" role="tablist">' +
      tabs.map(t => '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (S.setTab === t[0]) + '">' + t[1] + '</button>').join('') + '</div>' + body;
  }

  /* ================= Drawers ================= */
  function openDrawer(html) { $('drawer').innerHTML = html; $('drawer').hidden = false; $('veil').hidden = false; const f = $('drawer').querySelector('.x'); if (f) f.focus(); }
  function closeDrawer() { $('drawer').hidden = true; $('veil').hidden = true; }
  function taskDrawer(id) {
    const t = T[id], p = P[t.pid], r = R[t.rule];
    if (!inScope(t.pid)) { toast('งานนี้อยู่นอกขอบเขตคู่ค้าของคุณ'); return; }
    const mine = t.owner === S.role, can = mine || canManage();
    let foot = '';
    if (t.st !== 'done' && can) {
      if (t.st === 'new') foot += '<button type="button" class="btn" data-move="doing">รับงาน</button>';
      if (t.st !== 'waiting') foot += '<button type="button" class="btn ghost" data-move="waiting">รอคู่ค้าตอบ</button>';
      if (t.st === 'waiting') foot += '<button type="button" class="btn ghost" data-move="doing">กลับมาดำเนินการ</button>';
      foot += '<button type="button" class="btn teal" id="doClose">ปิดงาน</button>';
    }
    openDrawer('<div class="dh"><div><small class="mono">' + t.id + ' · กฎ ' + r.id + '</small><h2 id="drawerTitle">' + t.title + '</h2></div><button type="button" class="x" data-close aria-label="ปิด">×</button></div>' +
      '<div class="db">' +
      '<div class="tags" style="display:flex;gap:6px;flex-wrap:wrap">' + prChip(r.pr) + stChip(t.st) + catTag(ruleCat(t.rule)) + '</div>' +
      '<dl class="kv"><dt>คู่ค้า</dt><dd><button type="button" class="link" data-partner="' + p.id + '">' + p.name + '</button> <span class="muted mono">' + p.id + '</span></dd>' +
      '<dt>สิ่งที่ต้องทำ</dt><dd>' + r.task + '</dd><dt>สร้างเมื่อ</dt><dd>' + t.created + '</dd><dt>กำหนดเสร็จ</dt><dd><span class="due' + (t.late && t.st !== 'done' ? ' late' : '') + '">' + t.due + '</span> (SLA ' + r.sla + ')</dd>' +
      '<dt>ผู้รับผิดชอบ</dt><dd>' + (canManage() && t.st !== 'done' ? '<select id="reassign" aria-label="มอบหมายให้">' + mkts.map(m => '<option value="' + m + '"' + (t.owner === m ? ' selected' : '') + '>' + users[m].name + '</option>').join('') + '</select>' : '<span class="me">' + av(t.owner, true) + users[t.owner].name + '</span>') + '</dd></dl>' +
      '<div><h3 style="margin-bottom:6px">ที่มาของงาน</h3><div class="source"><span>' + t.src + '</span><span class="muted">เงื่อนไข: ' + r.when + '</span></div></div>' +
      (t.outcome ? '<div><h3 style="margin-bottom:6px">ผลการดำเนินการ</h3><div class="source">' + esc(t.outcome) + '</div></div>' : '') +
      '<div><h3 style="margin-bottom:8px">ประวัติ</h3><div class="timeline"><div>ระบบสร้างงาน และแจ้ง ' + users[t.owner].name + ' ทาง ' + r.notify + '<small>' + t.created + '</small></div>' + t.log.map(l => '<div>' + esc(l[1]) + '<small>' + l[0] + '</small></div>').join('') + '</div></div>' +
      (t.st !== 'done' && can ? '<div id="closeForm" hidden style="display:grid;gap:10px"><label class="field" for="outcome">ผลการดำเนินการ<select id="outcome"><option>ปิดการขายได้</option><option>แก้ปัญหาแล้ว</option><option>คู่ค้าชำระแล้ว</option><option>คู่ค้าไม่สนใจ</option><option>อื่นๆ</option></select></label><label class="field" for="note">บันทึกเพิ่มเติม<textarea id="note" placeholder="เช่น โทรคุยกับคุณนิดาแล้ว จะส่งเอกสารเคลมภายในวันนี้"></textarea></label><button type="button" class="btn teal" id="confirmClose">ยืนยันปิดงาน</button></div>' : '') +
      (!can ? '<p class="muted">งานนี้เป็นของ ' + users[t.owner].name + ' คุณดูได้อย่างเดียว</p>' : '') +
      '</div>' + (foot ? '<div class="df">' + foot + '</div>' : ''));
    const d = $('drawer');
    d.querySelectorAll('[data-move]').forEach(b => b.addEventListener('click', () => { t.st = b.dataset.move; t.log.push(['วันนี้ 10:30', users[S.role].name + ' เปลี่ยนสถานะเป็น “' + stName[t.st] + '”']); toast(t.id + ' · ' + stName[t.st]); render(); taskDrawer(id); }));
    const dc = $('doClose'); if (dc) dc.addEventListener('click', () => { $('closeForm').hidden = false; $('outcome').focus(); });
    const cc = $('confirmClose'); if (cc) cc.addEventListener('click', () => {
      const note = $('note').value.trim();
      t.st = 'done'; t.late = false; t.due = 'ปิดแล้ว วันนี้ 10:30'; t.outcome = $('outcome').value + (note ? ' · ' + note : '');
      t.log.push(['วันนี้ 10:30', users[S.role].name + ' ปิดงาน: ' + t.outcome]); toast('ปิดงาน ' + t.id + ' แล้ว'); render(); taskDrawer(id);
    });
    const ra = $('reassign'); if (ra) ra.addEventListener('change', () => { t.owner = ra.value; t.log.push(['วันนี้ 10:30', users[S.role].name + ' มอบหมายงานให้ ' + users[t.owner].name]); toast('มอบหมาย ' + t.id + ' ให้ ' + users[t.owner].name + ' แล้ว'); render(); taskDrawer(id); });
  }
  function partnerDrawer(id) {
    const p = P[id]; if (!inScope(id)) return;
    const acts = activities.filter(a => a.pid === id), ts = tasks.filter(t => t.pid === id);
    openDrawer('<div class="dh"><div><small class="mono">' + p.id + '</small><h2 id="drawerTitle">' + p.name + '</h2></div><button type="button" class="x" data-close aria-label="ปิด">×</button></div><div class="db">' +
      '<dl class="kv"><dt>ประเภท</dt><dd>' + p.type + ' · ' + p.tier + '</dd><dt>Marketing ผู้ดูแล</dt><dd><span class="me">' + av(p.owner, true) + users[p.owner].name + '</span></dd><dt>ผู้ใช้ LINE ที่ผูก</dt><dd>' + p.line + ' คน</dd><dt>ใช้งานล่าสุด</dt><dd>' + p.last + '</dd><dt>วงเงินที่ใช้</dt><dd class="num">' + meter(p.credit) + p.credit + '%</dd></dl>' +
      '<div><h3 style="margin-bottom:6px">งานติดตาม</h3><div class="list">' + (ts.length ? ts.map(t => '<div class="item">' + prChip(R[t.rule].pr) + '<div><button type="button" class="link t" data-task="' + t.id + '">' + t.title + '</button><div class="s">' + stName[t.st] + '</div></div><span class="due' + (t.late && t.st !== 'done' ? ' late' : '') + '">' + t.due + '</span></div>').join('') : '<div class="muted">ไม่มีงาน</div>') + '</div></div>' +
      '<div><h3 style="margin-bottom:8px">Action วันนี้</h3>' + (acts.length ? '<div class="timeline">' + acts.map(a => '<div>' + catTag(a.cat) + ' ' + a.act + ' · ' + a.detail + '<small>' + a.t + ' น. · ' + a.who + '</small></div>').join('') + '</div>' : '<p class="muted">วันนี้ยังไม่มี Action</p>') + '</div>' +
      '</div>');
  }

  /* ================= Events ================= */
  document.addEventListener('click', e => {
    const v = e.target.closest('[data-view]'); if (v) { S.view = v.dataset.view; closeDrawer(); render(); window.scrollTo(0, 0); return; }
    const tk = e.target.closest('[data-task]'); if (tk) { taskDrawer(tk.dataset.task); return; }
    const pt = e.target.closest('[data-partner]'); if (pt) { partnerDrawer(pt.dataset.partner); return; }
    if (e.target.closest('[data-close]') || e.target === $('veil')) { closeDrawer(); return; }
    if (e.target.closest('#repPrint')) { window.print(); return; }
    const tab = e.target.closest('[data-tab]'); if (tab) { S.setTab = tab.dataset.tab; render(); return; }
    if (e.target.closest('#vChart') || e.target.closest('#vTable')) {
      const tbl = e.target.closest('#vTable') !== null;
      $('stack').hidden = tbl; $('stackTable').hidden = !tbl;
      $('vChart').setAttribute('aria-pressed', String(!tbl)); $('vTable').setAttribute('aria-pressed', String(tbl));
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('drawer').hidden) closeDrawer(); });
  document.addEventListener('input', e => {
    if (e.target.id === 'fQ') { S.actQ = e.target.value; const pos = e.target.selectionStart; render(); const q = $('fQ'); q.focus(); q.setSelectionRange(pos, pos); }
  });
  document.addEventListener('change', e => {
    const id = e.target.id;
    if (id === 'roleSel') { S.role = e.target.value; S.actOwner = ''; S.taskOwner = ''; S.repOwner = ''; closeDrawer(); render(); toast('สลับเป็นมุมมอง ' + users[S.role].role + ' · ' + users[S.role].name); }
    else if (id === 'fCat') { S.actCat = e.target.value; render(); }
    else if (id === 'fOwner') { S.actOwner = e.target.value; render(); }
    else if (id === 'fTask') { S.actTaskOnly = e.target.checked; render(); }
    else if (id === 'fTaskOwner') { S.taskOwner = e.target.value; render(); }
    else if (id === 'repMonth') { S.repMonth = +e.target.value; render(); }
    else if (id === 'repOwner') { S.repOwner = e.target.value; render(); }
    else if (e.target.dataset.assign) {
      const p = P[e.target.dataset.assign], to = e.target.value;
      const moved = tasks.filter(t => t.pid === p.id && t.st !== 'done');
      p.owner = to; moved.forEach(t => { t.owner = to; t.log.push(['วันนี้ 10:30', 'Admin เปลี่ยนผู้ดูแลคู่ค้าเป็น ' + users[to].name]); });
      render(); toast('ย้าย ' + p.name + ' และงานที่เปิดอยู่ ' + moved.length + ' งานไปให้ ' + users[to].name + ' แล้ว');
    }
    else if (e.target.dataset.rule) { R[e.target.dataset.rule].on = e.target.checked; toast('กฎ ' + e.target.dataset.rule + (e.target.checked ? ' เปิดใช้แล้ว' : ' ปิดแล้ว')); }
  });

  /* ================= Theme ================= */
  const root = document.documentElement, darkMq = window.matchMedia('(prefers-color-scheme: dark)');
  const showTheme = () => { const t = root.dataset.theme || (darkMq.matches ? 'dark' : 'light'); $('th-light').setAttribute('aria-pressed', String(t === 'light')); $('th-dark').setAttribute('aria-pressed', String(t === 'dark')); };
  const setTheme = t => { root.dataset.theme = t; try { localStorage.setItem('pd-bo-theme', t); } catch (err) {} showTheme(); };
  try { const s = localStorage.getItem('pd-bo-theme'); if (s === 'light' || s === 'dark') root.dataset.theme = s; } catch (err) {}
  $('th-light').addEventListener('click', () => setTheme('light'));
  $('th-dark').addEventListener('click', () => setTheme('dark'));
  if (darkMq.addEventListener) darkMq.addEventListener('change', showTheme);
  showTheme();

  render();
})();
</script>

</body>
</html>
